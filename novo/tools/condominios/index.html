<script>
(function(){
  try{
    var t = localStorage.getItem('fb-portal-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  function updateLogo(){
    var img = document.getElementById('brand-logo-img');
    if(!img) return;
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    img.src = light ? '../../assets/logo-light.png' : '../../assets/logo-dark.png';
  }
  window.addEventListener('storage', function(e){
    if(e.key === 'fb-portal-theme'){
      if(e.newValue === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
      updateLogo();
    }
  });
  document.addEventListener('DOMContentLoaded', updateLogo);
})();
</script>

function ehContaCliente(){ return !!(currentProfile && ['cliente', 'conselheiro', 'sindico'].indexOf(currentProfile.role) >= 0); }

// ?_subtabs=a,b quando o admin restringiu (Editar abas); sem o parâmetro, a pessoa vê todas as comuns.
// "sessoes-julgamento" é área restrita: só o admin ou quem tem a liberação explícita (as regras conferem de novo).
var SUBABAS_PERMITIDAS = (function(){
  try {
    var v = new URLSearchParams(location.search).get('_subtabs');
    return v ? v.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : null;
  } catch (e) { return null; }
})();
var podeSessoesEquipe = false;   // calculado quando o cadastro chega (admin, ou sub-aba liberada)
function subabaLiberada(id){
  if (id === 'sessoes-julgamento') return podeSessoesEquipe;
  return !SUBABAS_PERMITIDAS || SUBABAS_PERMITIDAS.indexOf(id) >= 0;
}
function calcularPodeSessoes(){
  if (!currentProfile) return Promise.resolve(false);
  if (currentProfile.role === 'admin') return Promise.resolve(true);
  return db.collection('configPortal').doc('abas').get().then(function(d){
    var tid = d.exists ? d.data().condominios : '';
    var subs = (currentProfile.subtabs || {})[tid] || [];
    return !!tid && (currentProfile.tabs || []).indexOf(tid) >= 0 && subs.indexOf('sessoes-julgamento') >= 0;
  }).catch(function(){ return false; });
}
function secaoPermitida(section){
  if (!ehContaCliente()) return section === 'inicio' || subabaLiberada(section);
  return section === 'inicio' || (section === 'gerar-notificacao' && souAprovador);
}

function carregarDadosPrivadosCondo(){
  db.collection('dadosPrivados').doc('condominios').get().then(function(snap){
    if (!snap.exists) { dadosCondoStatus = 'sem-dados'; render(); return; }
    var d = JSON.parse(snap.data().json);
    CONDOMINIOS.length = 0;
    Array.prototype.push.apply(CONDOMINIOS, d.condominios || []);
    Object.keys(RELATORIOS).forEach(function(k){ delete RELATORIOS[k]; });
    Object.assign(RELATORIOS, d.relatorios || {});
    PROCEDIMENTOS = Object.assign({ avisos: [], regrasEspeciais: [], modelos: [] }, d.procedimentos || {});
    dadosCondoStatus = 'ok';

// Relatórios em PDF/PNG: vêm de arquivosPrivados/{id} (partes em base64), nunca de um link público.
function baixarArquivoPrivado(id, nome){
  var ref = db.collection('arquivosPrivados').doc(id);
  return ref.get().then(function(meta){
    if (!meta.exists) throw new Error('arquivo não encontrado');
    var m = meta.data(), pedidos = [];
    for (var i = 0; i < m.partes; i++) pedidos.push(ref.collection('partes').doc(String(i)).get());
    return Promise.all(pedidos).then(function(ps){
      var b64 = ps.map(function(p){ return p.data().b64; }).join('');
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      var url = URL.createObjectURL(new Blob([bytes], { type: m.tipo || 'application/octet-stream' }));
      var a = document.createElement('a'); a.href = url; a.download = nome || m.nome || id;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    });
  }).catch(function(err){ alert('Não foi possível baixar o arquivo: ' + err.message); });
}
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('[data-arquivo-privado]');
  if (!a) return;
  e.preventDefault();
  baixarArquivoPrivado(a.getAttribute('data-arquivo-privado'), a.getAttribute('data-arquivo-privado'));
});

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function slugify(s){
  var accentRange = new RegExp('[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g');
  return (s || '').toString().toLowerCase()
    .normalize('NFD').replace(accentRange,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
}

function formatDateTime(ts){
  if (!ts || !ts.toDate) return '—';
  return ts.toDate().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

  if (!secaoPermitida(section)) section = 'inicio';

  render(); window.scrollTo(0,0);

function setCondoView(v){ state.condoView = v; state.condoIdx = null; render(); window.scrollTo(0,0); carregarUnidades(); }

function renderNav(){

  nav.innerHTML = '<button type="button" class="voltar-inicio" data-s="inicio">← Início</button>'
    + SECTIONS.filter(function(s){ return s.id !== 'inicio' && !ehContaCliente() && subabaLiberada(s.id); }).map(function(s){
      var active = s.id === state.section ? ' active' : '';
      return '<button type="button" class="'+active+'" data-s="'+s.id+'">'+s.label+'</button>';
    }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-s')); });

function render(){
  document.documentElement.classList.toggle('on-hub', state.section === 'inicio');
  renderNav();
  var m = document.getElementById('main');
  if(state.section === 'inicio') m.innerHTML = viewInicio();
  else if(state.section === 'comece') m.innerHTML = viewComece();

function bindDynamic(){

function carregarUnidades(){

  db.collection('condoUnidades').get().then(function(snap){
    var mapa = {};
    snap.docs.forEach(function(d){ mapa[d.id] = d.data(); });

function salvarUnidades(slug, condominioNome){
  var el = document.getElementById('unid-input-'+slug);
  var n = el ? parseInt(el.value, 10) : NaN;
  if (!n || n <= 0){ alert('Informe um número de unidades válido.'); return; }
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('condoUnidades').doc(slug).set({
    condominio: condominioNome, unidades: n,
    atualizadoPorUid: currentUser.uid, atualizadoPorNome: nome,
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    unidadesState.porSlug[slug] = { condominio: condominioNome, unidades: n };
    unidadesState.editando = null;
    render();
  }).catch(function(e){ alert('Erro ao salvar: ' + e.message); });
}

var calcState = {
  tab:'assembleia',
  assembleia:{ condominio:'', unidadesOverride:'', itens:[], nextId:1 },
  datas:{ dias:'', direcao:'somar', resultado:null }
};

function parseBRL(s){
  if (!s) return 0;
  s = String(s).trim().replace(/[R$\s]/g,'');
  if (s.indexOf(',') > -1) s = s.replace(/\./g,'').replace(',', '.');
  return parseFloat(s) || 0;
}

function fmtBRL(n){ return 'R$ ' + (n||0).toFixed(2).replace('.',','); }

function calcSubnav(active){

    + '<button type="button" class="'+(active==='datas'?'active':'')+'" data-calctab="datas">📅 Calculadora de Datas</button>'
    + '</div>';
}

function unidadesEfetivasAssembleia(){

function viewCalcAssembleia(){
  var a = calcState.assembleia;
  var slug = a.condominio ? slugify(a.condominio) : '';

        return '<option value="'+escapeHtml(c.nome)+'"'+sel+'>'+escapeHtml(c.nome)+'</option>';

  var unidadesInfo = '';

    unidadesInfo = registro
      ? '<div class="field-box"><div class="label">Nº de unidades cadastrado</div><div class="value">'+registro.unidades+'</div></div>'
      : '<div style="grid-column:1/-1;"><div class="warn gold" style="margin-bottom:10px;"><span class="ic">🕒</span><span>Este condomínio ainda não tem número de unidades cadastrado na aba Clientes. Informe manualmente abaixo (só vale para este cálculo) ou cadastre lá para os próximos cálculos já virem prontos.</span></div>'
        + '<div style="max-width:260px;"><label>Unidades (manual, só para este cálculo)</label><input id="calc-unidades-manual" type="number" min="1" value="'+escapeHtml(a.unidadesOverride)+'"></div></div>';
  }

  var itensHtml = a.itens.map(function(item){
    var valorNum = parseBRL(item.valor);
    return '<div class="assign-row" style="gap:8px;">'
      + '<input type="checkbox" id="item-inc-'+item.id+'" data-item-check="'+item.id+'" '+(item.incluido?'checked':'')+' style="flex:0 0 auto;width:18px;height:18px;">'
      + '<input type="text" id="item-desc-'+item.id+'" data-item-desc="'+item.id+'" placeholder="Descrição do item da pauta" value="'+escapeHtml(item.desc)+'" style="flex:2 1 200px;padding:8px 10px;border:1px solid var(--card-line);border-radius:6px;font-size:.82rem;background:var(--card);color:var(--text);">'
      + '<input type="text" id="item-valor-'+item.id+'" data-item-valor="'+item.id+'" placeholder="Valor total R$" value="'+escapeHtml(item.valor)+'" style="flex:1 1 120px;padding:8px 10px;border:1px solid var(--card-line);border-radius:6px;font-size:.82rem;background:var(--card);color:var(--text);">'
      + '<span id="item-calc-'+item.id+'" style="flex:1 1 140px;font-size:.8rem;color:var(--gold);">'+(unidadesEfetivas ? fmtBRL(valorNum/unidadesEfetivas)+' / unidade' : '—')+'</span>'
      + '<button type="button" class="btn ghost" data-remove-item="'+item.id+'" style="padding:6px 10px;">✕</button>'
      + '</div>';
  }).join('');

  var totalMarcado = a.itens.filter(function(i){ return i.incluido; }).reduce(function(s,i){ return s + parseBRL(i.valor); }, 0);

  return '<div class="box">'
    + '<div class="nom-form" style="margin-bottom:14px;">' + condominioField + unidadesInfo + '</div>'
    + (a.condominio ? (
        '<button type="button" class="btn secondary" id="calc-add-item" style="margin-bottom:14px;">+ Adicionar item de pauta</button>'
        + '<div id="calc-itens-lista">' + (itensHtml || '<p style="color:var(--muted);font-size:.85rem;">Nenhum item adicionado ainda.</p>') + '</div>'

          + '<p style="margin:0;font-size:.9rem;">Total marcado: <b id="calc-total-marcado">'+fmtBRL(totalMarcado)+'</b></p>'
          + '<p style="margin:6px 0 0;font-size:1.05rem;color:var(--red);"><b>Valor individual por unidade: <span id="calc-total-unidade">'+(unidadesEfetivas ? fmtBRL(totalMarcado/unidadesEfetivas) : '—')+'</span></b></p>'
          + (unidadesEfetivas ? '' : '<p id="calc-total-aviso" style="margin:6px 0 0;font-size:.78rem;color:var(--muted);">Informe o número de unidades para calcular.</p>')
        + '</div>'
      ) : '')
    + '</div>';

function addItemPauta(){
  var a = calcState.assembleia;
  a.itens.push({ id:a.nextId++, desc:'', valor:'', incluido:true });
  render();
}

function removerItemPauta(id){
  calcState.assembleia.itens = calcState.assembleia.itens.filter(function(i){ return i.id !== parseInt(id,10); });
  render();
}

function recalcularAssembleia(){
  var a = calcState.assembleia;
  var manualEl = document.getElementById('calc-unidades-manual');
  if (manualEl) a.unidadesOverride = manualEl.value;
  var unidadesEfetivas = unidadesEfetivasAssembleia();

  var total = 0;
  a.itens.forEach(function(item){
    var descEl = document.getElementById('item-desc-'+item.id);
    var valorEl = document.getElementById('item-valor-'+item.id);
    var checkEl = document.getElementById('item-inc-'+item.id);
    if (descEl) item.desc = descEl.value;
    if (valorEl) item.valor = valorEl.value;
    if (checkEl) item.incluido = checkEl.checked;
    var valorNum = parseBRL(item.valor);
    var calcEl = document.getElementById('item-calc-'+item.id);
    if (calcEl) calcEl.textContent = unidadesEfetivas ? (fmtBRL(valorNum/unidadesEfetivas)+' / unidade') : '—';
    if (item.incluido) total += valorNum;
  });

  var totalEl = document.getElementById('calc-total-marcado');
  var totalUnidEl = document.getElementById('calc-total-unidade');
  if (totalEl) totalEl.textContent = fmtBRL(total);
  if (totalUnidEl) totalUnidEl.textContent = unidadesEfetivas ? fmtBRL(total/unidadesEfetivas) : '—';
}

var DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MESES_EXTENSO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function calcularPascoa(ano){
  var a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(ano, mes-1, dia);
}
function addDiasData(data, n){ var d = new Date(data.getTime()); d.setDate(d.getDate()+n); return d; }
function mesmoDia(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function formatarDataExtenso(d){ return d.getDate()+' de '+MESES_EXTENSO[d.getMonth()]+' de '+d.getFullYear(); }
function formatarDataCurta(d){ return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }

var FERIADOS_FIXOS = [
  {m:0,d:1,nome:'Confraternização Universal',tipo:'nacional'},
  {m:3,d:21,nome:'Tiradentes',tipo:'nacional'},
  {m:4,d:1,nome:'Dia do Trabalho',tipo:'nacional'},
  {m:7,d:31,nome:'Emancipação Político-Administrativa de Uberlândia',tipo:'municipal'},
  {m:8,d:7,nome:'Independência do Brasil',tipo:'nacional'},
  {m:9,d:12,nome:'Nossa Senhora Aparecida',tipo:'nacional'},
  {m:10,d:2,nome:'Finados',tipo:'nacional'},
  {m:10,d:15,nome:'Proclamação da República',tipo:'nacional'},
  {m:10,d:20,nome:'Dia Nacional de Zumbi e da Consciência Negra',tipo:'nacional'},
  {m:11,d:25,nome:'Natal',tipo:'nacional'}
];

function verificarFeriado(data){
  for (var i=0;i<FERIADOS_FIXOS.length;i++){
    var f = FERIADOS_FIXOS[i];
    if (data.getMonth()===f.m && data.getDate()===f.d) return f;
  }
  var pascoa = calcularPascoa(data.getFullYear());
  if (mesmoDia(data, addDiasData(pascoa,-2))) return {nome:'Sexta-feira Santa', tipo:'nacional'};
  if (mesmoDia(data, addDiasData(pascoa,-48)) || mesmoDia(data, addDiasData(pascoa,-47))) return {nome:'Carnaval', tipo:'facultativo'};
  if (mesmoDia(data, addDiasData(pascoa,60))) return {nome:'Corpus Christi', tipo:'facultativo'};
  return null;
}

        + '<option value="subtrair"'+(d.direcao==='subtrair'?' selected':'')+'>Subtrair (data passada)</option>'
        + '</select></div>'
    + '</div>'
    + '<button type="button" class="btn" id="calc-dias-calcular" style="margin-top:12px;">Calcular</button>'
    + resultadoHtml
  + '</div>';
}

function calcularData(){
  var qtdEl = document.getElementById('calc-dias-qtd');
  var dirEl = document.getElementById('calc-dias-direcao');
  var qtd = parseInt(qtdEl ? qtdEl.value : '0', 10) || 0;
  var dir = dirEl ? dirEl.value : 'somar';
  calcState.datas.dias = qtd; calcState.datas.direcao = dir;
  var delta = dir === 'subtrair' ? -qtd : qtd;
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var alvo = addDiasData(hoje, delta);
  var feriado = verificarFeriado(alvo);
  var diaSemanaNum = alvo.getDay();
  calcState.datas.resultado = {
    dataExtenso: formatarDataExtenso(alvo), dataCurta: formatarDataCurta(alvo),
    diaSemana: DIAS_SEMANA[diaSemanaNum], feriado: feriado,
    fimDeSemana: (diaSemanaNum===0 || diaSemanaNum===6)
  };
  render();
}

    var manualEl = document.getElementById('calc-unidades-manual');

    var addBtn = document.getElementById('calc-add-item');
    if (addBtn) addBtn.addEventListener('click', addItemPauta);
    Array.prototype.forEach.call(document.querySelectorAll('[data-remove-item]'), function(el){
      el.addEventListener('click', function(){ removerItemPauta(el.getAttribute('data-remove-item')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-item-check]'), function(el){

    });

  }
}

/* ---------- ocorrências por unidade (reincidência + zerar) ---------- */

function unidadeResetDocId(condominioSlug, torre, apto){
  return slugify(condominioSlug+'-T'+torre+'-'+apto);
}

function fetchUnidadeReset(condominioSlug, torre, apto){
  return db.collection('unidadeResets').doc(unidadeResetDocId(condominioSlug, torre, apto)).get().then(function(doc){
    return doc.exists ? doc.data() : null;
  });
}

function fetchOcorrenciasUnidade(condominioSlug, torre, apto, apenasAprovadas){
  var q = db.collection('notificacoesGeradas')
    .where('condominioSlug','==',condominioSlug)
    .where('torre','==',torre)
    .where('apto','==',apto);
  if (apenasAprovadas) q = q.where('status','==','aprovada');
  return q.get().then(function(snap){
    return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
}

function aplicarCorteReset(itens, reset){
  if (!reset || !reset.resetAPartirDe) return itens;
  var corte = new Date(reset.resetAPartirDe+'T00:00:00');
  return itens.filter(function(n){
    return !(n.criadoEm && n.criadoEm.toDate && n.criadoEm.toDate() < corte);
  });
}

function ordenarPorData(itens){
  itens.sort(function(a,b){
    var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
    var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
    return tb - ta;
  });
  return itens;
}

function consultarReincidencia(){
  var condominioSlug = slugify(gerarState.condSel || '');
  var torre = gerarState.draft.torre, apto = gerarState.draft.apto;
  if (!torre || !apto){ alert('Preencha torre e apartamento primeiro.'); return; }
  gerarState.reincidencia = { loading:true };
  render();
  Promise.all([
    fetchUnidadeReset(condominioSlug, torre, apto),
    fetchOcorrenciasUnidade(condominioSlug, torre, apto, true)
  ]).then(function(res){
    var reset = res[0], itens = ordenarPorData(aplicarCorteReset(res[1], reset));
    gerarState.reincidencia = { loading:false, total: itens.length, itens: itens, reset: reset };
    render();
  }).catch(function(e){
    gerarState.reincidencia = { loading:false, error: e.message };
    render();
  });
}

function loadMinhasNotificacoes(){
  if (!fbReady || !currentUser || !db) return;
  db.collection('notificacoesGeradas').get().then(function(snap){
    gerarState.minhas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    gerarState.minhas.sort(function(a,b){
      var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
      var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
      return tb - ta;
    });
    gerarState.minhasLoaded = true;
    render();
  }).catch(function(e){
    gerarState.minhasLoaded = true;
    console.error('Falha ao carregar minhas notificações', e);
    render();
  });
}

function gerarTextoDoModelo(){
  var cat = getCategoriaModelo(gerarState.condSel, gerarState.categoriaSel);
  if (!cat) return;
  var modelo = modeloDoCondominio(gerarState.condSel);
  var torre = gerarState.draft.torre || '[TORRE]', apto = gerarState.draft.apto || '[APTO]';
  var header = (modelo.cabecalho || '').replace('{TORRE}', torre).replace('{APTO}', apto);
  var penalidade = gerarState.tipoSel === 'Multa'
    ? penalidadeMultaTpl(gerarState.draft.multaValor || cat.valorSugerido || '[VALOR]')
    : PENALIDADE_ADVERTENCIA_TPL;
  var hoje = new Date();
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var dataNotif = hoje.getDate()+' de '+meses[hoje.getMonth()]+' de '+hoje.getFullYear();
  var rodape = (modelo.rodape || '').replace('{DATA_NOTIF}', dataNotif);
  var corpo = cat.corpo;

  if (gerarState.draft.dataFato){
    var dataFatoBr = gerarState.draft.dataFato.split('-').reverse().join('/');
    corpo = corpo.split('[DATA]').join(dataFatoBr);
  }
  if (gerarState.draft.horaFato) corpo = corpo.split('[HORA]').join(gerarState.draft.horaFato);
  if (gerarState.draft.oQueAconteceu){
    corpo = corpo.replace(/\[DESCREVER:[^\]]*\]/, gerarState.draft.oQueAconteceu.trim());
  }

  gerarState.draft.texto = header + corpo + '\n\n' + penalidade + rodape;
  render();
}

function enviarNotificacao(){
  if (!fbReady || !currentUser || !currentProfile){ alert('Faça login no Portal para enviar uma notificação.'); return; }
  updateDraft('ocorrencia');
  var condominio = gerarState.condSel || gv('gn-condominio'), torre = gerarState.draft.torre, apto = gerarState.draft.apto,
      ocorrencia = gerarState.draft.ocorrencia, tipoPenalidade = gerarState.tipoSel, texto = gerarState.draft.texto;
  if (!condominio || !texto){ alert('Preencha ao menos o condomínio e o texto da notificação.'); return; }
  if (gerarState.submitting) return;
  gerarState.submitting = true;
  var nome = currentProfile.displayName || currentProfile.email;

  if (gerarState.editingId){
    var atual = gerarState.minhas.filter(function(n){ return n.id === gerarState.editingId; })[0];
    db.collection('notificacoesGeradas').doc(gerarState.editingId).update({
      condominio: condominio, condominioSlug: slugify(condominio),
      torre: torre, apto: apto, ocorrencia: ocorrencia, tipoPenalidade: tipoPenalidade, texto: texto,
      status: 'pendente',
      tentativa: (atual ? (atual.tentativa || 1) : 1) + 1,
      motivoRejeicao: null,
      decididoPorUid: null, decididoPorNome: null, decididoEm: null
    }).then(function(){
      gerarState.editingId = null;
      gerarState.submitting = false;
      resetGerarDraft();
      loadMinhasNotificacoes();
    }).catch(function(e){ gerarState.submitting = false; alert('Não foi possível reenviar: ' + e.message); });
  } else {
    db.collection('notificacoesGeradas').add({
      condominio: condominio, condominioSlug: slugify(condominio),
      torre: torre, apto: apto, ocorrencia: ocorrencia, tipoPenalidade: tipoPenalidade, texto: texto,
      status: 'pendente', tentativa: 1, historico: [], motivoRejeicao: null,
      criadoPorUid: currentUser.uid, criadoPorNome: nome,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      decididoPorUid: null, decididoPorNome: null, decididoEm: null
    }).then(function(){
      gerarState.submitting = false;
      resetGerarDraft();
      loadMinhasNotificacoes();
    }).catch(function(e){ gerarState.submitting = false; alert('Não foi possível enviar: ' + e.message); });
  }
}

var aprovState = {
  filter:'pendente', loaded:false, itens:[],
  condoAprov:[], condoAprovLoaded:false,
  allUsers:[], allUsersLoaded:false,
  assignMode:false, rejectingId:null,
  consultaAberta:false, consulta:{ condominio:'', torre:'', apto:'', resultado:null, zerarAberto:false, zerarData:'' }
};

function refreshAprovacao(){
  if (!fbReady || !currentUser || !db) return;
  // quem não é da equipe (síndico aprovador) só pode consultar o próprio vínculo
  var consulta = (currentProfile && ['admin','gestor','membro'].indexOf(currentProfile.role) >= 0)
    ? db.collection('condoAprovadores') : db.collection('condoAprovadores').where('aprovadorUid', '==', currentUser.uid);
  consulta.get().then(function(snap){
    aprovState.condoAprov = snap.docs.map(function(d){ return Object.assign({slug:d.id}, d.data()); });
    aprovState.condoAprovLoaded = true;
    return carregarFilaAprovacao();
  }).then(function(){
    if (isAdminUser() && !aprovState.allUsersLoaded) return carregarUsuarios();
  }).then(function(){ render(); }).catch(function(e){
    aprovState.condoAprovLoaded = true; aprovState.loaded = true;
    console.error('Falha ao carregar aprovação', e); render();
  });
}

function carregarUsuarios(){
  return db.collection('users').get().then(function(snap){
    aprovState.allUsers = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
    aprovState.allUsersLoaded = true;
  });
}

function meusCondosAprovador(){
  if (!currentUser) return [];
  return aprovState.condoAprov.filter(function(c){ return c.aprovadorUid === currentUser.uid; });
}

function carregarFilaAprovacao(){
  var meus = meusCondosAprovador();
  var slugs = meus.map(function(c){ return c.slug; });
  if (!slugs.length){ aprovState.itens = []; aprovState.loaded = true; return Promise.resolve(); }
  return db.collection('notificacoesGeradas').where('condominioSlug','in', slugs.slice(0,10)).get().then(function(snap){
    aprovState.itens = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    aprovState.itens.sort(function(a,b){
      var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
      var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
      return tb - ta;
    });
    aprovState.loaded = true;
  });
}

function setAprovFiltro(f){ aprovState.filter = f; render(); }

function aprovarNotificacao(id){
  if (!confirm('Aprovar esta notificação?')) return;
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('notificacoesGeradas').doc(id).update({
    status:'aprovada', decididoPorUid: currentUser.uid, decididoPorNome: nome,
    decididoEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ refreshAprovacao(); }).catch(function(e){ alert('Erro ao aprovar: ' + e.message); });
}

function abrirRejeicao(id){ aprovState.rejectingId = id; render(); }
function cancelarRejeicao(){ aprovState.rejectingId = null; render(); }

function confirmarRejeicao(id){
  var el = document.getElementById('rej-motivo-'+id);
  var motivo = el ? el.value.trim() : '';
  if (!motivo){ alert('Escreva o motivo da rejeição.'); return; }
  var item = aprovState.itens.filter(function(n){ return n.id === id; })[0];
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('notificacoesGeradas').doc(id).update({
    status:'rejeitada', motivoRejeicao: motivo,
    decididoPorUid: currentUser.uid, decididoPorNome: nome,
    decididoEm: firebase.firestore.FieldValue.serverTimestamp(),
    historico: firebase.firestore.FieldValue.arrayUnion({
      tentativa: (item ? item.tentativa : 1) || 1, motivo: motivo, por: nome, em: new Date()
    })
  }).then(function(){ aprovState.rejectingId = null; refreshAprovacao(); })
    .catch(function(e){ alert('Erro ao rejeitar: ' + e.message); });
}

function salvarAprovador(slug, condominio){
  var sel = document.getElementById('assign-'+slug);
  if (!sel || !sel.value){ return; }
  var opt = sel.options[sel.selectedIndex];
  db.collection('condoAprovadores').doc(slug).set({
    condominio: condominio, aprovadorUid: sel.value,
    aprovadorNome: opt.getAttribute('data-nome'), aprovadorEmail: opt.getAttribute('data-email')
  }).then(function(){ refreshAprovacao(); }).catch(function(e){ alert('Erro ao salvar: ' + e.message); });
}

function toggleAssignMode(){ aprovState.assignMode = !aprovState.assignMode; render(); }

function toggleConsultaUnidade(){ aprovState.consultaAberta = !aprovState.consultaAberta; render(); }

function condominiosConsultaveis(){
  if (isAdminUser()) return CONDOMINIOS.map(function(c){ return c.nome; });
  return meusCondosAprovador().map(function(c){ return c.condominio; });
}

function consultarUnidadeAprovador(){
  var condominio = gv('consulta-condominio'), torre = gv('consulta-torre'), apto = gv('consulta-apto');
  if (!condominio || !torre || !apto){ alert('Preencha condomínio, torre e apartamento.'); return; }
  aprovState.consulta.condominio = condominio; aprovState.consulta.torre = torre; aprovState.consulta.apto = apto;
  aprovState.consulta.resultado = { loading:true };
  render();
  var slug = slugify(condominio);
  Promise.all([
    fetchUnidadeReset(slug, torre, apto),
    fetchOcorrenciasUnidade(slug, torre, apto, false)
  ]).then(function(res){
    var reset = res[0], todos = ordenarPorData(res[1]);
    var validos = aplicarCorteReset(todos, reset);
    var aprovadas = validos.filter(function(n){ return n.status === 'aprovada'; });
    aprovState.consulta.resultado = { loading:false, total: todos.length, validos: validos, aprovadas: aprovadas.length, reset: reset };
    render();
  }).catch(function(e){
    aprovState.consulta.resultado = { loading:false, error: e.message };
    render();
  });
}

function abrirZerar(){ aprovState.consulta.zerarAberto = true; aprovState.consulta.zerarData = new Date().toISOString().slice(0,10); render(); }
function cancelarZerar(){ aprovState.consulta.zerarAberto = false; render(); }

function confirmarZerar(){
  var data = gv('consulta-zerar-data');
  if (!data){ alert('Escolha a data.'); return; }
  var c = aprovState.consulta;
  var slug = slugify(c.condominio);
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('unidadeResets').doc(unidadeResetDocId(slug, c.torre, c.apto)).set({
    condominioSlug: slug, condominio: c.condominio, torre: c.torre, apto: c.apto,
    resetAPartirDe: data, resetPorUid: currentUser.uid, resetPorNome: nome,
    resetEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    aprovState.consulta.zerarAberto = false;
    consultarUnidadeAprovador();
  }).catch(function(e){ alert('Erro ao zerar: ' + e.message); });
}

function bindAprovacao(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-aprovar]'), function(el){
    el.addEventListener('click', function(){ aprovarNotificacao(el.getAttribute('data-aprovar')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-abrir]'), function(el){
    el.addEventListener('click', function(){ abrirRejeicao(el.getAttribute('data-rejeitar-abrir')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-confirmar]'), function(el){
    el.addEventListener('click', function(){ confirmarRejeicao(el.getAttribute('data-rejeitar-confirmar')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-cancelar]'), function(el){
    el.addEventListener('click', cancelarRejeicao);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-filtro]'), function(el){
    el.addEventListener('click', function(){ setAprovFiltro(el.getAttribute('data-filtro')); });
  });
  var toggleBtn = document.getElementById('assign-toggle');
  if (toggleBtn) toggleBtn.addEventListener('click', toggleAssignMode);
  Array.prototype.forEach.call(document.querySelectorAll('[data-assign-save]'), function(el){
    el.addEventListener('click', function(){
      salvarAprovador(el.getAttribute('data-assign-save'), el.getAttribute('data-condominio'));
    });
  });
  var consultaToggle = document.getElementById('consulta-toggle');
  if (consultaToggle) consultaToggle.addEventListener('click', toggleConsultaUnidade);
  var consultaBuscar = document.getElementById('consulta-buscar');
  if (consultaBuscar) consultaBuscar.addEventListener('click', consultarUnidadeAprovador);
  var zerarAbrir = document.getElementById('consulta-zerar-abrir');
  if (zerarAbrir) zerarAbrir.addEventListener('click', abrirZerar);
  var zerarCancelar = document.getElementById('consulta-zerar-cancelar');
  if (zerarCancelar) zerarCancelar.addEventListener('click', cancelarZerar);
  var zerarConfirmar = document.getElementById('consulta-zerar-confirmar');
  if (zerarConfirmar) zerarConfirmar.addEventListener('click', confirmarZerar);
}

function notifCardAprovador(n){
  var rejecting = aprovState.rejectingId === n.id;
  var tentativaTag = n.tentativa > 1 ? '<span class="tentativa-tag">🔁 já rejeitada '+(n.tentativa-1)+'x antes</span>' : '';
  var reason = (n.status === 'rejeitada' && n.motivoRejeicao)
    ? '<div class="nc-reason"><b>Motivo:</b> '+escapeHtml(n.motivoRejeicao)+'</div>' : '';
  var decidido = (n.status !== 'pendente' && n.decididoPorNome)
    ? '<div class="nc-meta">Decidido por '+escapeHtml(n.decididoPorNome)+' em '+formatDateTime(n.decididoEm)+'</div>' : '';
  var actions = '';
  if (n.status === 'pendente'){
    actions = rejecting
      ? ('<div style="margin-top:10px;"><textarea id="rej-motivo-'+n.id+'" rows="3" placeholder="Explique o que precisa ser corrigido…"></textarea>'
        + '<div class="nc-actions"><button type="button" class="btn" data-rejeitar-confirmar="'+n.id+'">Confirmar rejeição</button>'
        + '<button type="button" class="btn ghost" data-rejeitar-cancelar>Cancelar</button></div></div>')
      : ('<div class="nc-actions"><button type="button" class="btn" data-aprovar="'+n.id+'">✓ Aprovar</button>'
        + '<button type="button" class="btn secondary" data-rejeitar-abrir="'+n.id+'">✕ Rejeitar</button></div>');
  }
  return '<div class="notif-card">'
    + '<div class="nc-top"><h4>'+escapeHtml(n.condominio)+' — Torre '+escapeHtml(n.torre)+', Apto '+escapeHtml(n.apto)+'</h4>'
    + '<span class="status-badge '+n.status+'">'+statusLabel(n.status)+'</span></div>'
    + '<div class="nc-meta">Ocorrência #'+escapeHtml(n.ocorrencia)+' · '+escapeHtml(n.tipoPenalidade)+' · enviada por '+escapeHtml(n.criadoPorNome)+' em '+formatDateTime(n.criadoEm)+' '+tentativaTag+'</div>'
    + '<div class="nc-texto">'+escapeHtml(n.texto)+'</div>'
    + decidido + reason + actions + '</div>';
}

function renderConsultaResultado(){
  var r = aprovState.consulta.resultado;
  if (!r) return '';
  if (r.loading) return '<p style="color:var(--muted);font-size:.82rem;margin-top:10px;">Consultando…</p>';
  if (r.error) return '<p style="color:#a3312a;font-size:.82rem;margin-top:10px;">Erro: '+escapeHtml(r.error)+'</p>';
  var resetNota = r.reset
    ? '<p style="font-size:.78rem;color:var(--muted);margin:6px 0 0;">Contagem reiniciada em '+escapeHtml(r.reset.resetAPartirDe.split('-').reverse().join('/'))+' por '+escapeHtml(r.reset.resetPorNome)+'.</p>'
    : '';
  var lista = r.validos.map(function(n){
    return '<li>'+formatDateTime(n.criadoEm)+' — <span class="status-badge '+n.status+'" style="margin-left:4px;">'+statusLabel(n.status)+'</span> '+escapeHtml(n.tipoPenalidade||'')+'</li>';
  }).join('');
  var zerarBtn = isAdminUser()
    ? (aprovState.consulta.zerarAberto
        ? '<div style="margin-top:10px;"><label style="display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;">Zerar a partir de</label>'
          + '<input id="consulta-zerar-data" type="date" value="'+escapeHtml(aprovState.consulta.zerarData)+'">'
          + '<div class="nc-actions"><button type="button" class="btn" id="consulta-zerar-confirmar">Confirmar zeramento</button>'
          + '<button type="button" class="btn ghost" id="consulta-zerar-cancelar">Cancelar</button></div></div>'
        : '<button type="button" class="btn ghost" id="consulta-zerar-abrir" style="margin-top:10px;">Zerar ocorrências desta unidade (troca de inquilino)</button>')
    : '';
  return '<div class="box" style="margin-top:12px;margin-bottom:0;">'
    + '<p style="margin:0 0 6px;font-size:.85rem;"><b>'+r.aprovadas+'</b> ocorrência(s) aprovada(s) — '+r.total+' registro(s) no total (todos os status)'+(r.reset ? ' desde o último zeramento' : '')+'.</p>'
    + resetNota
    + (r.validos.length ? '<ul style="margin:8px 0 0;padding-left:18px;font-size:.82rem;">'+lista+'</ul>' : '')
    + zerarBtn
  + '</div>';
}

  var body = '';

function viewNotificacoesProntas(){

      + (avisoDadosCondo() || '<div class="empty-tab">Nenhum relatório condominial publicado ainda.</div>');
  }

  return '<div class="kicker">Carteira</div>'
    + '<h1>Relatórios Condominiais</h1>'
    + '<p class="lead">Relatórios de acompanhamento jurídico enviados aos condomínios, organizados em colunas por condomínio, prontos para consulta, envio à administradora ou download.</p>'
    + '<hr class="rule">'
    + '<div class="grid g3">' + comReports.map(function(c){
        var relatorios = RELATORIOS[c.nome];
        return '<div class="relatorio-col">'
          + '<h2 class="section-h" style="font-size:1rem;"><span class="ic">🏢</span> '+c.nome+'</h2>'
          + relatorios.map(function(r){

                + '<div class="icon-sq">📄</div>'

/* ---------- nomenclatura generator (POP nº 008/2023) ---------- */

var NOM_TYPES = [
  {id:'judicial', ic:'⚖️', label:'Judicial'},
  {id:'administrativo', ic:'📄', label:'Administrativo'},
  {id:'honorarios', ic:'📝', label:'Contrato de Honorários'},
  {id:'notificacao', ic:'🏢', label:'Notificação Condominial'}
];
var nomState = { tipo:'judicial' };

function viewNomenclatura(){
  return '<div class="kicker">POP Nº 008/2023</div>'
    + '<h1>Nomenclatura de Documentos</h1>'
    + '<p class="lead">Selecione o tipo de documento, preencha os campos e copie o nome formatado conforme o padrão do escritório.</p>'
    + '<hr class="rule">'
    + '<div class="nom-types">' + NOM_TYPES.map(function(t){
        var active = t.id===nomState.tipo ? ' active' : '';
        return '<button type="button" class="'+active+'" data-nom-type="'+t.id+'"><span class="ic">'+t.ic+'</span>'+t.label+'</button>';
      }).join('') + '</div>'
    + '<div class="grid g2">'
      + '<div class="box" style="margin-bottom:0;"><h3 style="margin:0 0 14px;font-size:1rem;">Preencha os campos</h3><div class="nom-form" id="nom-fields"></div></div>'
      + '<div class="box" style="margin-bottom:0;"><h3 style="margin:0 0 14px;font-size:1rem;">Resultado</h3>'
        + '<div class="nom-result" id="nom-result">—</div>'
        + '<button class="copy-btn" id="nom-copy">📋 Copiar nome</button>'
      + '</div>'
    + '</div>';
}

var NOM_FIELD_DEFS = {
  judicial: [
    {k:'autor', label:'Autor'}, {k:'reu', label:'Réu'},
    {k:'peca', label:'Nome da Peça'}, {k:'valor', label:'Valor (opcional)'},
    {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
  ],
  administrativo: [
    {k:'parte1', label:'Parte 1'}, {k:'parte2', label:'Parte 2 (opcional)'},
    {k:'arquivo', label:'Nome do Arquivo'}, {k:'valor', label:'Valor (opcional)'},
    {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
  ],
  honorarios: [
    {k:'parte', label:'Parte'},
    {k:'tipo', label:'Tipo', type:'select', options:['AVULSO JUDICIAL','AVULSO EXTRAJUDICIAL','ASSESSORIA','PARALEGAL']},
    {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
  ],
  notificacao: [
    {k:'condominio', label:'Nome do Condomínio'}, {k:'torre', label:'Torre'},
    {k:'apto', label:'Apto'}, {k:'ocorrencia', label:'Ocorrência #'},
    {k:'titulo', label:'Título da Ocorrência'}, {k:'criador', label:'Criador'},
    {k:'data', label:'Data', type:'date'}
  ]
};
var nomValues = {};

function bindNomenclatura(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-nom-type]'), function(b){
    b.addEventListener('click', function(){ nomState.tipo = b.getAttribute('data-nom-type'); render(); });
  });
  renderNomFields();
  document.getElementById('nom-copy').addEventListener('click', copyNomResult);
}

function renderNomFields(){
  var defs = NOM_FIELD_DEFS[nomState.tipo];
  var el = document.getElementById('nom-fields');
  el.innerHTML = defs.map(function(f){
    if(f.type === 'select'){
      return '<div><label>'+f.label+'</label><select data-nk="'+f.k+'">'
        + f.options.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('')
        + '</select></div>';
    }
    return '<div><label>'+f.label+'</label><input data-nk="'+f.k+'" type="'+(f.type||'text')+'" placeholder="'+f.label.toUpperCase()+'"></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-nk]'), function(inp){
    inp.addEventListener('input', updateNomResult);
    inp.addEventListener('change', updateNomResult);
  });
  updateNomResult();
}

function abrevData(v){
  if(!v) return '';
  var p = v.split('-');
  if(p.length !== 3) return v;
  return p[2] + '.' + p[1] + '.' + p[0].slice(2);
}

function nomVal(k){
  var el = document.querySelector('[data-nk="'+k+'"]');
  if(!el) return '';
  return el.value.trim();
}

function updateNomResult(){
  var tipo = nomState.tipo;
  var out = '';
  if(tipo === 'judicial'){
    var autor=nomVal('autor').toUpperCase(), reu=nomVal('reu').toUpperCase(), peca=nomVal('peca').toUpperCase(),
        valor=nomVal('valor').toUpperCase(), criador=nomVal('criador').toUpperCase(), data=abrevData(nomVal('data'));
    var parts = ['('+(autor||'AUTOR')+' X '+(reu||'RÉU')+')', peca||'NOME DA PEÇA'];
    if(valor) parts.push(valor);
    parts.push(criador||'CRIADOR', data||'DD.MM.AA');
    out = parts.join(' – ');
  } else if(tipo === 'administrativo'){
    var p1=nomVal('parte1').toUpperCase(), p2=nomVal('parte2').toUpperCase(), arq=nomVal('arquivo').toUpperCase(),
        val=nomVal('valor').toUpperCase(), cr=nomVal('criador').toUpperCase(), dt=abrevData(nomVal('data'));
    var partyStr = p2 ? '('+(p1||'PARTE 1')+' X '+p2+')' : '('+(p1||'PARTE')+')';
    var parts2 = [partyStr, arq||'NOME DO ARQUIVO'];
    if(val) parts2.push(val);
    parts2.push(cr||'CRIADOR', dt||'DD.MM.AA');
    out = parts2.join(' – ');
  } else if(tipo === 'honorarios'){
    var pt=nomVal('parte').toUpperCase(), tp=nomVal('tipo')||'AVULSO JUDICIAL',
        cr2=nomVal('criador').toUpperCase(), dt2=abrevData(nomVal('data'));
    out = '('+(pt||'PARTE')+') – CPSHA - '+tp+' – '+(cr2||'CRIADOR')+' – '+(dt2||'DD.MM.AA');
  } else if(tipo === 'notificacao'){
    var cond=nomVal('condominio').toUpperCase(), torre=nomVal('torre'), apto=nomVal('apto'),
        oc=nomVal('ocorrencia'), tit=nomVal('titulo').toUpperCase(), cr3=nomVal('criador').toUpperCase(),
        dataRaw3=nomVal('data'), dt3 = dataRaw3 ? dataRaw3.split('-').reverse().join('.') : '';
    out = '(COND. '+(cond||'X')+' X T'+(torre||'X')+', APTO '+(apto||'XXX')+') #'+(oc||'000')
      + ' – '+(tit||'TÍTULO DA OCORRÊNCIA')+' - '+(cr3||'CRIADOR')+' - '+(dt3||'DD.MM.AAAA');
  }
  var resEl = document.getElementById('nom-result');
  if(resEl) resEl.textContent = out;
}

function copyNomResult(){
  var txt = document.getElementById('nom-result').textContent;
  var btn = document.getElementById('nom-copy');
  var done = function(){ var old = btn.innerHTML; btn.innerHTML = '✓ Copiado'; setTimeout(function(){ btn.innerHTML = old; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, cb){
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

render();
</script>
