<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validações Processuais — Fonseca e Braga</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<script>
(function(){
  try{
    var t = localStorage.getItem('fb-portal-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key === 'fb-portal-theme'){
      if(e.newValue === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }
  });
})();
</script>
<style>
  :root{
    --panel:#211918; --panel-2:#2a1f1e; --panel-3:#332524; --paper:#ece6e1; --muted:#a3968f;
    --red:#b8362e; --red-bright:#d4544a; --gold:#d8b25a; --green:#4caf6e; --blue:#6fa8dc; --warn:#e0b04a;
    --line:rgba(236,230,225,0.10); --line-strong:rgba(236,230,225,0.18);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --panel:#ffffff; --panel-2:#f6f2ed; --panel-3:#ebe4dd; --paper:#241c1b; --muted:#6f645e;
    --red-bright:#b3261e; --gold:#8a6514; --green:#23773f; --blue:#1f5f9e; --warn:#8a5d00;
    --line:rgba(36,28,27,0.10); --line-strong:rgba(36,28,27,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--panel);color:var(--paper);font-family:var(--font-body);font-size:14px;}
  button{font:inherit;}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-strong);padding:14px 20px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  header .tit{flex:1 1 240px;min-width:0;}
  header h1{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0 0 3px;}
  header .sub{font-size:.8rem;color:var(--muted);margin:0;}
  main{max-width:1100px;margin:0 auto;padding:16px 20px 60px;}
  #gate{padding:70px 20px;text-align:center;color:var(--muted);line-height:1.6;}
  .btn{border:1px solid var(--red);background:var(--red);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:.84rem;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn.sec{background:transparent;color:var(--paper);border-color:var(--line-strong);}
  .btn.verde{background:var(--green);border-color:var(--green);}
  .btn:disabled{opacity:.55;cursor:default;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
  .card{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:12px;padding:10px 13px;cursor:pointer;text-align:left;color:var(--paper);}
  .card.on{border-color:var(--red-bright);box-shadow:0 0 0 1px var(--red-bright) inset;}
  .card b{display:block;font-size:1.45rem;line-height:1.2;}
  .card span{font-size:.74rem;color:var(--muted);}
  .card.vez b{color:var(--red-bright);} .card.agu b{color:var(--warn);} .card.ok b{color:var(--green);}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  input,select,textarea{font-family:inherit;color:var(--paper);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 9px;font-size:.86rem;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red-bright);}
  :root:not([data-theme="light"]) input[type=date]{color-scheme:dark;}
  .busca{flex:1 1 260px;}
  .chk{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--paper);cursor:pointer;}
  .chk input{width:auto;margin:0;}
  /* cadastro rápido */
  #nova{display:none;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:12px;padding:14px;margin-bottom:14px;}
  #nova.aberta{display:block;}
  #nova .grade{display:grid;grid-template-columns:1.3fr 1.3fr .8fr;gap:10px;}
  #nova label.r{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px;}
  #nova input:not([type=checkbox]),#nova textarea,#nova select{width:100%;}
  #nova textarea{min-height:110px;resize:vertical;line-height:1.45;}
  #nova .caixas2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .bolha.decisao{border-left-color:var(--blue);}
  .busca-proc{position:relative;}
  .sugs{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:10;max-height:300px;overflow:auto;}
  .sug{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--paper);padding:8px 11px;cursor:pointer;}
  .sug:hover,.sug.foco{background:var(--panel-2);}
  .sug b{font-size:.83rem;} .sug small{display:block;font-size:.73rem;color:var(--muted);margin-top:2px;}
  .sug-info{padding:8px 11px;font-size:.76rem;color:var(--muted);}
  .linha-bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .linha-bt .st{flex:1;font-size:.8rem;color:var(--muted);}
  .arqs{font-size:.76rem;color:var(--muted);}
  /* lista no estilo da Conferência de E-mails */
  .lista{display:flex;flex-direction:column;gap:8px;}
  .val{background:var(--panel-2);border:1px solid var(--line-strong);border-left:4px solid var(--warn);border-radius:10px;padding:10px 14px;}
  .val.vez{border-left-color:var(--red-bright);} .val.analisar{border-left-color:var(--blue);} .val.ok{border-left-color:var(--green);opacity:.85;}
  .topo-val{display:grid;grid-template-columns:1fr auto;gap:4px 14px;cursor:pointer;}
  .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .cod{font-size:.68rem;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--panel-3);white-space:nowrap;}
  .urg{font-size:.64rem;font-weight:800;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--red);color:#fff;}
  .proc{font-weight:600;word-break:break-word;}
  .pergunta{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lado{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;gap:3px;justify-content:center;min-width:170px;}
  .stt{font-size:.74rem;font-weight:700;}
  .val.vez .stt{color:var(--red-bright);} .val.analisar .stt{color:var(--blue);} .val.ok .stt{color:var(--green);} .val.agu .stt{color:var(--warn);}
  .quando{font-size:.72rem;color:var(--muted);}
  .prazo-v{color:var(--red-bright);font-weight:700;}
  .conversa{border-top:1px dashed var(--line-strong);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px;}
  .bolha{background:var(--panel-3);border-radius:10px;padding:9px 12px;font-size:.84rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--line-strong);}
  .bolha .rot{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:normal;}
  .bolha.orientacao{border-left-color:var(--gold);}
  .bolha.conclusao{border-left-color:var(--green);}
  .bolha.evento{background:transparent;border:1px dashed var(--line-strong);font-size:.78rem;color:var(--muted);}
  .anexo{display:inline-block;margin:6px 6px 0 0;border:1px solid var(--line-strong);border-radius:7px;padding:4px 9px;font-size:.74rem;background:var(--panel);color:var(--paper);cursor:pointer;}
  .responder textarea{width:100%;min-height:80px;resize:vertical;line-height:1.45;}
  .aviso{font-size:.8rem;color:var(--muted);}
  .vazio{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line-strong);border-radius:12px;}
  .fundo{position:fixed;inset:0;z-index:50;background:rgba(10,6,6,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;}
  .janela{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;width:100%;max-width:820px;padding:16px 18px;}
  .janela h3{font-family:var(--font-display);margin:0 0 8px;}
  .perm-tab{width:100%;border-collapse:collapse;font-size:.8rem;}
  .perm-tab th{font-size:.68rem;text-transform:uppercase;color:var(--muted);padding:6px 4px;}
  .perm-tab td{padding:7px 4px;border-top:1px solid var(--line);text-align:center;}
  .perm-tab td:first-child,.perm-tab th:first-child{text-align:left;}
  .perm-tab input{width:auto;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-3);color:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:10px 16px;z-index:80;font-size:.84rem;}
  @media (max-width:700px){
    header{padding:12px 14px;} main{padding:12px 14px 50px;}
    #nova .grade,#nova .caixas2{grid-template-columns:1fr;}
    .topo-val{grid-template-columns:1fr;}
    .lado{grid-row:auto;grid-column:1;text-align:left;min-width:0;}
    .pergunta{white-space:normal;}
    .btn{min-height:40px;}
  }
  .bolha a.lk{color:var(--blue,#6aa7ff);text-decoration:underline;word-break:break-all;}
</style>
</head>
<body>
<header>
  <div class="tit"><h1>Validações Processuais</h1><p class="sub" id="sub">Carregando…</p></div>
  <button type="button" class="btn sec" id="b-aba" style="display:none;">Registrar aba no menu</button>
  <button type="button" class="btn sec" id="b-perm" style="display:none;">Permissões</button>
  <button type="button" class="btn" id="b-nova" style="display:none;">+ Nova validação</button>
</header>
<main>
  <div id="gate">Carregando…</div>
  <div id="app" style="display:none;">
    <form id="nova" autocomplete="off">
      <div class="grade">
        <div class="busca-proc"><label class="r" for="n-proc">Nº do processo</label><input id="n-proc" placeholder="Digite o início do número" autocomplete="off"><div class="sugs" id="s-proc" hidden></div></div>
        <div class="busca-proc"><label class="r" for="n-cli">Cliente</label><input id="n-cli" placeholder="Digite o nome" autocomplete="off"><div class="sugs" id="s-cli" hidden></div></div>
        <div><label class="r" for="n-prazo">Prazo fatal</label><input id="n-prazo" type="date"></div>
      </div>
      <div class="caixas2">
        <div><label class="r" for="n-dec">Resumo da decisão do juiz</label><textarea id="n-dec" placeholder="O que a decisão disse? Ex.: julgou parcialmente procedente, negou os danos morais e fixou honorários em 10%."></textarea></div>
        <div><label class="r" for="n-perg">Dúvida que preciso de apoio</label><textarea id="n-perg" placeholder="O que precisa ser decidido? Ex.: embargos antes da apelação ou apelação direto?"></textarea></div>
      </div>
      <div class="linha-bt">
        <label class="chk"><input type="checkbox" id="n-urg"> Urgente</label>
        <span id="n-val-box"></span>
        <label class="btn sec" style="cursor:pointer;">📎 Anexar<input type="file" id="n-arqs" multiple hidden></label>
        <span class="arqs" id="n-arqs-l"></span>
        <span class="st" id="n-st"></span>
        <button type="button" class="btn sec" id="n-cancelar">Cancelar</button>
        <button type="submit" class="btn" id="n-ok">Enviar para validação</button>
      </div>
    </form>
    <div class="cards" id="cards"></div>
    <div class="filtros"><input class="busca" id="busca" type="search" placeholder="Buscar por processo, cliente ou assunto"><label class="chk"><input type="checkbox" id="f-urg"> Só urgentes</label></div>
    <div class="lista" id="lista"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" integrity="sha384-1hBNr0agKHNFwbheHcAJzeLri4PPLTLbaXUH5d9CauwS3A/PrkIt2tzxBJK3bHjY" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" integrity="sha384-QCZO5nLB2oUUv0yv01wZHylPt2CPzKdo0YnmSYCTIOo8XPPIlsIP3f1cikv2oiJ1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" integrity="sha384-qhzYx5B1KizZLjRTmJkBWYES6I+tL9Qz1J8BmFNo/18Ix+AtopUC1cuY3VW43Pe0" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js" integrity="sha384-I6aFwEp+2h4APt6+0RW32Ej4KnvuY3aO+maGRYNKNZtt2W2Hz/pEiyd+VJSm9QvQ" crossorigin="anonymous"></script>
<script src="../../firebase-config.js"></script>
<script>
(function(){
  "use strict";
  // Validações Processuais — versão simples (25/11/2026), no estilo da Conferência de E-mails.
  // Quem pede cadastra só o processo, o cliente, o prazo, se é urgente e a pergunta; o validador responde na própria linha;
  // quem pediu conclui ou pergunta de novo. Os dados são os mesmos da v279 (validacoes, mensagens, valPermissoes,
  // valConfig, valAvisos, valContadores) e valem as mesmas regras do Firestore e do Storage.
  const TAB_ID = 'validacoes-processuais';
  const PERM_CAMPOS = [['criar', 'Pedir validação'], ['responder', 'Validar (responder)'], ['esclarecer', 'Perguntar de novo'], ['concluir', 'Concluir'], ['reabrir', 'Reabrir'], ['historico', 'Ver todas'], ['admin', 'Administrar']];
  const ROT_MSG = { solicitacao: 'Dúvida', orientacao: 'Solução', esclarecimento: 'Nova dúvida', conclusao: 'Concluída', reabertura: 'Reaberta', alteracao: 'Alteração', correcao: 'Correção' };

  const $ = function(id){ return document.getElementById(id); };
  const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  const soDig = function(s){ return String(s || '').replace(/\D/g, ''); };
  const norm = function(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  function fmtCnj(n){ const d = soDig(n); return d.length === 20 ? d.replace(/^(\d{7})(\d{2})(\d{4})(\d)(\d{2})(\d{4})$/, '$1-$2.$3.$4.$5.$6') : (n || ''); }
  function hojeISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dataBR(iso){ return /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
  function ms(t){ return t && t.toMillis ? t.toMillis() : 0; }
  function quando(t){ const m = ms(t); if (!m) return 'agora'; const d = new Date(m);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }

  if (typeof firebaseConfig === 'undefined' || !firebaseConfig || firebaseConfig.apiKey === 'COLE_AQUI_SUA_API_KEY') { $('gate').textContent = 'Configuração pendente: firebase-config.js não foi preenchido.'; return; }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(), db = firebase.firestore(), st = firebase.storage();
  const FV = firebase.firestore.FieldValue;

  let eu = null, PERMS = {}, PERFIS = {}, CONFIG = {}, VALS = [], prontos = false;
  let filtro = 'vez', busca = '', soUrg = false;
  const abertos = {}, MSGS = {}, ouvindo = {}, rascunho = {}, anexosResp = {};
  let novosArqs = [];

  function pode(p){ return !!eu && (eu.adminPortal || !!(eu.perm && eu.perm[p])); }
  function nomeDe(uid, r){ return (PERFIS[uid] && PERFIS[uid].nome) || (PERMS[uid] && PERMS[uid].nome) || r || 'Pessoa'; }
  function primeiroNome(uid, r){ return String(nomeDe(uid, r)).split(' ')[0]; }

  // situação vista por quem está olhando
  function visao(v){
    if (v.status === 'concluida') return { cls: 'ok', txt: 'Concluída' };
    if (v.proximaAcaoUid === eu.uid) return v.status === 'respondida' ? { cls: 'analisar', txt: 'Solução recebida — concluir ou perguntar' } : { cls: 'vez', txt: 'Aguardando sua resposta' };
    return { cls: 'agu', txt: 'Aguardando ' + primeiroNome(v.proximaAcaoUid) };
  }
  function vencida(v){ return v.status !== 'concluida' && v.prazoFatal && v.prazoFatal < hojeISO(); }
  const FILTROS = {
    vez: { rot: 'Com você', cls: 'vez', f: function(v){ return v.proximaAcaoUid === eu.uid; } },
    agu: { rot: 'Aguardando outra pessoa', cls: 'agu', f: function(v){ return v.status !== 'concluida' && v.proximaAcaoUid !== eu.uid; } },
    ok: { rot: 'Concluídas', cls: 'ok', f: function(v){ return v.status === 'concluida'; } },
    todas: { rot: 'Todas', cls: '', f: function(){ return true; } }
  };
  function ordenar(l){
    return l.slice().sort(function(a, b){
      const va = a.proximaAcaoUid === eu.uid ? 0 : 1, vb = b.proximaAcaoUid === eu.uid ? 0 : 1; if (va !== vb) return va - vb;
      const ua = a.prioridade === 'urgente' ? 0 : 1, ub = b.prioridade === 'urgente' ? 0 : 1; if (ua !== ub) return ua - ub;
      const pa = a.status !== 'concluida' && a.prazoFatal || '9999', pb = b.status !== 'concluida' && b.prazoFatal || '9999'; if (pa !== pb) return pa < pb ? -1 : 1;
      return ms(b.atualizadoEm) - ms(a.atualizadoEm);
    });
  }

  function render(){
    if (!prontos) return;
    const vez = VALS.filter(FILTROS.vez.f).length;
    $('sub').textContent = vez ? vez + (vez === 1 ? ' validação está com você.' : ' validações estão com você.') : 'Nada está com você agora.';
    $('cards').innerHTML = Object.keys(FILTROS).map(function(k){ const F = FILTROS[k];
      return '<button type="button" class="card ' + F.cls + (filtro === k ? ' on' : '') + '" data-f="' + k + '"><b>' + VALS.filter(F.f).length + '</b><span>' + F.rot + '</span></button>'; }).join('');
    $('cards').querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ filtro = b.dataset.f; render(); }; });
    const b = norm(busca), bd = soDig(busca);
    const l = ordenar(VALS.filter(function(v){
      if (!FILTROS[filtro].f(v)) return false;
      if (soUrg && v.prioridade !== 'urgente') return false;
      if (b) { const p = v.processo || {}; const txt = norm([v.codigo, p.numero, fmtCnj(p.numero), p.cliente, p.contraria, v.assunto].join(' '));
        if (txt.indexOf(b) < 0 && !(bd.length >= 3 && (v.numeroDig || '').indexOf(bd) >= 0)) return false; }
      return true;
    }));
    // guarda o que está sendo digitado antes de redesenhar
    document.querySelectorAll('[data-resp]').forEach(function(t){ rascunho[t.dataset.resp] = t.value; });
    const foco = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.resp : null;
    $('lista').innerHTML = l.length ? l.map(itemHtml).join('') : '<div class="vazio">' + (filtro === 'vez' ? 'Nada com você agora. 🎉' : 'Nenhuma validação aqui.') + '</div>';
    ligarLista();
    if (foco) { const t = document.querySelector('[data-resp="' + foco + '"]'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  }
  function itemHtml(v){
    const vi = visao(v), p = v.processo || {}, aberto = !!abertos[v.id];
    let h = '<div class="val ' + vi.cls + '" data-id="' + esc(v.id) + '"><div class="topo-val" data-abrir="' + esc(v.id) + '" tabindex="0" role="button" aria-expanded="' + aberto + '">' +
      '<div class="l1"><span class="cod">' + esc(v.codigo || '') + '</span>' + (v.prioridade === 'urgente' ? '<span class="urg">Urgente</span>' : '') +
      '<span class="proc">' + esc(fmtCnj(p.numero) || '—') + ' · ' + esc(p.cliente || '—') + '</span></div>' +
      '<div class="pergunta">' + esc(v.assunto) + '</div>' +
      '<div class="lado"><span class="stt">' + esc(vi.txt) + '</span>' +
      (v.prazoFatal ? '<span class="quando' + (vencida(v) ? ' prazo-v' : '') + '">Prazo fatal: ' + dataBR(v.prazoFatal) + (vencida(v) ? ' (passou)' : '') + '</span>' : '') +
      '<span class="quando">' + esc(primeiroNome(v.solicitanteUid, v.solicitanteNome)) + ' → ' + esc(primeiroNome(v.validadorUid, v.validadorNome)) + ' · ' + esc(quando(v.atualizadoEm || v.criadoEm)) + '</span></div></div>';
    if (aberto) h += '<div class="conversa">' + conversaHtml(v) + acoesHtml(v) + '</div>';
    return h + '</div>';
  }
  function anexosHtml(l){ return l && l.length ? '<div>' + l.map(function(a){ return '<button type="button" class="anexo" data-anexo="' + esc(a.caminho) + '">📎 ' + esc(a.nome) + '</button>'; }).join('') + '</div>' : ''; }
  // links digitados nas mensagens viram clicáveis (abrem em outra aba; no app do Windows, no navegador)
  function comLinks(txt){
    return esc(txt || '').replace(/(\bhttps?:\/\/[^\s<]+|\bwww\.[^\s<]+)/gi, function(u){
      var fim = (u.match(/[.,;:!?)\]]+$/) || [''])[0], url = fim ? u.slice(0, -fim.length) : u;
      var href = /^www\./i.test(url) ? 'https://' + url : url;
      return '<a class="lk" href="' + href + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' + fim;
    });
  }
  function conversaHtml(v){
    const msgs = MSGS[v.id];
    if (!msgs) return '<div class="aviso">Carregando…</div>';
    const cor = {}; msgs.forEach(function(m){ if (m.tipo === 'correcao' && m.refId) cor[m.refId] = m; });
    return msgs.filter(function(m){ return m.tipo !== 'correcao'; }).map(function(m){
      const txt = cor[m.id] ? cor[m.id].texto : m.texto;
      const evento = (m.tipo === 'conclusao' && !txt) || m.tipo === 'alteracao' || m.tipo === 'reabertura' && !txt;
      let corpo = comLinks(txt || '');
      if (m.tipo === 'solicitacao') corpo = [m.analise ? 'Análise: ' + comLinks(m.analise) : '', m.sugestao ? 'Sugestão: ' + comLinks(m.sugestao) : '', comLinks(txt)].filter(Boolean).join('\n\n');
      const rotM = esc(m.autorNome) + ' · ' + esc(quando(m.em)) + (cor[m.id] ? ' · corrigida' : '');
      // pedido: caixa "Decisão do juiz" ao lado da "Dúvida"; a "Solução" (orientação) aparece depois como terceira caixa
      if (m.tipo === 'solicitacao' && m.resumo) return '<div class="bolha decisao"><div class="rot">Decisão do juiz · ' + rotM + '</div>' + comLinks(m.resumo) + '</div>' +
        '<div class="bolha solicitacao"><div class="rot">Dúvida · ' + rotM + '</div>' + (corpo || '<span class="aviso">(sem dúvida escrita)</span>') + anexosHtml(m.anexos) + '</div>';
      return '<div class="bolha ' + esc(m.tipo) + (evento ? ' evento' : '') + '"><div class="rot">' + esc(ROT_MSG[m.tipo] || m.tipo) + ' · ' + esc(m.autorNome) + ' · ' + esc(quando(m.em)) + (cor[m.id] ? ' · corrigida' : '') + '</div>' + corpo + anexosHtml(m.anexos) + '</div>';
    }).join('');
  }
  function acoesHtml(v){
    const anex = '<label class="btn sec" style="cursor:pointer;">📎 Anexar<input type="file" multiple hidden data-arq="' + esc(v.id) + '"></label><span class="arqs">' + esc((anexosResp[v.id] || []).map(function(a){ return a.name; }).join(', ')) + '</span>';
    const caixa = function(ph){ return '<div class="responder"><textarea data-resp="' + esc(v.id) + '" placeholder="' + esc(ph) + '">' + esc(rascunho[v.id] || '') + '</textarea>'; };
    if ((v.status === 'aguardando' || v.status === 'aguardando_nova') && v.validadorUid === eu.uid && pode('responder'))
      return caixa('Solução: qual providência adotar?') + '<div class="linha-bt">' + anex + '<span class="st" data-st="' + esc(v.id) + '"></span><button type="button" class="btn" data-acao="orientacao" data-v="' + esc(v.id) + '">Enviar solução</button></div></div>';
    if (v.status === 'respondida' && v.solicitanteUid === eu.uid)
      return caixa('Se ficou dúvida, escreva aqui e clique em "Perguntar de novo". Para concluir, pode deixar em branco ou anotar o que foi feito.') + '<div class="linha-bt">' + anex + '<span class="st" data-st="' + esc(v.id) + '"></span>' +
        (pode('esclarecer') ? '<button type="button" class="btn sec" data-acao="esclarecimento" data-v="' + esc(v.id) + '">Perguntar de novo</button>' : '') +
        (pode('concluir') ? '<button type="button" class="btn verde" data-acao="conclusao" data-v="' + esc(v.id) + '">Concluir</button>' : '') + '</div></div>';
    if (v.status === 'concluida' && pode('reabrir'))
      return '<div class="linha-bt"><span class="st" data-st="' + esc(v.id) + '"></span><button type="button" class="btn sec" data-acao="reabertura" data-v="' + esc(v.id) + '">Reabrir</button></div>';
    if (v.status !== 'concluida') return '<div class="aviso">Aguardando ' + esc(nomeDe(v.proximaAcaoUid)) + '.</div>';
    return '';
  }
  function ligarLista(){
    document.querySelectorAll('[data-abrir]').forEach(function(el){
      const alternar = function(){ const id = el.dataset.abrir; abertos[id] = !abertos[id]; if (abertos[id]) ouvir(id); else parar(id); render(); };
      el.onclick = alternar; el.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } };
    });
    document.querySelectorAll('[data-acao]').forEach(function(b){ b.onclick = function(){ agir(b.dataset.v, b.dataset.acao, b); }; });
    document.querySelectorAll('[data-arq]').forEach(function(i){ i.onchange = function(){ const id = i.dataset.arq; anexosResp[id] = (anexosResp[id] || []).concat(Array.prototype.slice.call(i.files)); render(); }; });
    document.querySelectorAll('[data-anexo]').forEach(function(b){ b.onclick = function(){
      const j = window.open('', '_blank');
      st.ref(b.dataset.anexo).getDownloadURL().then(function(u){ if (j) j.location = u; else location.href = u; })
        .catch(function(e){ if (j) j.close(); alert('Não foi possível abrir o anexo: ' + (e.code === 'storage/unauthorized' ? 'sem permissão.' : e.message)); }); }; });
  }
  function ouvir(id){
    if (ouvindo[id]) return;
    ouvindo[id] = db.collection('validacoes').doc(id).collection('mensagens').onSnapshot(function(s){
      MSGS[id] = s.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); }).sort(function(a, b){ return (ms(a.em) || Date.now() + 1) - (ms(b.em) || Date.now() + 1); });
      render();
    }, function(){ MSGS[id] = []; render(); });
    marcarLidos(id);
  }
  function parar(id){ if (ouvindo[id]) { ouvindo[id](); delete ouvindo[id]; } }
  function marcarLidos(id){
    db.collection('valAvisos').where('para', '==', eu.uid).where('lida', '==', false).get().then(function(s){
      const l = s.docs.filter(function(d){ return d.data().validacaoId === id; }); if (!l.length) return;
      const lote = db.batch(); l.forEach(function(d){ lote.update(d.ref, { lida: true, lidaEm: FV.serverTimestamp() }); }); return lote.commit();
    }).catch(function(){});
  }

  // ---------- anexos ----------
  function nomeSeguro(n){ return String(n || 'arquivo').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\- ]+/g, '_').slice(-120); }
  function conferir(lista){
    for (let i = 0; i < lista.length; i++) { const a = lista[i];
      if (a.size > 25 * 1048576) return '"' + a.name + '" passa de 25 MB.';
      if (/(html|svg|xml|javascript)/i.test(a.type || '') || /\.(html?|svg|xml|js|mjs)$/i.test(a.name)) return '"' + a.name + '" é de um tipo não aceito.'; }
    return '';
  }
  function enviarArquivos(valId, msgId, lista, stEl){
    let p = Promise.resolve([]);
    lista.forEach(function(a, i){ p = p.then(function(acc){
      const caminho = 'validacoes/' + valId + '/' + msgId + '/' + Date.now() + '_' + nomeSeguro(a.name);
      if (stEl) stEl.textContent = 'Enviando anexo ' + (i + 1) + ' de ' + lista.length + '…';
      return st.ref(caminho).put(a, { contentType: a.type || 'application/octet-stream' }).then(function(){ acc.push({ nome: String(a.name).slice(0, 200), caminho: caminho, tipo: a.type || '', tam: a.size }); return acc; }); }); });
    return p;
  }
  function aviso(lote, v, para, tipo, trecho){
    if (!para || para === eu.uid) return;
    lote.set(db.collection('valAvisos').doc(), { para: para, de: eu.uid, deNome: eu.nome, validacaoId: v.id, codigo: v.codigo || '', tipo: tipo,
      titulo: String(v.assunto || '').slice(0, 300), trecho: String(trecho || '').slice(0, 300), em: FV.serverTimestamp(), lida: false });
  }

  // ---------- responder / concluir / perguntar de novo / reabrir ----------
  function agir(id, tipo, botao){
    const v = VALS.filter(function(x){ return x.id === id; })[0]; if (!v) return;
    const stEl = document.querySelector('[data-st="' + id + '"]');
    const ta = document.querySelector('[data-resp="' + id + '"]');
    let texto = (ta ? ta.value : '').trim();
    const falha = function(t){ if (stEl) { stEl.textContent = t; stEl.style.color = 'var(--red-bright)'; } else alert(t); };
    if (tipo === 'reabertura') { texto = (prompt('Motivo para reabrir (a validação volta para ' + nomeDe(v.validadorUid) + '):') || '').trim(); if (!texto) return; }
    if ((tipo === 'orientacao' || tipo === 'esclarecimento') && !texto) return falha(tipo === 'orientacao' ? 'Escreva a solução.' : 'Escreva a dúvida.');
    const arquivos = tipo === 'conclusao' || tipo === 'reabertura' ? [] : (anexosResp[id] || []);
    const eA = conferir(arquivos); if (eA) return falha(eA);
    const mRef = db.collection('validacoes').doc(id).collection('mensagens').doc();
    const upd = { atualizadoEm: FV.serverTimestamp(), ultimaMov: { tipo: tipo, porUid: eu.uid, porNome: eu.nome, em: FV.serverTimestamp(), msgId: mRef.id } };
    const msg = { tipo: tipo, autorUid: eu.uid, autorNome: eu.nome, texto: texto, em: FV.serverTimestamp(), rodada: v.rodada || 1, anexos: [] };
    let avisar = [];
    if (tipo === 'orientacao') { Object.assign(upd, { status: 'respondida', proximaAcaoUid: v.solicitanteUid, respondidaEm: FV.serverTimestamp() }); if (!v.primeiraRespostaEm) upd.primeiraRespostaEm = FV.serverTimestamp(); avisar = [[v.solicitanteUid, 'orientacao']]; }
    if (tipo === 'esclarecimento') { Object.assign(upd, { status: 'aguardando_nova', proximaAcaoUid: v.validadorUid, rodada: (v.rodada || 1) + 1 }); msg.rodada = upd.rodada; avisar = [[v.validadorUid, 'esclarecimento']]; }
    if (tipo === 'conclusao') { Object.assign(upd, { status: 'concluida', proximaAcaoUid: null, concluidaEm: FV.serverTimestamp() }); avisar = [[v.validadorUid, 'concluida']]; }
    if (tipo === 'reabertura') { Object.assign(upd, { status: 'aguardando_nova', proximaAcaoUid: v.validadorUid, rodada: (v.rodada || 1) + 1, reaberturas: (v.reaberturas || 0) + 1, concluidaEm: null }); msg.rodada = upd.rodada; avisar = [[v.solicitanteUid, 'reaberta'], [v.validadorUid, 'reaberta']]; }
    botao.disabled = true;
    enviarArquivos(id, mRef.id, arquivos, stEl).then(function(anexos){
      msg.anexos = anexos;
      const lote = db.batch(); lote.set(mRef, msg); lote.update(db.collection('validacoes').doc(id), upd);
      avisar.forEach(function(a){ aviso(lote, v, a[0], a[1], texto); });
      return lote.commit();
    }).then(function(){
      delete rascunho[id]; delete anexosResp[id];
      if (tipo === 'conclusao' || tipo === 'orientacao' || tipo === 'esclarecimento') { abertos[id] = false; parar(id); }
      toast({ orientacao: 'Solução enviada.', esclarecimento: 'Pergunta enviada.', conclusao: 'Validação concluída.', reabertura: 'Validação reaberta.' }[tipo]);
      render();
    }).catch(function(e){ botao.disabled = false; falha('Não foi possível salvar: ' + (e.code === 'permission-denied' || e.code === 'storage/unauthorized' ? 'sem permissão.' : e.message)); });
  }

  // ---------- sugestões ao digitar: processos da Agenda (Astrea) e das validações anteriores ----------
  // Só quem tem a aba Agenda lê agTeste_*; para os demais, as sugestões vêm só das validações já feitas.
  const FONTE = { p: null, lista: [], pronta: false };
  let escolhido = null;
  function carregarFonte(){
    if (FONTE.p) return FONTE.p;
    FONTE.p = Promise.all([db.collection('agTeste_casos').get(), db.collection('agTeste_clientes').get()]).then(function(r){
      const cli = {}; r[1].docs.forEach(function(d){ const x = d.data(); cli[d.id] = x.nome || x.razaoSocial || ''; });
      const mapa = {};
      r[0].docs.forEach(function(d){
        const k = d.data(), nd = soDig(k.numero), chave = nd.length >= 15 ? nd : 'caso:' + d.id;
        const nomes = (k.clientes || []).map(function(id){ return cli[id] || ''; }).filter(Boolean);
        if (mapa[chave]) { nomes.forEach(function(n){ if (mapa[chave].clientes.indexOf(n) < 0) mapa[chave].clientes.push(n); }); if (!mapa[chave].contraria && k.contraria) mapa[chave].contraria = k.contraria; return; }
        mapa[chave] = { numeroDig: nd.length >= 15 ? nd : '', numero: k.numero || '', clientes: nomes, contraria: k.contraria || '', titulo: k.titulo || '', orgao: k.orgao || '', casoId: d.id };
      });
      FONTE.lista = Object.keys(mapa).map(function(k){ return mapa[k]; });
    }).catch(function(){ FONTE.lista = []; }).then(function(){ FONTE.pronta = true; });
    return FONTE.p;
  }
  function fonteCompleta(){
    const l = FONTE.lista.slice(), vistos = {};
    l.forEach(function(x){ if (x.numeroDig) vistos[x.numeroDig] = 1; });
    VALS.forEach(function(v){ const p = v.processo || {}; const chave = v.numeroDig || ('v:' + norm(p.numero) + '|' + norm(p.cliente));
      if (vistos[chave] || (!v.numeroDig && !p.cliente)) return; vistos[chave] = 1;
      l.push({ numeroDig: v.numeroDig || '', numero: p.numero || '', clientes: p.cliente ? [p.cliente] : [], contraria: p.contraria || '', titulo: '', orgao: '', casoId: p.casoId || '' }); });
    return l;
  }
  function buscar(q, porNome){
    const d = soDig(q), palavras = norm(q).split(/\s+/).filter(function(w){ return w.length >= 2; });
    if (!porNome && d.length >= 3) {
      return fonteCompleta().map(function(x){ const n = x.numeroDig || soDig(x.numero); const i = n.indexOf(d); return [i === 0 ? 2 : i > 0 ? 1 : 0, x]; })
        .filter(function(r){ return r[0]; }).sort(function(a, b){ return b[0] - a[0]; }).slice(0, 8).map(function(r){ return r[1]; });
    }
    if (norm(q).replace(/[^a-z]/g, '').length < 3) return [];
    return fonteCompleta().filter(function(x){ const t = norm(x.clientes.join(' ') + ' ' + x.contraria + ' ' + x.titulo);
      return palavras.every(function(w){ return t.indexOf(w) >= 0; }); }).slice(0, 8);
  }
  function ligarSugestoes(campo, caixa, porNome){
    const inp = $(campo), box = $(caixa); let sugs = [], foco = -1;
    const pintar = function(){
      const q = inp.value.trim(); sugs = buscar(q, porNome); foco = -1;
      if ((porNome ? norm(q).replace(/[^a-z]/g, '').length : Math.max(soDig(q).length, norm(q).replace(/[^a-z]/g, '').length)) < 3) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = (!FONTE.pronta ? '<div class="sug-info">Carregando processos…</div>' : '') +
        (sugs.length ? sugs.map(function(x, i){ return '<button type="button" class="sug" data-i="' + i + '"><b>' + esc(fmtCnj(x.numeroDig || x.numero) || 'Sem número') + '</b>' +
          '<small>' + esc(x.clientes.join(', ') || '—') + (x.contraria ? ' x ' + esc(x.contraria) : '') + (x.titulo ? ' · ' + esc(x.titulo) : '') + '</small></button>'; }).join('')
          : (FONTE.pronta ? '<div class="sug-info">Nada encontrado. Pode digitar normalmente.</div>' : ''));
      box.querySelectorAll('[data-i]').forEach(function(b){ b.onmousedown = function(e){ e.preventDefault(); escolher(sugs[+b.dataset.i]); }; });
    };
    const escolher = function(x){
      escolhido = x; box.hidden = true;
      $('n-proc').value = fmtCnj(x.numeroDig || x.numero) || $('n-proc').value;
      if (x.clientes.length) $('n-cli').value = x.clientes.join(', ');
      $('n-perg').focus();
    };
    inp.addEventListener('input', function(){ escolhido = null; pintar(); });
    inp.addEventListener('focus', pintar);
    inp.addEventListener('blur', function(){ setTimeout(function(){ box.hidden = true; }, 150); });
    inp.addEventListener('keydown', function(e){
      const bts = box.querySelectorAll('.sug'); if (box.hidden || !bts.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); foco = (foco + (e.key === 'ArrowDown' ? 1 : -1) + bts.length) % bts.length; bts.forEach(function(b, i){ b.classList.toggle('foco', i === foco); }); }
      else if (e.key === 'Enter' && foco >= 0) { e.preventDefault(); escolher(sugs[foco]); }
      else if (e.key === 'Escape') box.hidden = true;
    });
    FONTE.redesenhar = FONTE.redesenhar || [];
    FONTE.redesenhar.push(function(){ if (document.activeElement === inp) pintar(); });
  }

  // ---------- nova validação (cadastro rápido) ----------
  function validadores(){ return Object.keys(PERMS).filter(function(u){ return PERMS[u].responder && u !== eu.uid; }); }
  function abrirNova(){
    const f = $('nova'); f.classList.add('aberta'); novosArqs = []; $('n-arqs-l').textContent = ''; $('n-st').textContent = '';
    const vs = validadores(), padrao = vs.indexOf(CONFIG.validadorPadrao) >= 0 ? CONFIG.validadorPadrao : vs[0] || '';
    $('n-val-box').innerHTML = vs.length > 1 ? '<label class="chk">Validador: <select id="n-val">' + vs.map(function(u){ return '<option value="' + esc(u) + '"' + (u === padrao ? ' selected' : '') + '>' + esc(nomeDe(u)) + '</option>'; }).join('') + '</select></label>'
      : vs.length ? '<span class="aviso">Vai para ' + esc(nomeDe(padrao)) + '</span><input type="hidden" id="n-val" value="' + esc(padrao) + '">' : '<span class="aviso" style="color:var(--red-bright)">Nenhum validador cadastrado em Permissões.</span><input type="hidden" id="n-val" value="">';
    escolhido = null;
    carregarFonte().then(function(){ (FONTE.redesenhar || []).forEach(function(f){ f(); }); });
    $('n-proc').focus();
  }
  function fecharNova(){ const f = $('nova'); f.classList.remove('aberta'); f.reset(); novosArqs = []; $('n-arqs-l').textContent = ''; }
  function enviarNova(e){
    e.preventDefault();
    const s = $('n-st'), proc = $('n-proc').value.trim(), cli = $('n-cli').value.trim(), perg = $('n-perg').value.trim(), dec = $('n-dec').value.trim().slice(0, 20000), validador = ($('n-val') || {}).value || '';
    // nada é obrigatório; só é preciso haver alguém para validar (cadastrado em Permissões)
    if (!validador) { s.textContent = 'Nenhum validador cadastrado em Permissões.'; s.style.color = 'var(--red-bright)'; return; }
    const eA = conferir(novosArqs); if (eA) { s.textContent = eA; s.style.color = 'var(--red-bright)'; return; }
    const dig = soDig(proc), numDig = dig.length >= 15 ? dig : '';
    const assunto = (perg.split('\n')[0] || dec.split('\n')[0] || (proc ? 'Processo ' + proc : '') || cli || 'Validação sem descrição').slice(0, 160);
    const contraria = escolhido && escolhido.contraria || '', casoId = escolhido && escolhido.casoId || '';
    const vRef = db.collection('validacoes').doc(), mRef = vRef.collection('mensagens').doc(), cRef = db.collection('valContadores').doc('seq');
    const bt = $('n-ok'); bt.disabled = true; s.style.color = '';
    enviarArquivos(vRef.id, mRef.id, novosArqs, s).then(function(anexos){
      s.textContent = 'Enviando…';
      return db.runTransaction(function(t){
        return t.get(cRef).then(function(c){
          const n = c.exists ? (c.data().n || 0) + 1 : 1;
          if (c.exists) t.update(cRef, { n: n }); else t.set(cRef, { n: 1 });
          const codigo = 'VAL-' + String(n).padStart(4, '0');
          t.set(vRef, { seq: n, codigo: codigo, processo: { numero: numDig || proc, cliente: cli, tipoAcao: '', contraria: contraria, outrasPartes: '', polo: '', orgao: '', comarca: '', advogado: '', casoId: casoId, localizado: !!escolhido },
            numeroDig: numDig, assunto: assunto, dataPublicacao: '', prazoFatal: $('n-prazo').value || '', prazoValidacao: '', prioridade: $('n-urg').checked ? 'urgente' : 'normal',
            solicitanteUid: eu.uid, solicitanteNome: eu.nome, validadorUid: validador, validadorNome: nomeDe(validador), participantes: [eu.uid, validador], status: 'aguardando', proximaAcaoUid: validador,
            criadoEm: FV.serverTimestamp(), atualizadoEm: FV.serverTimestamp(), ultimaMov: { tipo: 'solicitacao', porUid: eu.uid, porNome: eu.nome, em: FV.serverTimestamp(), msgId: mRef.id },
            rodada: 1, origemDados: escolhido ? 'agenda' : 'manual', reaberturas: 0 });
          t.set(mRef, { tipo: 'solicitacao', autorUid: eu.uid, autorNome: eu.nome, texto: perg, resumo: dec, analise: '', sugestao: '', anexos: anexos, em: FV.serverTimestamp(), rodada: 1 });
          t.set(db.collection('valAvisos').doc(), { para: validador, de: eu.uid, deNome: eu.nome, validacaoId: vRef.id, codigo: codigo, tipo: 'nova', titulo: assunto.slice(0, 300), trecho: (perg || dec).slice(0, 300), em: FV.serverTimestamp(), lida: false });
          return codigo;
        });
      });
    }).then(function(codigo){ bt.disabled = false; fecharNova(); filtro = 'agu'; toast(codigo + ' enviada.'); render(); })
      .catch(function(e2){ bt.disabled = false; s.style.color = 'var(--red-bright)'; s.textContent = 'Não foi possível enviar: ' + (e2.code === 'permission-denied' || e2.code === 'storage/unauthorized' ? 'sem permissão.' : e2.message); });
  }

  // ---------- permissões (administrador) ----------
  function abrirPermissoes(){
    if (!pode('admin')) return;
    const fundo = document.createElement('div'); fundo.className = 'fundo';
    fundo.innerHTML = '<div class="janela"><h3>Permissões</h3><p class="aviso" style="margin-top:0;">Quem não tiver nenhuma marcação não vê o módulo.' + (eu.adminPortal ? ' Ao salvar, a aba é liberada no menu de quem recebeu permissão.' : '') +
      ' "Ver todas" mostra as validações de todo o escritório; sem ela, cada um vê só as suas.</p><div id="pm-corpo">Carregando…</div>' +
      '<div style="margin-top:12px;"><label class="chk">Validador padrão: <select id="pm-padrao"></select></label></div>' +
      '<div class="linha-bt"><span class="st" id="pm-st"></span><button type="button" class="btn sec" data-x>Cancelar</button><button type="button" class="btn" id="pm-ok" disabled>Salvar</button></div></div>';
    document.body.appendChild(fundo);
    fundo.querySelectorAll('[data-x]').forEach(function(b){ b.onclick = function(){ fundo.remove(); }; });
    const fonte = eu.adminPortal ? db.collection('users').get().then(function(s){ return s.docs.map(function(d){ const u = d.data(); return { uid: d.id, nome: u.displayName || u.email || d.id, ok: ['admin', 'gestor', 'membro'].indexOf(u.role) >= 0 && u.acesso === 'ativo', tabs: u.tabs || [] }; }).filter(function(u){ return u.ok; }); })
      : Promise.resolve(Object.keys(PERFIS).map(function(u){ return { uid: u, nome: PERFIS[u].nome }; }).filter(function(u){ return u.nome; }));
    let pessoas = [];
    fonte.then(function(l){
      pessoas = l.sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
      Object.keys(PERMS).forEach(function(u){ if (!pessoas.some(function(p){ return p.uid === u; })) pessoas.push({ uid: u, nome: PERMS[u].nome || u }); });
      $('pm-corpo').innerHTML = '<div style="overflow-x:auto;"><table class="perm-tab"><thead><tr><th>Pessoa</th>' + PERM_CAMPOS.map(function(c){ return '<th>' + c[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        pessoas.map(function(p){ const x = PERMS[p.uid] || {}; return '<tr><td>' + esc(p.nome) + '</td>' + PERM_CAMPOS.map(function(c){ return '<td><input type="checkbox" aria-label="' + esc(c[1] + ' — ' + p.nome) + '" data-pu="' + esc(p.uid) + '" data-pc="' + c[0] + '"' + (x[c[0]] ? ' checked' : '') + '></td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      const pintar = function(){ const sel = $('pm-padrao'), atual = sel.value || CONFIG.validadorPadrao || '';
        sel.innerHTML = '<option value="">—</option>' + pessoas.filter(function(p){ const cb = fundo.querySelector('[data-pu="' + p.uid + '"][data-pc="responder"]'); return cb && cb.checked; })
          .map(function(p){ return '<option value="' + esc(p.uid) + '"' + (p.uid === atual ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join(''); };
      pintar(); fundo.querySelectorAll('[data-pc="responder"]').forEach(function(cb){ cb.addEventListener('change', pintar); });
      // marcar "Pedir validação" já marca "Perguntar de novo" e "Concluir"
      fundo.querySelectorAll('[data-pc="criar"]').forEach(function(cb){ cb.addEventListener('change', function(){ if (cb.checked) ['esclarecer', 'concluir'].forEach(function(k){ fundo.querySelector('[data-pu="' + cb.dataset.pu + '"][data-pc="' + k + '"]').checked = true; }); }); });
      $('pm-ok').disabled = false;
    }).catch(function(e){ $('pm-corpo').textContent = 'Não foi possível carregar a equipe: ' + e.message; });
    $('pm-ok').onclick = function(){
      const lote = db.batch(), s = $('pm-st'); let n = 0;
      pessoas.forEach(function(p){
        const novo = {}; let algum = false;
        PERM_CAMPOS.forEach(function(c){ const cb = fundo.querySelector('[data-pu="' + p.uid + '"][data-pc="' + c[0] + '"]'); novo[c[0]] = !!(cb && cb.checked); if (novo[c[0]]) algum = true; });
        const antes = PERMS[p.uid], mudou = !antes || PERM_CAMPOS.some(function(c){ return !!antes[c[0]] !== novo[c[0]]; });
        if (algum && mudou) { lote.set(db.collection('valPermissoes').doc(p.uid), Object.assign(novo, { nome: p.nome, atualizadoPor: eu.uid, atualizadoEm: FV.serverTimestamp() })); n++; }
        if (!algum && antes) { lote.delete(db.collection('valPermissoes').doc(p.uid)); n++; }
        if (eu.adminPortal && p.tabs) {
          const tem = p.tabs.indexOf(TAB_ID) >= 0;
          if (algum && !tem) { lote.update(db.collection('users').doc(p.uid), { tabs: FV.arrayUnion(TAB_ID) }); n++; }
          // só tira a aba de quem tinha permissões e perdeu todas, e nunca a única aba da pessoa
          if (!algum && tem && antes && p.uid !== eu.uid && p.tabs.length > 1) { lote.update(db.collection('users').doc(p.uid), { tabs: FV.arrayRemove(TAB_ID) }); n++; }
        }
      });
      const padrao = $('pm-padrao').value || '';
      if (padrao !== (CONFIG.validadorPadrao || '')) { lote.set(db.collection('valConfig').doc('geral'), { validadorPadrao: padrao, atualizadoPor: eu.uid, atualizadoEm: FV.serverTimestamp() }, { merge: true }); n++; }
      if (!n) { fundo.remove(); return; }
      const bt = this; bt.disabled = true; s.textContent = 'Salvando…';
      lote.commit().then(function(){ fundo.remove(); toast('Permissões salvas.'); }).catch(function(e){ bt.disabled = false; s.textContent = 'Não foi possível salvar: ' + e.message; });
    };
  }
  function registrarAba(){
    db.collection('tabs').doc(TAB_ID).set({ label: 'Validações Processuais', url: 'tools/validacoes/index.html', order: 56 }, { merge: true })
      .then(function(){ return db.collection('users').doc(eu.uid).update({ tabs: FV.arrayUnion(TAB_ID) }); })
      .then(function(){ $('b-aba').style.display = 'none'; toast('Aba registrada. Recarregue o portal para vê-la.'); })
      .catch(function(e){ alert('Não foi possível registrar a aba: ' + e.message); });
  }

  // ---------- início ----------
  let pendenteAbrir = null;
  try { pendenteAbrir = new URLSearchParams(location.search).get('val'); } catch (e) {}
  function abrirPorId(id){
    id = String(id).slice(0, 100);
    const v = VALS.filter(function(x){ return x.id === id; })[0]; if (!v) { toast('Validação não encontrada ou sem permissão.'); return; }
    filtro = FILTROS.vez.f(v) ? 'vez' : v.status === 'concluida' ? 'ok' : 'agu'; busca = ''; $('busca').value = ''; soUrg = false; $('f-urg').checked = false;
    abertos[id] = true; ouvir(id); render();
    const el = document.querySelector('.val[data-id="' + id + '"]'); if (el) el.scrollIntoView({ block: 'center' });
  }
  window.__validacoes = { abrir: function(id){ if (prontos) abrirPorId(id); else pendenteAbrir = id; } };

  function iniciar(){
    $('gate').style.display = 'none'; $('app').style.display = '';
    $('b-nova').onclick = function(){ if ($('nova').classList.contains('aberta')) fecharNova(); else abrirNova(); };
    $('n-cancelar').onclick = fecharNova; $('nova').onsubmit = enviarNova;
    ligarSugestoes('n-proc', 's-proc', false); ligarSugestoes('n-cli', 's-cli', true);
    $('n-arqs').onchange = function(){ novosArqs = novosArqs.concat(Array.prototype.slice.call(this.files)); this.value = ''; $('n-arqs-l').textContent = novosArqs.map(function(a){ return a.name; }).join(', '); };
    $('b-perm').onclick = abrirPermissoes;
    $('busca').oninput = function(){ busca = this.value; if (busca && filtro !== 'todas') filtro = 'todas'; render(); };
    $('f-urg').onchange = function(){ soUrg = this.checked; render(); };
    const botoes = function(){ $('b-nova').style.display = pode('criar') ? '' : 'none'; $('b-perm').style.display = pode('admin') ? '' : 'none'; };
    botoes();
    if (eu.adminPortal) db.collection('tabs').doc(TAB_ID).get().then(function(s){ if (!s.exists) { $('b-aba').style.display = ''; $('b-aba').onclick = registrarAba; } }).catch(function(){});
    db.collection('valPermissoes').onSnapshot(function(s){ PERMS = {}; s.docs.forEach(function(d){ PERMS[d.id] = d.data(); }); if (PERMS[eu.uid]) eu.perm = PERMS[eu.uid]; botoes(); render(); }, function(){});
    db.collection('valConfig').doc('geral').onSnapshot(function(s){ CONFIG = s.exists ? s.data() : {}; }, function(){});
    db.collection('perfis').get().then(function(s){ s.docs.forEach(function(d){ PERFIS[d.id] = { nome: d.data().displayName || '' }; }); render(); }).catch(function(){});
    const verTodas = pode('historico') || pode('admin');
    const q = verTodas ? db.collection('validacoes') : db.collection('validacoes').where('participantes', 'array-contains', eu.uid);
    q.onSnapshot(function(s){
      VALS = s.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      const primeira = !prontos; prontos = true;
      if (primeira && !VALS.some(FILTROS.vez.f)) filtro = VALS.some(FILTROS.agu.f) ? 'agu' : 'todas';
      render();
      if (pendenteAbrir) { const id = pendenteAbrir; pendenteAbrir = null; abrirPorId(id); }
    }, function(e){ $('app').style.display = 'none'; $('gate').style.display = ''; $('gate').textContent = 'Não foi possível carregar as validações: ' + (e.code === 'permission-denied' ? 'sem permissão (as regras do Firestore foram publicadas?).' : e.message); });
  }

  auth.onAuthStateChanged(function(user){
    if (!user) { $('gate').textContent = 'Faça login no portal para ver as validações.'; $('sub').textContent = ''; return; }
    Promise.all([db.collection('users').doc(user.uid).get(), db.collection('valPermissoes').doc(user.uid).get().catch(function(){ return null; })]).then(function(r){
      const u = r[0].exists ? r[0].data() : {};
      if (['admin', 'gestor', 'membro'].indexOf(u.role) < 0 || u.acesso !== 'ativo') { $('gate').textContent = 'Este módulo é só da equipe do escritório.'; $('sub').textContent = ''; return; }
      eu = { uid: user.uid, nome: u.displayName || user.email, adminPortal: u.role === 'admin', perm: r[1] && r[1].exists ? r[1].data() : null };
      if (!eu.perm && !eu.adminPortal) { $('gate').innerHTML = 'Você ainda não tem permissão neste módulo.<br>Peça ao administrador para liberar em <b>Validações Processuais › Permissões</b>.'; $('sub').textContent = ''; return; }
      // administrador do portal: na primeira vez entra com todas as permissões e, se ainda não houver, como validador padrão
      if (eu.adminPortal && !eu.perm) {
        const tudo = {}; PERM_CAMPOS.forEach(function(c){ tudo[c[0]] = true; }); eu.perm = tudo;
        db.collection('valPermissoes').doc(eu.uid).set(Object.assign({}, tudo, { nome: eu.nome, atualizadoPor: eu.uid, atualizadoEm: FV.serverTimestamp() }))
          .then(function(){ return db.collection('valConfig').doc('geral').get(); })
          .then(function(c){ if (!c.exists || !c.data().validadorPadrao) return db.collection('valConfig').doc('geral').set({ validadorPadrao: eu.uid, atualizadoPor: eu.uid, atualizadoEm: FV.serverTimestamp() }, { merge: true }); })
          .catch(function(e){ console.warn('permissões iniciais:', e.code || e); });
      }
      iniciar();
    }).catch(function(err){ $('gate').textContent = 'Erro ao carregar o seu cadastro: ' + err.message; });
  });
})();
</script>
</body>
</html>
