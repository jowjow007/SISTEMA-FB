<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente IA — Fonseca e Braga</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<style>
  :root{
    --ink:#161010;
    --panel:#211918;
    --panel-2:#2a1f1e;
    --panel-3:#332726;
    --paper:#ece6e1;
    --muted:#9c908b;
    --red:#b8362e;
    --red-bright:#c9463c;
    --red-deep:#5c1a16;
    --green:#4c9a6a;
    --gold:#d8b25a;
    --silver:#a9adb2;
    --line:rgba(236,230,225,0.10);
    --line-strong:rgba(236,230,225,0.18);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden;}
  button,input,textarea{font-family:inherit;}

  #gate{padding:80px 20px;text-align:center;color:var(--muted);}

  .shell{display:flex;flex-direction:column;height:100vh;}

  .topo{
    padding:14px 20px;border-bottom:1px solid var(--line-strong);background:var(--panel);
    display:flex;align-items:center;gap:14px;flex:0 0 auto;
  }
  .topo h1{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin:0;color:var(--paper);}
  .topo .sub{font-size:.74rem;color:var(--muted);margin-top:2px;}
  .topo .spacer{flex:1;}
  .btn{
    border:1px solid var(--red);background:var(--red-deep);color:#fff;border-radius:20px;
    padding:7px 16px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--red);}
  .btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--paper);}
  .btn.ghost:hover{border-color:var(--silver);}

  .aviso{
    flex:0 0 auto;background:rgba(216,178,90,.10);border-bottom:1px solid rgba(216,178,90,.3);
    color:var(--gold);font-size:.74rem;padding:8px 20px;text-align:center;
  }

  .msg-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .msg-empty{
    flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;
    text-align:center;padding:20px;flex-direction:column;gap:8px;
  }
  .msg-empty .big{font-size:2.4rem;}

  .msg-row{display:flex;max-width:74%;flex-direction:column;}
  .msg-row.own{align-self:flex-end;align-items:flex-end;}
  .msg-row.other{align-self:flex-start;align-items:flex-start;}
  .msg-author{font-size:.68rem;color:var(--silver);margin:0 4px 3px;}
  .msg-bubble{
    background:var(--panel-2);border:1px solid var(--line-strong);border-radius:14px;padding:10px 14px;
    font-size:.9rem;line-height:1.5;color:var(--paper);white-space:pre-wrap;word-break:break-word;
  }
  .msg-row.own .msg-bubble{background:var(--red-deep);border-color:var(--red);}
  .msg-row.err .msg-bubble{background:rgba(184,54,46,.15);border-color:rgba(184,54,46,.5);color:#ffb4ae;}
  .msg-time{font-size:.63rem;color:var(--muted);margin-top:3px;padding:0 4px;}

  .typing-dots{display:inline-flex;gap:3px;align-items:center;padding:2px 0;}
  .typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .composer{flex:0 0 auto;border-top:1px solid var(--line-strong);background:var(--panel);padding:12px 16px;}
  .composer-row{display:flex;align-items:flex-end;gap:8px;}
  .composer-row textarea{
    flex:1;min-height:40px;max-height:140px;resize:none;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:18px;color:var(--paper);font-size:.88rem;padding:10px 15px;outline:none;line-height:1.35;
  }
  .composer-row textarea:focus{border-color:var(--red);}
  .composer-row textarea:disabled{opacity:.5;}
  .send-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--red);background:var(--red-deep);
    color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .send-btn:hover{background:var(--red);}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}
  .composer-hint{font-size:.65rem;color:var(--muted);margin-top:6px;text-align:center;}

  @media(max-width:640px){
    .msg-row{max-width:88%;}
    .topo h1{font-size:1rem;}
    .topo .sub{display:none;}
  }
</style>
</head>
<body>

<div id="gate" style="display:none;"></div>

<div class="shell" id="shell" style="display:none;">
  <div class="topo">
    <div>
      <h1>🤖 Assistente IA</h1>
      <div class="sub">Chat livre — não acessa dados do escritório</div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-nova">Nova conversa</button>
  </div>

  <div class="aviso">⚠️ Não cole aqui dados sigilosos de clientes (CPF, processos, contratos). As mensagens são processadas pelo Google (Gemini) fora do Portal.</div>

  <div class="msg-list" id="msg-list">
    <div class="msg-empty" id="msg-empty">
      <div class="big">🤖</div>
      <div>Pergunte qualquer coisa para começar.</div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-row">
      <textarea id="composer-input" placeholder="Escreva uma mensagem..." rows="1"></textarea>
      <button class="send-btn" id="btn-enviar" title="Enviar">➤</button>
    </div>
    <div class="composer-hint">Enter envia • Shift+Enter quebra linha</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../../firebase-config.js"></script>
<script src="gemini-config.js"></script>
<script>
(function(){
  "use strict";

  if (!firebaseConfig || firebaseConfig.apiKey === "COLE_AQUI_SUA_API_KEY"){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Configuração pendente: firebase-config.js não foi preenchido.';
    return;
  }

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var els = {
    gate: document.getElementById('gate'),
    shell: document.getElementById('shell'),
    msgList: document.getElementById('msg-list'),
    msgEmpty: document.getElementById('msg-empty'),
    btnNova: document.getElementById('btn-nova'),
    composerInput: document.getElementById('composer-input'),
    btnEnviar: document.getElementById('btn-enviar')
  };

  var myUid = null;
  var myNome = 'Você';
  var STORAGE_KEY = null;
  var historico = []; // [{role:'user'|'model', texto, ts}]
  var enviando = false;

  var SYSTEM_PROMPT = 'Você é o Assistente IA do Portal Fonseca e Braga, um escritório de advocacia. ' +
    'Responda sempre em português do Brasil, de forma clara e direta. Você é um assistente de uso geral ' +
    '(não tem acesso a processos, contratos, clientes ou qualquer dado interno do escritório) — se pedirem ' +
    'algo que dependa de dados internos, explique isso e sugira a ferramenta correta do Portal quando fizer sentido.';

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function formatHora(ts){
    return new Date(ts).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  }

  function salvarHistorico(){
    if (!STORAGE_KEY) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(historico.slice(-60))); } catch(e){}
  }

  function carregarHistorico(){
    if (!STORAGE_KEY) return;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      historico = raw ? JSON.parse(raw) : [];
    } catch(e){ historico = []; }
  }

  function renderMensagens(){
    if (!historico.length){
      els.msgList.innerHTML = '';
      els.msgList.appendChild(els.msgEmpty);
      els.msgEmpty.style.display = 'flex';
      return;
    }
    var out = '';
    historico.forEach(function(m){
      var own = m.role === 'user';
      out += '<div class="msg-row ' + (own ? 'own' : (m.erro ? 'err other' : 'other')) + '">';
      if (!own) out += '<div class="msg-author">' + (m.erro ? 'Erro' : 'Assistente') + '</div>';
      out += '<div class="msg-bubble">' + escapeHtml(m.texto) + '</div>';
      out += '<div class="msg-time">' + formatHora(m.ts) + '</div>';
      out += '</div>';
    });
    els.msgList.innerHTML = out;
    els.msgList.scrollTop = els.msgList.scrollHeight;
  }

  function mostrarDigitando(){
    var div = document.createElement('div');
    div.className = 'msg-row other';
    div.id = 'digitando-row';
    div.innerHTML = '<div class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
    els.msgList.appendChild(div);
    els.msgList.scrollTop = els.msgList.scrollHeight;
  }

  function removerDigitando(){
    var el = document.getElementById('digitando-row');
    if (el) el.remove();
  }

  function chamarGemini(){
    if (!GEMINI_API_KEY || GEMINI_API_KEY === 'COLE_AQUI_SUA_API_KEY_DO_GEMINI'){
      return Promise.reject(new Error('A chave do Gemini ainda não foi configurada em tools/assistente-ia/gemini-config.js.'));
    }
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + GEMINI_API_KEY;
    var body = {
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: historico.filter(function(m){ return !m.erro; }).map(function(m){
        return { role: m.role, parts: [{ text: m.texto }] };
      }),
      generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
    };
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(data){
        if (!r.ok){
          throw new Error((data.error && data.error.message) || ('Erro ' + r.status + ' ao falar com o Gemini.'));
        }
        return data;
      });
    }).then(function(data){
      var cand = data.candidates && data.candidates[0];
      var texto = cand && cand.content && cand.content.parts
        ? cand.content.parts.map(function(p){ return p.text || ''; }).join('')
        : '';
      if (!texto){
        var motivo = cand && cand.finishReason;
        throw new Error(motivo === 'SAFETY' ? 'A resposta foi bloqueada pelos filtros de segurança do Gemini.' : 'O Gemini não retornou nenhuma resposta.');
      }
      return texto;
    });
  }

  function enviarMensagem(){
    if (enviando) return;
    var texto = els.composerInput.value.trim();
    if (!texto) return;
    historico.push({ role: 'user', texto: texto, ts: Date.now() });
    els.composerInput.value = '';
    els.composerInput.style.height = 'auto';
    renderMensagens();
    salvarHistorico();

    enviando = true;
    els.btnEnviar.disabled = true;
    els.composerInput.disabled = true;
    mostrarDigitando();

    chamarGemini().then(function(resposta){
      removerDigitando();
      historico.push({ role: 'model', texto: resposta, ts: Date.now() });
      renderMensagens();
      salvarHistorico();
    }).catch(function(err){
      removerDigitando();
      historico.push({ role: 'model', texto: err.message || 'Não foi possível obter resposta.', ts: Date.now(), erro: true });
      renderMensagens();
      salvarHistorico();
    }).finally(function(){
      enviando = false;
      els.btnEnviar.disabled = false;
      els.composerInput.disabled = false;
      els.composerInput.focus();
    });
  }

  els.composerInput.addEventListener('input', function(){
    els.composerInput.style.height = 'auto';
    els.composerInput.style.height = Math.min(els.composerInput.scrollHeight, 140) + 'px';
  });
  els.composerInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      enviarMensagem();
    }
  });
  els.btnEnviar.addEventListener('click', enviarMensagem);

  els.btnNova.addEventListener('click', function(){
    if (!confirm('Começar uma nova conversa? O histórico atual será apagado deste navegador.')) return;
    historico = [];
    salvarHistorico();
    renderMensagens();
  });

  auth.onAuthStateChanged(function(user){
    if (!user){
      els.gate.style.display = 'block';
      els.gate.textContent = 'Faça login pelo Portal Fonseca e Braga para usar o assistente.';
      els.shell.style.display = 'none';
      return;
    }
    myUid = user.uid;
    db.collection('users').doc(user.uid).get().then(function(userDoc){
      if (!userDoc.exists){
        els.gate.style.display = 'block';
        els.gate.textContent = 'Seu usuário ainda não tem acesso configurado no portal.';
        return;
      }
      myNome = userDoc.data().displayName || user.email;
      STORAGE_KEY = 'iafb_chat_v1_' + myUid;
      carregarHistorico();
      els.gate.style.display = 'none';
      els.shell.style.display = 'flex';
      renderMensagens();
    });
  });

})();
</script>
</body>
</html>
