<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Interno — Fonseca e Braga</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<script>
(function(){
  try{
    var t = localStorage.getItem('fb-portal-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key === 'fb-portal-theme'){
      if(e.newValue === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }
  });
})();
</script>
<style>
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:url('../../assets/bg-texture.jpg') repeat;background-size:280px auto;opacity:.05;}

  :root{
    --ink:#161010;
    --panel:#211918;
    --panel-2:#2a1f1e;
    --panel-3:#332726;
    --paper:#ece6e1;
    --muted:#9c908b;
    --red:#b8362e;
    --red-bright:#c9463c;
    --red-deep:#5c1a16;
    --green:#4c9a6a;
    --gold:#d8b25a;
    --silver:#a9adb2;
    --line:rgba(236,230,225,0.10);
    --line-strong:rgba(236,230,225,0.18);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --ink:#f3efe9;
    --panel:#ffffff;
    --panel-2:#f1ece6;
    --panel-3:#e6dfd7;
    --paper:#241c1b;
    --muted:#7d716b;
    --silver:#756f6c;
    --line:rgba(36,28,27,0.10);
    --line-strong:rgba(36,28,27,0.16);
  }

  *{box-sizing:border-box;}
  *{scrollbar-width:thin;scrollbar-color:var(--red-deep) var(--panel-2);}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:var(--panel-2);}
  ::-webkit-scrollbar-thumb{background:var(--red-deep);border-radius:7px;border:2px solid var(--panel-2);background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--red);}
  ::-webkit-scrollbar-corner{background:var(--panel-2);}
    html,body{margin:0;height:100%;background:var(--panel);color:var(--paper);font-family:var(--font-body);overflow:hidden;transition:background-color .2s,color .2s}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}

  #gate{padding:80px 20px;text-align:center;color:var(--muted);}

  .shell{display:flex;height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:320px;flex:0 0 auto;display:flex;flex-direction:column;background:var(--panel);
    border-right:1px solid var(--line-strong);min-width:0;
  }
  .sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-strong);}
  .sidebar-head-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .sidebar-head h1{
    font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin:0;color:var(--paper);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sidebar-actions-row{display:flex;align-items:center;gap:6px;margin-top:12px;}
  .btn-novo-pill{
    flex:0 0 auto;width:117px;height:30px;border:none;border-radius:20px;cursor:pointer;overflow:hidden;
    background-image:url('assets/novo-botao-chat-crop.png');background-repeat:no-repeat;
    background-size:100% 100%;background-position:center;background-color:transparent;
  }
  .btn-novo-pill:hover{filter:brightness(1.12);}
  .btn-etiquetas-wrap{position:relative;flex:0 0 auto;}
  .btn-etiquetas-side{
    width:42px;height:30px;border-radius:20px;border:1px solid #c9463c;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#5c1a20,#3a0e14);display:flex;align-items:center;justify-content:center;padding:0;
  }
  .btn-etiquetas-side:hover{filter:brightness(1.25);}
  .btn-etiquetas-side.on{box-shadow:0 0 0 2px var(--gold);}
  .btn-arquivadas-wrap{position:relative;flex:0 0 auto;}
  .btn-arquivadas-pill{
    width:116px;height:30px;border:none;border-radius:20px;cursor:pointer;overflow:hidden;background-color:transparent;
    background-image:url('assets/novo-botao-arquivadas-crop.png');background-repeat:no-repeat;
    background-size:100% 100%;background-position:center;
  }
  .btn-arquivadas-pill:hover{filter:brightness(1.3);}
  .btn-arquivadas-pill.on{box-shadow:0 0 0 2px var(--gold);border-radius:20px;}
  .arquivadas-badge{
    position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;
    border-radius:20px;padding:1px 6px;pointer-events:none;line-height:1.3;
  }
  .type-tabs{display:flex;gap:3px;margin-top:12px;background:var(--panel-2);border-radius:20px;padding:3px;}
  .type-tab{flex:1;border:none;background:none;color:var(--muted);font-size:.74rem;font-weight:700;padding:6px 0;border-radius:16px;cursor:pointer;}
  .type-tab:hover{color:var(--paper);}
  .type-tab.active{background:var(--red-deep);color:#fff;}
  .search-row{display:flex;gap:8px;margin-top:12px;}
  .search-row input{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:20px;
    color:var(--paper);font-size:.82rem;padding:8px 12px;outline:none;
  }
  .search-row input:focus{border-color:var(--red);}
  .tag-filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag-filter-row .tag-chip{cursor:pointer;opacity:.5;transition:opacity .12s;}
  .tag-filter-row .tag-chip:hover{opacity:.85;}
  .tag-filter-row .tag-chip.active{opacity:1;}
  .icon-btn{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--red);background:var(--red-deep);
    color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;position:relative;
  }
  .icon-btn:hover{background:var(--red);}
  .icon-btn#btn-notif.muted{background:var(--panel-3);border-color:var(--line-strong);opacity:.6;}

  .conv-list{flex:1;overflow-y:auto;}
  .conv-empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:.85rem;}
  .conv-item{
    display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);
    align-items:flex-start;position:relative;
  }
  .conv-item:hover{background:var(--panel-2);}
  .conv-item.active{background:var(--panel-3);}
  .avatar{
    width:42px;height:42px;border-radius:50%;background:var(--panel-2);background-size:cover;background-position:center;
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-size:1rem;color:var(--gold);border:1px solid var(--line-strong);position:relative;
  }
  .avatar.group{color:var(--silver);}
  .avatar.group svg{display:block;}
  .avatar.group.hash{color:var(--red-bright);background:var(--panel-2);font-family:var(--font-body);font-weight:800;font-size:1.25rem;}
  .presence-dot{
    position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
    background:var(--muted);border:2px solid var(--panel);
  }
  .presence-dot.online{background:#2ECC71;}
  .conv-body{flex:1;min-width:0;}
  .conv-top-line{display:flex;align-items:center;gap:6px;}
  .conv-name{font-size:.88rem;font-weight:600;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .conv-time{font-size:.68rem;color:var(--muted);flex:0 0 auto;}
  .conv-preview{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .conv-preview.unread{color:var(--paper);font-weight:600;}
  .conv-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .tag-chip{
    font-size:.65rem;padding:2px 8px;border-radius:20px;border:1px solid transparent;font-weight:700;
    letter-spacing:.02em;
  }
  .pin-mark{color:var(--gold);flex:0 0 auto;display:inline-flex;}
  .unread-badge{
    background:var(--red);color:#fff;font-size:.65rem;font-weight:700;border-radius:20px;padding:1px 7px;
    flex:0 0 auto;
  }
  .conv-meta-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
  .tag-filter-row .tag-chip .x{margin-left:5px;opacity:.7;}

  /* Fixar / Arquivar direto na lista — só no computador */
  .conv-quick{display:none;gap:2px;}
  .conv-quick button{
    background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:6px;
    padding:2px 4px;display:inline-flex;align-items:center;opacity:.6;
  }
  .conv-quick button:hover{opacity:1;color:var(--paper);border-color:var(--line-strong);background:var(--panel-3);}
  .conv-quick button.on{color:var(--gold);opacity:1;}
  @media (hover:hover) and (pointer:fine) and (min-width:721px){
    .conv-quick{display:inline-flex;}
    /* conversa com mensagem não lida pisca para chamar atenção */
    .conv-item.nao-lida{animation:convPisca 1.2s ease-in-out infinite;}
    @keyframes convPisca{0%,100%{background:transparent;}50%{background:rgba(201,70,60,.20);}}
    .conv-item.nao-lida.active{animation:none;}
  }

  /* Menu do toque longo (celular) */
  .acoes-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:65;}
  .acoes-sheet-backdrop.open{display:flex;}
  .acoes-sheet{
    width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line-strong);border-bottom:none;
    border-radius:16px 16px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));
  }
  .acoes-sheet .titulo{font-size:.8rem;color:var(--muted);text-align:center;padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acoes-sheet button{
    width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--paper);
    font-size:.95rem;padding:13px 12px;border-radius:10px;cursor:pointer;text-align:left;
  }
  .acoes-sheet button:active{background:var(--panel-2);}
  .acoes-sheet button.danger{color:#ffb4ae;}
  .acoes-sheet button.cancelar{justify-content:center;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);border-radius:0;}
  .conv-item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}

  /* Seleção de várias conversas (alterar em lote) */
  .sel-box{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--silver);align-self:center;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .conv-item.marcada{background:rgba(201,70,60,.14);}
  .conv-item.marcada .sel-box{background:var(--red);border-color:var(--red);}
  .lote-bar{display:none;flex:0 0 auto;border-top:1px solid var(--line-strong);background:var(--panel);padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
  .lote-bar.show{display:block;}
  .lote-top{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--paper);font-weight:600;margin-bottom:6px;}
  .lote-sair{background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:.75rem;cursor:pointer;}
  .lote-acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .lote-acoes button{
    display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel-2);border:1px solid var(--line-strong);
    color:var(--paper);border-radius:10px;padding:8px 2px;font-size:.7rem;cursor:pointer;
  }
  .lote-acoes button.danger{color:#ffb4ae;}
  .lote-acoes button:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- thread ---------- */
  .thread{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ink);}
  .thread-empty{
    flex:1;display:flex;align-items:center;justify-content:flex-end;color:var(--muted);font-size:.9rem;
    text-align:center;padding:20px;padding-bottom:64px;flex-direction:column;gap:8px;
    background:url('assets/fundo-chat.jpg') center/cover no-repeat;
  }
  .thread-empty .big{display:none;}
  .thread-empty div:last-child{
    background:rgba(22,16,16,.55);padding:8px 18px;border-radius:20px;backdrop-filter:blur(2px);
  }
  .thread-head{
    padding:13px 20px;border-bottom:1px solid var(--line-strong);background:var(--panel);display:flex;
    align-items:center;gap:12px;flex:0 0 auto;
  }
  .back-btn{display:none;background:none;border:none;color:var(--paper);font-size:1.2rem;cursor:pointer;padding:0 4px;}
  .thread-title{font-size:.98rem;font-weight:600;color:var(--paper);}
  .thread-sub{font-size:.72rem;color:var(--muted);margin-top:2px;}
  .thread-tags-row{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .small-link-btn{
    background:none;border:1px solid var(--line-strong);color:var(--muted);font-size:.7rem;padding:4px 10px;
    border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  }
  .small-link-btn svg{flex:0 0 auto;}
  .small-link-btn:hover{color:var(--paper);border-color:var(--silver);}
  .small-link-btn.on{color:var(--gold);border-color:rgba(216,178,90,.5);}
  .small-link-btn.danger{color:#ffb4ae;border-color:rgba(184,54,46,.4);}
  .small-link-btn.danger:hover{background:rgba(184,54,46,.12);border-color:rgba(184,54,46,.6);}

  .msg-list{
    flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px;
    background:linear-gradient(rgba(22,16,16,.90),rgba(22,16,16,.90)),url('assets/fundo-chat.jpg') center/cover no-repeat;
  }
  .day-sep{align-self:center;font-size:.68rem;color:var(--muted);background:var(--panel-2);padding:3px 12px;border-radius:20px;margin:10px 0;}
  .msg-sistema{align-self:center;font-size:.74rem;color:var(--muted);text-align:center;margin:2px 0 12px;}
  .msg-row{display:flex;gap:10px;max-width:74%;margin:8px 0;align-items:flex-start;}
  .msg-row.own{align-self:flex-end;}
  .msg-row.other{align-self:flex-start;}
  .msg-row .avatar{width:32px;height:32px;margin-top:1px;flex:0 0 auto;}
  .msg-col{min-width:0;flex:1;display:flex;flex-direction:column;}
  .msg-row.own .msg-col{align-items:flex-end;}
  .msg-head{display:flex;align-items:baseline;gap:8px;margin:0 4px 3px;}
  .msg-author-name{font-size:.82rem;font-weight:700;color:var(--paper);}
  .msg-time-inline{font-size:.68rem;color:var(--muted);}
  .msg-bubble-wrap{display:flex;align-items:center;gap:6px;}
  .msg-row.own .msg-bubble-wrap{flex-direction:row-reverse;}
  .msg-bubble{
    background:var(--panel-2);border:1px solid var(--line-strong);border-radius:14px;padding:8px 12px;
    font-size:.87rem;line-height:1.4;color:var(--paper);white-space:pre-wrap;word-break:break-word;
  }
  .msg-row.own .msg-bubble{background:var(--red-deep);border-color:var(--red);}
  .msg-row.other .msg-bubble{background:none;border:none;padding:0 4px;}
  .msg-fwd-label{font-size:.68rem;color:var(--muted);font-style:italic;margin-bottom:3px;display:inline-flex;align-items:center;gap:4px;}
  .msg-photo{max-width:220px;border-radius:10px;display:block;cursor:pointer;margin-bottom:4px;}
  .msg-time{font-size:.63rem;color:var(--muted);margin-top:2px;padding:0 4px;}
  .msg-fwd-btn,.msg-reply-btn,.msg-react-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .12s;
    padding:2px 4px;display:inline-flex;align-items:center;overflow:visible;
  }
  .msg-fwd-btn svg,.msg-reply-btn svg,.msg-react-btn svg{overflow:visible;display:block;}
  .msg-row:hover .msg-fwd-btn,.msg-row:hover .msg-reply-btn,.msg-row:hover .msg-react-btn{opacity:1;}
  .msg-fwd-btn:hover,.msg-reply-btn:hover,.msg-react-btn:hover{color:var(--paper);}
  .msg-react-btn{font-size:.85rem;line-height:1;}
  .react-picker{
    display:none;position:fixed;background:var(--panel);border:1px solid var(--line-strong);
    border-radius:14px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.6);
    width:310px;overflow:hidden;flex-direction:column;
  }
  .react-picker.open{display:flex;}
  .react-picker-search{padding:8px 8px 0;flex-shrink:0;}
  .react-picker-search input{
    width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:8px;padding:6px 10px;color:var(--paper);font-size:.82rem;outline:none;
  }
  .react-picker-search input::placeholder{color:var(--muted);}
  .react-picker-search input:focus{border-color:var(--gold);}
  .react-picker-tabs{
    display:flex;gap:0;padding:6px 8px 0;flex-shrink:0;border-bottom:1px solid var(--line-strong);
  }
  .react-picker-tabs button{
    flex:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 4px;
    font-size:.78rem;border-radius:8px 8px 0 0;transition:background .12s,color .12s;
  }
  .react-picker-tabs button.ativa{background:var(--panel-2);color:var(--paper);font-weight:600;}
  .react-picker-tabs button:hover{color:var(--paper);}
  .react-picker-body{
    display:grid;grid-template-columns:repeat(9,1fr);gap:1px;padding:6px;
    max-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
  }
  .react-picker-body button{
    background:none;border:none;font-size:1.25rem;cursor:pointer;padding:5px 3px;
    border-radius:6px;line-height:1;transition:transform .1s,background .12s;
  }
  .react-picker-body button:hover{background:var(--panel-2);transform:scale(1.3);}
  .react-picker-vazio{padding:16px;text-align:center;color:var(--muted);font-size:.8rem;grid-column:1/-1;}
  .msg-reacoes{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;padding:0 4px;}
  .reacao-pill{
    display:inline-flex;align-items:center;gap:3px;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:20px;padding:2px 7px;font-size:.78rem;cursor:pointer;transition:background .12s;user-select:none;
  }
  .reacao-pill.minha{border-color:var(--gold);background:rgba(200,160,0,.15);}
  .reacao-pill:hover{background:var(--panel-3);}
  .reacao-pill .cnt{color:var(--muted);font-size:.72rem;}
  .msg-quote{
    border-left:3px solid var(--gold);background:rgba(255,255,255,.06);border-radius:6px;padding:4px 8px;margin-bottom:6px;
    cursor:pointer;max-width:220px;
  }
  .msg-quote .autor{font-size:.68rem;font-weight:700;color:var(--gold);}
  .msg-quote .resumo{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msg-row.highlight .msg-bubble{outline:2px solid var(--gold);outline-offset:1px;}
  .msg-link{color:var(--gold);text-decoration:underline;word-break:break-all;}
  .msg-link:hover{opacity:.8;}

  .composer{
    flex:0 0 auto;border-top:1px solid var(--line-strong);background:var(--panel);padding:10px 14px;position:relative;
  }
  .reply-preview-row{
    display:none;align-items:center;gap:8px;margin-bottom:8px;background:var(--panel-2);
    border-left:3px solid var(--red);border-radius:8px;padding:6px 10px;
  }
  .reply-preview-row.show{display:flex;}
  .reply-preview-row .info{flex:1;min-width:0;}
  .reply-preview-row .autor{font-size:.72rem;color:var(--red-bright);font-weight:700;}
  .reply-preview-row .resumo{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reply-preview-row button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;flex:0 0 auto;}
  .emoji-popover{
    display:none;position:absolute;bottom:58px;left:14px;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:12px;padding:8px;width:248px;max-height:200px;overflow-y:auto;z-index:20;
    grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .emoji-popover.open{display:grid;}
  .emoji-popover button{background:none;border:none;font-size:1.15rem;cursor:pointer;padding:4px;border-radius:6px;line-height:1;}
  .emoji-popover button:hover{background:var(--panel-3);}
  .photo-preview-row{display:none;align-items:center;gap:8px;margin-bottom:8px;}
  .photo-preview-row.show{display:flex;}
  .photo-preview-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line-strong);}
  .photo-preview-row button{background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:20px;padding:3px 10px;font-size:.72rem;cursor:pointer;flex:0 0 auto;}
  .doc-preview-icon{flex:0 0 auto;color:var(--gold);display:inline-flex;}
  .doc-preview-info{flex:1;min-width:0;}
  .doc-preview-nome{font-size:.82rem;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-preview-tamanho{font-size:.68rem;color:var(--muted);}
  .msg-doc{
    display:flex;align-items:center;gap:8px;background:var(--panel-3);border:1px solid var(--line-strong);
    border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--paper);margin-bottom:4px;max-width:220px;
  }
  .msg-row.own .msg-doc{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.3);}
  .msg-doc .icone{flex:0 0 auto;display:inline-flex;}
  .msg-doc .info{min-width:0;}
  .msg-doc .nome{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msg-doc .tamanho{font-size:.68rem;color:var(--muted);}
  .composer-row{display:flex;align-items:flex-end;gap:8px;}
  .composer-row textarea{
    flex:1;min-height:38px;max-height:120px;resize:none;background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:18px;color:var(--paper);font-size:.87rem;padding:9px 14px;outline:none;line-height:1.35;
  }
  .composer-row textarea:focus{border-color:var(--red);}
  .send-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--red);background:var(--red-deep);

  }
  .send-btn:hover{background:var(--red);}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}
  .media-hint{font-size:.65rem;color:var(--muted);margin-top:6px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;

  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:18px;max-width:420px;
    width:100%;max-height:82vh;display:flex;flex-direction:column;

  .modal h3{margin:0 0 4px;font-family:var(--font-display);font-size:1.05rem;color:var(--paper);}
  .modal p.hint{margin:0 0 10px;font-size:.78rem;color:var(--muted);}

    width:100%;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;color:var(--paper);

  }
  .group-photo-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .group-photo-row .avatar{width:56px;height:56px;flex:0 0 auto;}
  .picker-list{overflow-y:auto;flex:1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0 12px;}
  .picker-item{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;border-bottom:1px solid var(--line);}
  .picker-item:hover{background:var(--panel-2);}
  .picker-item .nome{font-size:.85rem;color:var(--paper);flex:1;}
  .picker-item .sub{font-size:.68rem;color:var(--muted);}
  .picker-item input[type=checkbox]{flex:0 0 auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;}
  .modal .err{color:#ffb4ae;font-size:.75rem;min-height:1.1em;margin:0 0 8px;}
  .btn{
    border:1px solid var(--red);background:var(--red-deep);color:#fff;border-radius:20px;
    padding:7px 16px;font-size:.8rem;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:var(--red);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--paper);}
  .btn.ghost:hover{border-color:var(--silver);}

  .tag-catalog-list{max-height:260px;overflow-y:auto;margin:4px 0 12px;border-top:1px solid var(--line);}
  .tag-cat-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
  .tag-cat-row .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;}
  .tag-cat-row .nome{flex:1;font-size:.84rem;color:var(--paper);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag-cat-row .acoes{display:flex;gap:2px;flex:0 0 auto;}
  .tag-cat-row .acoes button{background:none;border:none;color:var(--muted);cursor:pointer;padding:3px 6px;display:inline-flex;align-items:center;}
  .tag-cat-row .acoes button:hover{color:var(--paper);}
  .tag-cat-empty{color:var(--muted);font-size:.8rem;padding:14px 2px;text-align:center;}
  .tag-new-form{border-top:1px solid var(--line-strong);padding-top:12px;}
  .tag-new-form label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:6px;}
  .tag-new-form input[type=text]{text-transform:uppercase;}
  .swatch-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;}
  .swatch.active{border-color:#fff;}

  .lightbox-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;
    z-index:70;padding:20px;cursor:zoom-out;
  }
  .lightbox-backdrop.open{display:flex;}
  .lightbox-backdrop img{max-width:100%;max-height:100%;border-radius:8px;}

  @media(max-width:720px){
    .sidebar{width:100%;position:absolute;inset:0;z-index:2;}
    .shell.thread-open .sidebar{display:none;}
    .thread{position:absolute;inset:0;}
    .shell:not(.thread-open) .thread{display:none;}
    .back-btn{display:block;}
  }

</head>

  var REACT_RECENTES_KEY = 'react_recentes_v1';
  function getRecentes(){
    try { return JSON.parse(localStorage.getItem(REACT_RECENTES_KEY) || '[]'); } catch(e){ return []; }
  }
  function addRecente(emoji){
    var lista = getRecentes().filter(function(e){ return e !== emoji; });
    lista.unshift(emoji);
    if (lista.length > 54) lista = lista.slice(0, 54);
    try { localStorage.setItem(REACT_RECENTES_KEY, JSON.stringify(lista)); } catch(e){}
  }

  function renderPickerBody(emojis, vazio){
    var body = document.getElementById('react-picker-body');
    if (!emojis.length){
      body.innerHTML = '<div class="react-picker-vazio">' + (vazio || 'Nenhum resultado.') + '</div>';
      return;
    }
    body.innerHTML = emojis.map(function(e){
      var nome = EMOJI_NOMES[e] || '';
      return '<button data-emo="' + e + '" title="' + escapeHtml(nome || e) + '">' + e + '</button>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (!reactTargetId || !activeId) return fecharReactPicker();
        var emoji = btn.getAttribute('data-emo');
        addRecente(emoji);
        toggleReacao(activeId, reactTargetId, emoji);
        fecharReactPicker();
      });
    });
  }

  function atualizarPicker(){
    var q = (document.getElementById('react-search').value || '').trim().toLowerCase();

        var n = (EMOJI_NOMES[e] || '').toLowerCase();
        return n.indexOf(q) !== -1 || e === q;
      });
      renderPickerBody(resultado, 'Nenhum emoji encontrado para "' + escapeHtml(q) + '".');
    } else if (reactTabAtiva === 'favoritos') {
      var fav = getRecentes();
      renderPickerBody(fav, 'Você ainda não usou nenhum emoji.<br>Escolha na aba Todos e eles aparecerão aqui.');

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // Escapa o texto e envolve URLs em links clicáveis
  var URL_RE = /(https?:\/\/[^\s<>"']+)/g;
  function linkify(s){
    var parts = String(s || '').split(URL_RE);
    return parts.map(function(p, i){
      if (i % 2 === 1) {
        // é uma URL — escapa e envolve em <a>
        var esc = escapeHtml(p);
        // encurta label se for muito longa (>55 chars)
        var label = p.length > 55 ? p.slice(0, 52) + '…' : p;
        return '<a href="' + esc + '" target="_blank" rel="noopener noreferrer" class="msg-link">' + escapeHtml(label) + '</a>';
      }
      return escapeHtml(p);
    }).join('');
  }

    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';

  function formatHora(ts){
    if (!ts || !ts.toDate) return '';
    return ts.toDate().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

  function formatDiaCurto(ts){
    if (!ts || !ts.toDate) return '';
    var d = ts.toDate();
    var hoje = new Date();
    var ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
    function mesmoDia(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    if (mesmoDia(d, hoje)) return 'agora';
    if (mesmoDia(d, ontem)) return 'ontem';
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
  }

  function formatDiaLongo(date){
    var hoje = new Date();
    var ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
    function mesmoDia(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    if (mesmoDia(date, hoje)) return 'Hoje';
    if (mesmoDia(date, ontem)) return 'Ontem';
    return date.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });

  function conversaExcluida(c){
    var prefs = tagsPorConversa[c.id];
    if (!prefs || !prefs.excluidaAte || !prefs.excluidaAte.toMillis) return false;
    var ultima = c.ultimaMensagemEm && c.ultimaMensagemEm.toMillis ? c.ultimaMensagemEm.toMillis() : 0;
    return ultima <= prefs.excluidaAte.toMillis();
  }

  function conversaOrdenada(){
    var termo = els.buscaConversas.value.trim().toLowerCase();
    var filtroAtivo = Object.keys(tagFilterSelected).filter(function(id){ return tagFilterSelected[id]; });
    var lista = conversas.filter(function(c){
      if (conversaExcluida(c)) return false;
      var arquivada = !!(tagsPorConversa[c.id] && tagsPorConversa[c.id].arquivada);
      if (arquivada !== verArquivadas) return false;
      if (filtroTipo === 'prioritaria' && !(tagsPorConversa[c.id] && tagsPorConversa[c.id].fixada)) return false;
      var tagIds = (tagsPorConversa[c.id] && tagsPorConversa[c.id].etiquetasIds) || [];
      if (filtroAtivo.length && !filtroAtivo.some(function(id){ return tagIds.indexOf(id) !== -1; })) return false;
      if (!termo) return true;
      var nome = tituloConversa(c).toLowerCase();
      if (nome.indexOf(termo) !== -1) return true;
      return tagIds.some(function(id){
        var t = catalogoEtiquetas[id];
        return t && t.nome.toLowerCase().indexOf(termo) !== -1;
      });
    });
    lista.sort(function(a, b){
      var pa = (tagsPorConversa[a.id] && tagsPorConversa[a.id].fixada) ? 1 : 0;
      var pb = (tagsPorConversa[b.id] && tagsPorConversa[b.id].fixada) ? 1 : 0;
      if (pa !== pb) return pb - pa;
      var ta = a.ultimaMensagemEm && a.ultimaMensagemEm.toMillis ? a.ultimaMensagemEm.toMillis() : 0;
      var tb = b.ultimaMensagemEm && b.ultimaMensagemEm.toMillis ? b.ultimaMensagemEm.toMillis() : 0;
      return tb - ta;
    });
    return lista;
  }

  // ---------------- toque longo numa conversa (celular): fixar, arquivar, etiquetas, excluir ----------------
  var toqueLongoAcabou = false; // evita que o "click" de fim do toque abra a conversa
  function ligarToqueLongo(el, id){
    var timer = null, x0 = 0, y0 = 0;
    el.addEventListener('touchstart', function(e){
      var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
      timer = setTimeout(function(){
        timer = null;
        toqueLongoAcabou = true;
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch(err){} }
        if (modoSelecao) alternarSelecao(id); else abrirMenuConversa(id);
      }, 550);
    }, { passive: true });
    el.addEventListener('touchmove', function(e){
      var t = e.touches[0];
      if (timer && (Math.abs(t.clientX - x0) > 10 || Math.abs(t.clientY - y0) > 10)) { clearTimeout(timer); timer = null; }

  function comprimirFoto(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          function tentativa(maxDim, quality){
            var w = img.width, h = img.height;
            if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
            else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            return canvas.toDataURL('image/jpeg', quality);
          }
          var dataUrl = tentativa(1000, 0.72);
          if (dataUrl.length > 700000) dataUrl = tentativa(700, 0.6);
          if (dataUrl.length > 700000) dataUrl = tentativa(500, 0.5);
          if (dataUrl.length > 700000) { reject(new Error('Imagem muito grande mesmo após compressão. Tente outra foto.')); return; }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function comprimirFotoQuadrada(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var lado = Math.min(img.width, img.height);
          var sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;
          var canvas = document.createElement('canvas');
          canvas.width = maxDim; canvas.height = maxDim;
          canvas.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, maxDim, maxDim);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  var LIMITE_DOCUMENTO_BYTES = 500 * 1024;

  function formatBytes(n){
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';

  function lerDocumento(file){
    return new Promise(function(resolve, reject){
      if (file.size > LIMITE_DOCUMENTO_BYTES){
        reject(new Error('Esse arquivo tem ' + formatBytes(file.size) + ' — o limite para documentos no chat é 500 KB. Tente um arquivo menor.'));
        return;
      }
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        resolve({ dataUrl: reader.result, nome: file.name, tipo: file.type || '', tamanho: file.size });
      };
      reader.readAsDataURL(file);
    });
  }

    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      enviarMensagem();
    }
  });
  els.btnEnviar.addEventListener('click', enviarMensagem);

  function postMessageTo(conversaId, msgData, preview){
    return db.collection('conversas').doc(conversaId).collection('mensagens').add(msgData).then(function(){
      var cached = conversas.filter(function(x){ return x.id === conversaId; })[0];
      var participantesPromise = cached
        ? Promise.resolve(cached.participantes || [])
        : db.collection('conversas').doc(conversaId).get().then(function(doc){
            return (doc.exists && doc.data().participantes) || [];
          });
      return participantesPromise.then(function(participantes){
        var updates = {
          ultimaMensagemEm: FV.serverTimestamp(),
          ultimaMensagemPreview: preview.slice(0, 120),
          ultimaMensagemAutor: msgData.autorUid
        };
        participantes.forEach(function(uid){
          updates['naoLidoPor.' + uid] = (uid === msgData.autorUid) ? 0 : FV.increment(1);
        });
        return db.collection('conversas').doc(conversaId).update(updates);
      });
    });
  }

  function enviarMensagem(){
    if (!activeId) return;
    var texto = els.composerInput.value.trim();
    if (!texto && !novaFotoDataUrl && !novoDocumento) return;
    els.btnEnviar.disabled = true;
    var tipo = novoDocumento ? 'documento' : (novaFotoDataUrl ? 'foto' : 'texto');
    var msgData = {
      autorUid: myUid,
      tipo: tipo,
      texto: texto || null,
      fotoBase64: novaFotoDataUrl || null,
      documentoBase64: novoDocumento ? novoDocumento.dataUrl : null,
      documentoNome: novoDocumento ? novoDocumento.nome : null,
      documentoTipo: novoDocumento ? novoDocumento.tipo : null,
      documentoTamanho: novoDocumento ? novoDocumento.tamanho : null,
      encaminhada: false,
      encaminhadaDeAutorNome: null,
      respondendoA: replyTarget ? {
        mensagemId: replyTarget.id,
        autorNome: nomeDe(replyTarget.autorUid),
        resumo: resumoMensagem(replyTarget).slice(0, 140)
      } : null,
      criadoEm: FV.serverTimestamp(),
      lidaPor: [myUid]
    };
    var preview = resumoMensagem(msgData);
    postMessageTo(activeId, msgData, preview).then(function(){
      els.composerInput.value = '';
      els.composerInput.style.height = 'auto';
      limparComposerFoto();
      limparComposerDoc();
      cancelarResposta();
    }).catch(function(e){
      alert('Não foi possível enviar: ' + e.message);
    }).finally(function(){
      els.btnEnviar.disabled = false;
    });
  }

  els.btnPin.addEventListener('click', function(){

  // Dois jeitos de abrir o mesmo modal:
  //  'filtro'  — botão lateral (entre Nova conversa e Arquivadas): filtra a lista, cria, edita e exclui etiquetas;
  //  'aplicar' — dentro da conversa (ou no toque longo): só marca quais das etiquetas já criadas valem para ela.
  var tagModalModo = 'filtro';
  var tagModalConvId = null;
  var tagNewForm = document.querySelector('.tag-new-form');

  function abrirModalEtiquetas(modo, convId){

      : 'Marque quais etiquetas valem para esta conversa. Para criar uma etiqueta nova, use o botão de etiqueta no menu ao lado de "Nova conversa".';

  els.btnEtiquetas.addEventListener('click', function(){ abrirEtiquetasDaConversa(activeId); });

    + '<line x1="29" y1="3.5" x2="29" y2="11.5"></line><line x1="25" y1="7.5" x2="33" y2="7.5"></line></svg>';
  document.getElementById('btn-etiquetas-side').addEventListener('click', function(){ abrirModalEtiquetas('filtro'); });

  function resetFormularioEtiqueta(){
    editingTagId = null;
    novaTagCor = PALETA_ETIQUETAS[0];
    els.tagNomeInput.value = '';
    els.tagFormErr.textContent = '';

  function renderSwatches(){
    els.tagSwatchRow.innerHTML = PALETA_ETIQUETAS.map(function(cor){
      return '<button type="button" class="swatch' + (cor === novaTagCor ? ' active' : '') + '" data-cor="' + cor + '" style="background:' + cor + ';"></button>';
    }).join('');
    Array.prototype.forEach.call(els.tagSwatchRow.querySelectorAll('.swatch'), function(btn){
      btn.addEventListener('click', function(){
        novaTagCor = btn.getAttribute('data-cor');
        renderSwatches();

  function renderTagsModal(){
    var ids = Object.keys(catalogoEtiquetas).sort(function(a, b){
      return catalogoEtiquetas[a].nome.localeCompare(catalogoEtiquetas[b].nome, 'pt-BR');
    });
    var filtro = tagModalModo === 'filtro';
    // tagModalConvId pode ser uma conversa ou várias (seleção em lote): marcada = vale para todas
    var alvos = Array.isArray(tagModalConvId) ? tagModalConvId : (tagModalConvId ? [tagModalConvId] : []);
    var etiquetasDe = function(id){ return (tagsPorConversa[id] && tagsPorConversa[id].etiquetasIds) || []; };
    var aplicadas = Object.keys(catalogoEtiquetas).filter(function(tid){
      return alvos.length && alvos.every(function(id){ return etiquetasDe(id).indexOf(tid) !== -1; });
    });
    if (!ids.length){
      els.tagCatalogList.innerHTML = '<div class="tag-cat-empty">' + (filtro
        ? 'Você ainda não criou nenhuma etiqueta. Crie a primeira ali embaixo.'
        : 'Nenhuma etiqueta criada ainda. Crie no botão de etiqueta ao lado de "Nova conversa".') + '</div>';
    } else {
      els.tagCatalogList.innerHTML = ids.map(function(id){
        var t = catalogoEtiquetas[id];
        var marcada = filtro ? !!tagFilterSelected[id] : aplicadas.indexOf(id) !== -1;
        return '<label class="tag-cat-row">' +
          '<input type="checkbox" data-aplicar="' + id + '" ' + (marcada ? 'checked' : '') + '>' +
          '<span class="dot" style="background:' + t.cor + ';"></span>' +
          '<span class="nome">' + escapeHtml(t.nome) + '</span>' +
          (filtro ? '<span class="acoes">' +
            '<button type="button" data-editar="' + id + '" title="Editar">' + icoSvg('pencil', 13) + '</button>' +
            '<button type="button" data-excluir="' + id + '" title="Excluir">' + icoSvg('trash', 13) + '</button>' +
          '</span>' : '') + '</label>';
      }).join('');
    }

    Array.prototype.forEach.call(els.tagCatalogList.querySelectorAll('[data-aplicar]'), function(chk){
      chk.addEventListener('change', function(){
        var id = chk.getAttribute('data-aplicar');
        if (filtro){
          if (chk.checked) tagFilterSelected[id] = true; else delete tagFilterSelected[id];
          renderConvList();
          return;
        }
        var campo = { etiquetasIds: chk.checked ? FV.arrayUnion(id) : FV.arrayRemove(id) };
        var batch = db.batch();
        alvos.forEach(function(cid){ batch.set(db.collection('chatPrefs').doc(myUid).collection('conversas').doc(cid), campo, { merge: true }); });
        batch.commit().catch(function(e){ alert('Erro: ' + e.message); });
      });
    });
    Array.prototype.forEach.call(els.tagCatalogList.querySelectorAll('[data-editar]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-editar');
        var t = catalogoEtiquetas[id];
        if (!t) return;
        editingTagId = id;
        novaTagCor = t.cor;
        els.tagNomeInput.value = t.nome;
        els.tagFormErr.textContent = '';
        els.tagFormLabel.textContent = 'Editar etiqueta';
        els.tagFormSalvar.textContent = 'Salvar alterações';
        els.tagFormCancelar.style.display = 'inline-block';
        renderSwatches();
      });
    });
    Array.prototype.forEach.call(els.tagCatalogList.querySelectorAll('[data-excluir]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-excluir');
        var t = catalogoEtiquetas[id];
        if (!confirm('Excluir a etiqueta "' + (t ? t.nome : '') + '"? Ela será removida de todas as suas conversas.')) return;
        excluirEtiquetaCatalogo(id);
      });
    });
  }

  function excluirEtiquetaCatalogo(tagId){
    db.collection('chatPrefs').doc(myUid).collection('conversas').where('etiquetasIds', 'array-contains', tagId).get()
      .then(function(snap){
        var batch = db.batch();
        snap.docs.forEach(function(d){ batch.update(d.ref, { etiquetasIds: FV.arrayRemove(tagId) }); });
        return batch.commit();
      })
      .then(function(){
        return db.collection('chatPrefs').doc(myUid).collection('etiquetas').doc(tagId).delete();
      })
      .then(function(){
        delete tagFilterSelected[tagId];
        if (editingTagId === tagId) resetFormularioEtiqueta();
      })
      .catch(function(e){ alert('Não foi possível excluir: ' + e.message); });
  }

  els.tagFormCancelar.addEventListener('click', resetFormularioEtiqueta);
  els.tagNomeInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); els.tagFormSalvar.click(); }
  });

  els.tagFormSalvar.addEventListener('click', function(){
    var nome = els.tagNomeInput.value.trim().toUpperCase();
    if (!nome){
      els.tagFormErr.textContent = 'Dê um nome para a etiqueta.';
      return;
    }
    if (!editingTagId){
      var existente = Object.keys(catalogoEtiquetas).filter(function(id){
        return catalogoEtiquetas[id].nome === nome;
      })[0];
      if (existente){
        els.tagFormErr.textContent = 'Já existe uma etiqueta com esse nome.';
        return;
      }
      db.collection('chatPrefs').doc(myUid).collection('etiquetas').add({ nome: nome, cor: novaTagCor })
        .then(resetFormularioEtiqueta)
        .catch(function(e){ els.tagFormErr.textContent = 'Erro: ' + e.message; });
    } else {
      db.collection('chatPrefs').doc(myUid).collection('etiquetas').doc(editingTagId)
        .set({ nome: nome, cor: novaTagCor }, { merge: true })
        .then(resetFormularioEtiqueta)
        .catch(function(e){ els.tagFormErr.textContent = 'Erro: ' + e.message; });
    }
  });

  // ---------------- picker: nova conversa / encaminhar ----------------

  function ensureIndividualConversa(otherUid){
    var existente = conversas.filter(function(c){
      return c.tipo === 'individual' && c.participantes.indexOf(otherUid) !== -1 && c.participantes.indexOf(myUid) !== -1;
    })[0];
    if (existente) return Promise.resolve(existente.id);
    var naoLidoPor = {}; naoLidoPor[myUid] = 0; naoLidoPor[otherUid] = 0;
    return db.collection('conversas').add({
      participantes: [myUid, otherUid],
      tipo: 'individual',
      nomeGrupo: null,
      criadoPor: myUid,
      criadoEm: FV.serverTimestamp(),
      ultimaMensagemEm: FV.serverTimestamp(),
      ultimaMensagemPreview: 'Conversa iniciada',
      ultimaMensagemAutor: myUid,
      naoLidoPor: naoLidoPor
    }).then(function(doc){ return doc.id; });
  }

  function criarGrupo(uids, nomeGrupo, fotoGrupoBase64){
    var participantes = [myUid].concat(uids.filter(function(u){ return u !== myUid; }));
    var naoLidoPor = {}; participantes.forEach(function(u){ naoLidoPor[u] = 0; });
    var qtdOutros = participantes.length - 1;
    var textoSistema = myNome + ' criou o canal' + (qtdOutros > 0
      ? (' e adicionou ' + qtdOutros + (qtdOutros === 1 ? ' pessoa' : ' pessoas'))
      : '');
    return db.collection('conversas').add({
      participantes: participantes,
      tipo: 'grupo',
      nomeGrupo: nomeGrupo,
      fotoGrupoBase64: fotoGrupoBase64 || null,
      criadoPor: myUid,
      criadoEm: FV.serverTimestamp(),
      ultimaMensagemEm: FV.serverTimestamp(),
      ultimaMensagemPreview: textoSistema,
      ultimaMensagemAutor: myUid,
      naoLidoPor: naoLidoPor
    }).then(function(doc){
      return doc.collection('mensagens').add({
        autorUid: myUid,
        tipo: 'sistema',
        texto: textoSistema,
        fotoBase64: null,
        documentoBase64: null,
        documentoNome: null,
        documentoTipo: null,
        documentoTamanho: null,
        encaminhada: false,
        encaminhadaDeAutorNome: null,
        respondendoA: null,
        criadoEm: FV.serverTimestamp(),
        lidaPor: [myUid]
      }).then(function(){ return doc.id; });
    });
  }

  // ---------------- notificações ----------------
  function atualizarBotaoNotif(){
    if (!('Notification' in window)) { els.btnNotif.style.display = 'none'; return; }
    var ligado = Notification.permission === 'granted' && localStorage.getItem('fb-chat-notif') !== 'off';
    els.btnNotif.innerHTML = icoSvg(ligado ? 'bell' : 'bellOff', 16);
    els.btnNotif.classList.toggle('muted', !ligado);
    els.btnNotif.title = ligado ? 'Notificações ativadas (clique para silenciar)' : 'Ativar notificações de novas mensagens';
  }

  els.btnNotif.addEventListener('click', function(){
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      var ligado = localStorage.getItem('fb-chat-notif') !== 'off';
      localStorage.setItem('fb-chat-notif', ligado ? 'off' : 'on');
      atualizarBotaoNotif();
    } else if (Notification.permission === 'denied') {
      alert('As notificações estão bloqueadas nas configurações do navegador/celular para este site. Permita notificações para o Portal Fonseca e Braga e recarregue a página.');
    } else {
      Notification.requestPermission().then(function(perm){
        if (perm === 'granted') localStorage.setItem('fb-chat-notif', 'on');
        atualizarBotaoNotif();
      });
    }
  });

  function notificarNovaMensagem(c){
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (localStorage.getItem('fb-chat-notif') === 'off') return;
    var corpo = c.ultimaMensagemPreview || 'Nova mensagem';
    if (c.tipo === 'grupo' && c.ultimaMensagemAutor) corpo = nomeDe(c.ultimaMensagemAutor) + ': ' + corpo;
    try {
      var n = new Notification(tituloConversa(c), {
        body: corpo,
        icon: '../../assets/icons/icon-192.png',
        tag: 'fb-chat-' + c.id
      });
      n.onclick = function(){
        try { window.focus(); } catch(e){}
        try { if (window.parent && window.parent !== window) window.parent.focus(); } catch(e){}
        selecionarConversa(c.id);
        n.close();
      };
    } catch(e){}
  }

  function atualizarBadgeApp(lista){
    var total = lista.reduce(function(soma, c){ return soma + ((c.naoLidoPor && c.naoLidoPor[myUid]) || 0); }, 0);
    try {
      if (total > 0 && navigator.setAppBadge) navigator.setAppBadge(total);
      else if (total === 0 && navigator.clearAppBadge) navigator.clearAppBadge();
    } catch(e){}
  }
  els.pickerBusca.addEventListener('input', renderPickerList);

  function renderPickerList(){
    var termo = els.pickerBusca.value.trim().toLowerCase();

    if (pickerMode === 'nova'){
      var contatos = Object.keys(perfis)
        .filter(function(uid){ return uid !== myUid; })
        .map(function(uid){ return { uid: uid, nome: perfis[uid].displayName || 'Colaborador' }; })
        .filter(function(c){ return !termo || c.nome.toLowerCase().indexOf(termo) !== -1; })
        .sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });

      if (!contatos.length){
        els.pickerList.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:.82rem;">Nenhum colaborador encontrado. As pessoas aparecem aqui depois de preencherem "Meu Perfil" ao menos uma vez.</div>';
        return;
      }
      els.pickerList.innerHTML = contatos.map(function(c){
        return '<div class="picker-item" data-uid="' + c.uid + '">' +
          '<input type="checkbox" ' + (pickerSelected[c.uid] ? 'checked' : '') + '>' +
          avatarHtml(c.nome, perfis[c.uid].photoBase64, false, c.uid) +
          '<span class="nome">' + escapeHtml(c.nome) + '</span></div>';
      }).join('');
      Array.prototype.forEach.call(els.pickerList.querySelectorAll('.picker-item'), function(el){
        el.addEventListener('click', function(){
          var uid = el.getAttribute('data-uid');
          pickerSelected[uid] = !pickerSelected[uid];
          var qtd = Object.keys(pickerSelected).filter(function(u){ return pickerSelected[u]; }).length;
          els.pickerNomeGrupo.style.display = qtd > 1 ? 'block' : 'none';
          els.pickerFotoGrupoRow.style.display = qtd > 1 ? 'flex' : 'none';
          renderPickerList();
        });
      });
      return;
    }

    // modo encaminhar: conversas existentes + colaboradores sem conversa individual ainda
    var alvos = conversas.map(function(c){
      return { tipo: 'conversa', id: c.id, nome: tituloConversa(c), sub: c.tipo === 'grupo' ? 'Grupo' : '' };
    });
    var jaTemIndividual = {};
    conversas.forEach(function(c){
      if (c.tipo === 'individual'){
        var outro = c.participantes.filter(function(u){ return u !== myUid; })[0];
        if (outro) jaTemIndividual[outro] = true;
      }
    });
    Object.keys(perfis).forEach(function(uid){
      if (uid === myUid || jaTemIndividual[uid]) return;
      alvos.push({ tipo: 'novo', uid: uid, nome: perfis[uid].displayName || 'Colaborador', sub: 'Nova conversa' });
    });
    alvos = alvos.filter(function(a){ return !termo || a.nome.toLowerCase().indexOf(termo) !== -1; })
      .sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });

    if (!alvos.length){
      els.pickerList.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:.82rem;">Nada encontrado.</div>';
      return;
    }
    els.pickerList.innerHTML = alvos.map(function(a){
      return '<div class="picker-item" data-tipo="' + a.tipo + '" data-alvo="' + (a.id || a.uid) + '">' +
        avatarHtml(a.nome, a.uid ? perfis[a.uid].photoBase64 : null, a.tipo === 'conversa' && a.sub === 'Grupo', a.uid) +
        '<span class="nome">' + escapeHtml(a.nome) + (a.sub ? ' <span class="sub">· ' + escapeHtml(a.sub) + '</span>' : '') + '</span></div>';
    }).join('');
    Array.prototype.forEach.call(els.pickerList.querySelectorAll('.picker-item'), function(el){
      el.addEventListener('click', function(){
        var tipo = el.getAttribute('data-tipo');
        var alvo = el.getAttribute('data-alvo');
        if (tipo === 'conversa') {
          encaminharParaConversa(alvo);
        } else {
          ensureIndividualConversa(alvo).then(function(id){ encaminharParaConversa(id); });
        }
      });
    });
  }

  function encaminharParaConversa(conversaId){
    if (!forwardMsg) return;
    var autorOriginal = forwardMsg.encaminhada ? forwardMsg.encaminhadaDeAutorNome : nomeDe(forwardMsg.autorUid);
    var msgData = {
      autorUid: myUid,
      tipo: forwardMsg.tipo,
      texto: forwardMsg.texto || null,
      fotoBase64: forwardMsg.fotoBase64 || null,
      documentoBase64: forwardMsg.documentoBase64 || null,
      documentoNome: forwardMsg.documentoNome || null,
      documentoTipo: forwardMsg.documentoTipo || null,
      documentoTamanho: forwardMsg.documentoTamanho || null,
      encaminhada: true,
      encaminhadaDeAutorNome: autorOriginal,
      criadoEm: FV.serverTimestamp(),
      lidaPor: [myUid]
    };
    var preview = resumoMensagem(forwardMsg);
    postMessageTo(conversaId, msgData, preview).then(function(){
      fecharPicker();
    }).catch(function(e){ alert('Não foi possível encaminhar: ' + e.message); });
  }

  els.pickerConfirmar.addEventListener('click', function(){
    var uids = Object.keys(pickerSelected).filter(function(u){ return pickerSelected[u]; });
    if (!uids.length){
      els.pickerErr.textContent = 'Escolha ao menos um colaborador.';
      return;
    }
    if (uids.length === 1){
      ensureIndividualConversa(uids[0]).then(function(id){
        fecharPicker();
        selecionarConversa(id);
      });
      return;
    }
    var nomeGrupo = els.pickerNomeGrupo.value.trim();
    if (!nomeGrupo){
      els.pickerErr.textContent = 'Dê um nome para o grupo.';
      return;
    }
    criarGrupo(uids, nomeGrupo, novaFotoGrupoDataUrl).then(function(id){
      fecharPicker();
      selecionarConversa(id);
    });
  });

  // ---------------- boot ----------------

  var naoLidoAnterior = null; // null = ainda não recebeu a primeira carga desta sessão

  function iniciarListeners(){
    atualizarBotaoNotif();

    db.collection('perfis').onSnapshot(function(snap){
      perfis = {};
      snap.docs.forEach(function(d){ perfis[d.id] = d.data(); });
      renderConvList();
      if (activeId) renderMensagens();
    });

    db.collection('conversas').where('participantes', 'array-contains', myUid).onSnapshot(function(snap){
      conversas = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });

      if (naoLidoAnterior) {
        conversas.forEach(function(c){
          var atual = (c.naoLidoPor && c.naoLidoPor[myUid]) || 0;
          var anterior = naoLidoAnterior[c.id] || 0;
          var estaAberta = activeId === c.id && !document.hidden;
          if (atual > anterior && c.ultimaMensagemAutor !== myUid && !estaAberta) {
            notificarNovaMensagem(c);
          }
        });
      }
      naoLidoAnterior = {};
      conversas.forEach(function(c){ naoLidoAnterior[c.id] = (c.naoLidoPor && c.naoLidoPor[myUid]) || 0; });
      atualizarBadgeApp(conversas);

      renderConvList();
      if (activeId){
        var c = conversas.filter(function(x){ return x.id === activeId; })[0];
        if (c){
          els.threadTitle.textContent = tituloConversa(c);
          els.threadSub.textContent = subConversa(c);
        }
      }
    }, function(e){
      els.convList.innerHTML = '<div class="conv-empty">Não foi possível carregar as conversas: ' + escapeHtml(e.message) + '</div>';
    });

    db.collection('chatPrefs').doc(myUid).collection('conversas').onSnapshot(function(snap){
      tagsPorConversa = {};
      snap.docs.forEach(function(d){ tagsPorConversa[d.id] = d.data(); });
      renderConvList();
      if (els.tagsBackdrop.classList.contains('open')) renderTagsModal();
      if (activeId){
        var fixada = tagsPorConversa[activeId] && tagsPorConversa[activeId].fixada;
        els.btnPin.innerHTML = fixada ? (icoSvg('starFilled', 13) + ' Fixada') : (icoSvg('starOutline', 13) + ' Fixar');
        els.btnPin.classList.toggle('on', !!fixada);
        var arquivada = tagsPorConversa[activeId] && tagsPorConversa[activeId].arquivada;
        els.btnArquivar.innerHTML = arquivada ? (icoSvg('unarchive', 13) + ' Desarquivar') : (icoSvg('archive', 13) + ' Arquivar');
        els.btnArquivar.classList.toggle('on', !!arquivada);
        if (conversaExcluida(conversas.filter(function(x){ return x.id === activeId; })[0] || {})) voltarParaListaVazia();
      }
    });

    db.collection('chatPrefs').doc(myUid).collection('etiquetas').onSnapshot(function(snap){
      catalogoEtiquetas = {};
      snap.docs.forEach(function(d){ catalogoEtiquetas[d.id] = d.data(); });
      renderConvList();
      if (els.tagsBackdrop.classList.contains('open')) renderTagsModal();
    });
  }

  auth.onAuthStateChanged(function(user){
    if (!user){
      els.gate.style.display = 'block';
      els.gate.textContent = 'Faça login pelo Portal Fonseca e Braga para usar o chat interno.';
      els.shell.style.display = 'none';
      return;
    }
    myUid = user.uid;
    Promise.all([
      db.collection('users').doc(user.uid).get(),
      db.collection('perfis').doc(user.uid).get()
    ]).then(function(results){
      var userDoc = results[0], perfilDoc = results[1];
      if (!userDoc.exists){
        els.gate.style.display = 'block';
        els.gate.textContent = 'Seu usuário ainda não tem acesso configurado no portal.';
        return;
      }
      myNome = (perfilDoc.exists && perfilDoc.data().displayName) || userDoc.data().displayName || user.email;
      els.gate.style.display = 'none';
      els.shell.style.display = 'flex';
      iniciarListeners();
    });
  });

  els.buscaConversas.addEventListener('input', renderConvList);

})();
</script>
</body>
</html>
