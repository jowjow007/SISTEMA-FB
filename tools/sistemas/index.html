<head>

<style>
  :root{
    --ink:#161010;
    --panel:#211918;
    --panel-2:#2a1f1e;
    --paper:#ece6e1;
    --muted:#9c908b;
    --red:#b8362e;
    --red-bright:#c9463c;
    --red-deep:#5c1a16;
    --silver:#a9adb2;
    --line:rgba(236,230,225,0.10);
    --line-strong:rgba(236,230,225,0.18);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"Consolas","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden;}
  a{color:inherit;}
  button{font-family:inherit;}

  #shell{display:flex;flex-direction:column;height:100%;}

  nav.subtabs{
    flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line-strong);
    display:flex;gap:2px;overflow-x:auto;padding:0 14px;
  }
  nav.subtabs button{
    flex:0 0 auto;background:transparent;border:none;border-bottom:3px solid transparent;
    padding:12px 14px;font-size:.82rem;font-weight:600;color:var(--muted);
    cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;
  }
  nav.subtabs button:hover{color:var(--paper);}
  nav.subtabs button.active{color:var(--red-bright);border-bottom-color:var(--red-bright);}

  #panels{position:relative;flex:1 1 auto;min-height:0;}
  .panel{position:absolute;inset:0;display:none;flex-direction:column;}
  .panel.active{display:flex;}

  .frame-toolbar{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:7px 16px;background:var(--panel-2);border-bottom:1px solid var(--line);
    font-size:.76rem;color:var(--muted);
  }
  .frame-toolbar a{color:var(--silver);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
  .frame-toolbar a:hover{color:#fff;}
  iframe.tool-frame{flex:1 1 auto;width:100%;border:none;background:#fff;}

  .fallback{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:30px;overflow-y:auto;}
  .fallback .card{max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:32px 28px;}
  .fallback .ic{font-size:2.2rem;margin-bottom:14px;}
  .fallback h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 10px;color:var(--paper);}
  .fallback p{font-size:.85rem;color:var(--muted);line-height:1.55;margin:0 0 20px;}
  .btn-open{
    display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:none;border-radius:8px;
    padding:11px 20px;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:none;
  }
  .btn-open:hover{background:var(--red-bright);}

  .links-view{flex:1 1 auto;overflow-y:auto;padding:26px 26px 40px;}
  .links-view .lead{font-size:.83rem;color:var(--muted);max-width:640px;line-height:1.55;margin:0 0 20px;}
  .link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .link-card{background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .link-card h3{margin:0;font-size:.95rem;color:var(--paper);}
  .link-card a.go{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;
    color:var(--red-bright);text-decoration:none;
  }
  .link-card a.go:hover{color:#fff;}

  @media(max-width:640px){
    .link-grid{grid-template-columns:1fr;}
  }

  .contacts-view{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  .contacts-toolbar{
    flex:0 0 auto;padding:14px 26px;border-bottom:1px solid var(--line-strong);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .contacts-search{
    flex:1 1 260px;max-width:420px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;
    padding:9px 12px;color:var(--paper);font-size:.85rem;
  }
  .contacts-search::placeholder{color:var(--muted);}
  .contacts-count{font-size:.78rem;color:var(--muted);white-space:nowrap;}
  .contacts-list{flex:1 1 auto;overflow-y:auto;padding:4px 26px 40px;}
  .contact-row{padding:12px 4px;border-bottom:1px solid var(--line);}
  .contact-row .nome{font-weight:700;font-size:.87rem;color:var(--paper);}
  .contact-row .orgao{font-size:.76rem;color:var(--silver);margin-top:1px;}
  .contact-row .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--muted);margin-top:4px;}
  .contact-row .meta a{color:var(--red-bright);text-decoration:none;}
  .contact-row .meta a:hover{color:#fff;}
  .contact-row .obs{font-size:.73rem;color:var(--muted);font-style:italic;margin-top:3px;}
  .contacts-empty{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem;}

  /* nomenclatura (copiado de tools/condominios, mesmo visual/comportamento original) */
  .nomenclatura-view{flex:1 1 auto;overflow-y:auto;background:#faf7f2;color:#211a17;padding:34px 26px 60px;}
  .nomenclatura-view .kicker{font-size:.68rem;letter-spacing:.12em;color:#8a231f;text-transform:uppercase;font-weight:700;margin:0 0 8px;}
  .nomenclatura-view h1{font-family:var(--font-display);font-size:2rem;margin:0 0 10px;color:#211a17;font-weight:600;}
  .nomenclatura-view .lead{font-size:.95rem;color:#7c716a;max-width:760px;line-height:1.55;margin:0 0 24px;}
  .nomenclatura-view hr.rule{border:none;border-top:1px solid #e7e1d8;margin:0 0 30px;}
  .nomenclatura-view .grid.g2{display:grid;gap:18px;grid-template-columns:1fr 1fr;}
  .nomenclatura-view .box{background:#ffffff;border:1px solid #e7e1d8;border-radius:12px;padding:20px;}
  .nomenclatura-view .box h3{font-family:var(--font-display);color:#211a17;}
  .nomenclatura-view .nom-types{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .nomenclatura-view .nom-types button{flex:1 1 160px;background:#ffffff;border:1px solid #e7e1d8;border-radius:10px;padding:16px 10px;
    text-align:center;font-family:var(--font-body);font-size:.83rem;font-weight:600;color:#211a17;cursor:pointer;}
  .nomenclatura-view .nom-types button .ic{display:block;font-size:1.2rem;margin-bottom:6px;}
  .nomenclatura-view .nom-types button.active{background:#8a231f;border-color:#8a231f;color:#fff;}
  .nomenclatura-view .nom-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .nomenclatura-view .nom-form label{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#7c716a;margin-bottom:5px;}
  .nomenclatura-view .nom-form input,.nomenclatura-view .nom-form select{width:100%;padding:9px 11px;border:1px solid #e7e1d8;border-radius:8px;font-size:.85rem;
    font-family:var(--font-body);background:#fff;color:#211a17;}
  .nomenclatura-view .nom-result{background:#f1ece4;border:1px solid #e7e1d8;border-radius:10px;padding:16px;font-family:var(--font-mono);
    font-size:.85rem;color:#211a17;min-height:70px;word-break:break-word;line-height:1.5;}
  .nomenclatura-view .copy-btn{margin-top:14px;background:#8a231f;color:#fff;border:none;border-radius:8px;padding:11px 16px;font-weight:700;
    font-size:.85rem;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);}
  .nomenclatura-view .copy-btn:active{background:#5c1a16;}

  @media(max-width:640px){
    .nomenclatura-view .grid.g2,.nomenclatura-view .nom-form{grid-template-columns:1fr;}
  }
</style>
</head>

  var nav = document.getElementById('subtabs-nav');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- nomenclatura generator (POP nº 008/2023) — copiado de tools/condominios ---------- */

  var NOM_TYPES = [
    {id:'judicial', ic:'⚖️', label:'Judicial'},
    {id:'administrativo', ic:'📄', label:'Administrativo'},
    {id:'honorarios', ic:'📝', label:'Contrato de Honorários'},
    {id:'notificacao', ic:'🏢', label:'Notificação Condominial'}
  ];
  var nomState = { tipo:'judicial' };

  function viewNomenclatura(){
    return '<div class="kicker">POP Nº 008/2023</div>'
      + '<h1>Nomenclatura de Documentos</h1>'
      + '<p class="lead">Selecione o tipo de documento, preencha os campos e copie o nome formatado conforme o padrão do escritório.</p>'
      + '<hr class="rule">'
      + '<div class="nom-types">' + NOM_TYPES.map(function(t){
          var active = t.id===nomState.tipo ? ' active' : '';
          return '<button type="button" class="'+active+'" data-nom-type="'+t.id+'"><span class="ic">'+t.ic+'</span>'+t.label+'</button>';
        }).join('') + '</div>'
      + '<div class="grid g2">'
        + '<div class="box" style="margin-bottom:0;"><h3 style="margin:0 0 14px;font-size:1rem;">Preencha os campos</h3><div class="nom-form" id="nom-fields"></div></div>'
        + '<div class="box" style="margin-bottom:0;"><h3 style="margin:0 0 14px;font-size:1rem;">Resultado</h3>'
          + '<div class="nom-result" id="nom-result">—</div>'
          + '<button class="copy-btn" id="nom-copy">📋 Copiar nome</button>'
        + '</div>'
      + '</div>';
  }

  var NOM_FIELD_DEFS = {
    judicial: [
      {k:'autor', label:'Autor'}, {k:'reu', label:'Réu'},
      {k:'peca', label:'Nome da Peça'}, {k:'valor', label:'Valor (opcional)'},
      {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
    ],
    administrativo: [
      {k:'parte1', label:'Parte 1'}, {k:'parte2', label:'Parte 2 (opcional)'},
      {k:'arquivo', label:'Nome do Arquivo'}, {k:'valor', label:'Valor (opcional)'},
      {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
    ],
    honorarios: [
      {k:'parte', label:'Parte'},
      {k:'tipo', label:'Tipo', type:'select', options:['AVULSO JUDICIAL','AVULSO EXTRAJUDICIAL','ASSESSORIA','PARALEGAL']},
      {k:'criador', label:'Criador'}, {k:'data', label:'Data', type:'date'}
    ],
    notificacao: [
      {k:'condominio', label:'Nome do Condomínio'}, {k:'torre', label:'Torre'},
      {k:'apto', label:'Apto'}, {k:'ocorrencia', label:'Ocorrência #'},
      {k:'titulo', label:'Título da Ocorrência'}, {k:'criador', label:'Criador'},
      {k:'data', label:'Data', type:'date'}
    ]
  };

  function bindNomenclatura(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-nom-type]'), function(b){
      b.addEventListener('click', function(){
        nomState.tipo = b.getAttribute('data-nom-type');
        Array.prototype.forEach.call(document.querySelectorAll('[data-nom-type]'), function(bb){
          bb.classList.toggle('active', bb.getAttribute('data-nom-type') === nomState.tipo);
        });
        renderNomFields();
      });
    });
    renderNomFields();
    document.getElementById('nom-copy').addEventListener('click', copyNomResult);
  }

  function renderNomFields(){
    var defs = NOM_FIELD_DEFS[nomState.tipo];
    var el = document.getElementById('nom-fields');
    el.innerHTML = defs.map(function(f){
      if(f.type === 'select'){
        return '<div><label>'+f.label+'</label><select data-nk="'+f.k+'">'
          + f.options.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('')
          + '</select></div>';
      }
      return '<div><label>'+f.label+'</label><input data-nk="'+f.k+'" type="'+(f.type||'text')+'" placeholder="'+f.label.toUpperCase()+'"></div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-nk]'), function(inp){
      inp.addEventListener('input', updateNomResult);
      inp.addEventListener('change', updateNomResult);
    });
    updateNomResult();
  }

  function abrevData(v){
    if(!v) return '';
    var p = v.split('-');
    if(p.length !== 3) return v;
    return p[2] + '.' + p[1] + '.' + p[0].slice(2);
  }

  function nomVal(k){
    var el = document.querySelector('[data-nk="'+k+'"]');
    if(!el) return '';
    return el.value.trim();
  }

  function updateNomResult(){
    var tipo = nomState.tipo;
    var out = '';
    if(tipo === 'judicial'){
      var autor=nomVal('autor').toUpperCase(), reu=nomVal('reu').toUpperCase(), peca=nomVal('peca').toUpperCase(),
          valor=nomVal('valor').toUpperCase(), criador=nomVal('criador').toUpperCase(), data=abrevData(nomVal('data'));
      var parts = ['('+(autor||'AUTOR')+' X '+(reu||'RÉU')+')', peca||'NOME DA PEÇA'];
      if(valor) parts.push(valor);
      parts.push(criador||'CRIADOR', data||'DD.MM.AA');
      out = parts.join(' – ');
    } else if(tipo === 'administrativo'){
      var p1=nomVal('parte1').toUpperCase(), p2=nomVal('parte2').toUpperCase(), arq=nomVal('arquivo').toUpperCase(),
          val=nomVal('valor').toUpperCase(), cr=nomVal('criador').toUpperCase(), dt=abrevData(nomVal('data'));
      var partyStr = p2 ? '('+(p1||'PARTE 1')+' X '+p2+')' : '('+(p1||'PARTE')+')';
      var parts2 = [partyStr, arq||'NOME DO ARQUIVO'];
      if(val) parts2.push(val);
      parts2.push(cr||'CRIADOR', dt||'DD.MM.AA');
      out = parts2.join(' – ');
    } else if(tipo === 'honorarios'){
      var pt=nomVal('parte').toUpperCase(), tp=nomVal('tipo')||'AVULSO JUDICIAL',
          cr2=nomVal('criador').toUpperCase(), dt2=abrevData(nomVal('data'));
      out = '('+(pt||'PARTE')+') – CPSHA - '+tp+' – '+(cr2||'CRIADOR')+' – '+(dt2||'DD.MM.AA');
    } else if(tipo === 'notificacao'){
      var cond=nomVal('condominio').toUpperCase(), torre=nomVal('torre'), apto=nomVal('apto'),
          oc=nomVal('ocorrencia'), tit=nomVal('titulo').toUpperCase(), cr3=nomVal('criador').toUpperCase(),
          dt3=abrevData(nomVal('data'));
      out = '(COND. '+(cond||'X')+' T'+(torre||'X')+', APTO '+(apto||'XXX')+') #'+(oc||'000')
        + ' – NOTIFICAÇÃO – '+(tit||'TÍTULO DA OCORRÊNCIA')+' – '+(cr3||'CRIADOR')+' – '+(dt3||'DD.MM.AA');
    }
    var resEl = document.getElementById('nom-result');
    if(resEl) resEl.textContent = out;
  }

  function copyNomResult(){
    var txt = document.getElementById('nom-result').textContent;
    var btn = document.getElementById('nom-copy');
    var done = function(){ var old = btn.innerHTML; btn.innerHTML = '✓ Copiado'; setTimeout(function(){ btn.innerHTML = old; }, 1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopyNom(txt, done); });
    } else {
      fallbackCopyNom(txt, done);
    }
  }
  function fallbackCopyNom(txt, cb){
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(cb) cb();
  }

  SUBTABS.forEach(function(t){
    var btn = document.createElement('button');
    btn.textContent = t.label;
    btn.dataset.subtabId = t.id;
    btn.addEventListener('click', function(){ selectSubtab(t.id); });
    nav.appendChild(btn);

    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + t.id;

    if (t.type === 'blocked') {
      panel.innerHTML =
        '<div class="fallback"><div class="card">' +
          '<div class="ic">' + t.icon + '</div>' +
          '<h2>' + escapeHtml(t.label) + '</h2>' +
          '<p>' + escapeHtml(t.note) + '</p>' +
          '<a class="btn-open" href="' + t.url + '" target="_blank" rel="noopener">Abrir ' + escapeHtml(t.label) + ' ↗</a>' +
        '</div></div>';
    } else if (t.type === 'links') {
      var cards = t.links.map(function(l){
        return '<div class="link-card"><h3>' + escapeHtml(l.nome) + '</h3>' +
          '<a class="go" href="' + l.url + '" target="_blank" rel="noopener">Abrir ↗</a></div>';
      }).join('');
      panel.innerHTML =
        '<div class="links-view">' +
          '<p class="lead">Principais portais de tribunais utilizados pelo escritório.</p>' +
          '<div class="link-grid">' + cards + '</div>' +
        '</div>';
    } else if (t.type === 'contacts') {
      panel.innerHTML =
        '<div class="contacts-view">' +
          '<div class="contacts-toolbar">' +
            '<input type="text" class="contacts-search" id="contacts-search" placeholder="Buscar por nome, órgão, e-mail ou telefone…">' +
            '<span class="contacts-count" id="contacts-count"></span>' +
          '</div>' +
          '<div class="contacts-list" id="contacts-list"></div>' +
        '</div>';
    } else if (t.type === 'nomenclatura') {
      panel.innerHTML = '<div class="nomenclatura-view">' + viewNomenclatura() + '</div>';
    }
    // 'iframe' panels are filled lazily on first visit in selectSubtab()

    panelsEl.appendChild(panel);

  function contactTitle(c){
    return (c.nome && c.nome.trim()) ? c.nome.trim() : (c.emails[0] || '(sem nome)');
  }

  function renderContactRow(c){
    var metaParts = [];
    c.emails.forEach(function(e){
      metaParts.push('<a href="mailto:' + escapeHtml(e) + '">' + escapeHtml(e) + '</a>');
    });
    if (c.telefone) metaParts.push('<span>' + escapeHtml(c.telefone) + '</span>');
    var html = '<div class="contact-row">' +
      '<div class="nome">' + escapeHtml(contactTitle(c)) + '</div>';
    if (c.orgao) html += '<div class="orgao">' + escapeHtml(c.orgao) + '</div>';
    if (metaParts.length) html += '<div class="meta">' + metaParts.join('') + '</div>';
    if (c.obs) html += '<div class="obs">' + escapeHtml(c.obs) + '</div>';
    html += '</div>';
    return html;
  }

  function contactMatches(c, termo){
    var alvo = [contactTitle(c), c.orgao, c.telefone, c.obs].concat(c.emails).join(' ').toLowerCase();
    return alvo.indexOf(termo) !== -1;
  }

  function renderContactsList(termo){
    var listEl = document.getElementById('contacts-list');
    var countEl = document.getElementById('contacts-count');
    if (!listEl) return;
    var filtrados = termo ? CONTACTS.filter(function(c){ return contactMatches(c, termo); }) : CONTACTS;
    countEl.textContent = filtrados.length + (filtrados.length === 1 ? ' contato' : ' contatos');
    listEl.innerHTML = filtrados.length
      ? filtrados.map(renderContactRow).join('')
      : '<div class="contacts-empty">Nenhum contato encontrado.</div>';
  }

  function initContactsSubtab(){
    var searchEl = document.getElementById('contacts-search');
    if (!searchEl || searchEl.dataset.bound) return;
    searchEl.dataset.bound = '1';
    searchEl.addEventListener('input', function(){
      renderContactsList(searchEl.value.trim().toLowerCase());
    });
    renderContactsList('');
  }

  var nomenclaturaBound = false;
  function initNomenclaturaSubtab(){
    if (nomenclaturaBound) return;
    nomenclaturaBound = true;
    bindNomenclatura();
  }

  function selectSubtab(id){
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.dataset.subtabId === id);
    });
    Array.prototype.forEach.call(panelsEl.querySelectorAll('.panel'), function(p){
      p.classList.remove('active');
    });
    var panel = document.getElementById('panel-' + id);
    if (!panel) return;
    panel.classList.add('active');

    var t = SUBTABS.filter(function(x){ return x.id === id; })[0];
    if (t && t.type === 'contacts') {
      initContactsSubtab();
    } else if (t && t.type === 'nomenclatura') {
      initNomenclaturaSubtab();
    } else if (t && t.type === 'iframe' && !iframes[id]) {
      var toolbar = document.createElement('div');
      toolbar.className = 'frame-toolbar';
      toolbar.innerHTML = '<span>' + escapeHtml(t.label) + '</span>' +
        '<a href="' + t.url + '" target="_blank" rel="noopener">Abrir em nova aba ↗</a>';
      var ifr = document.createElement('iframe');
      ifr.className = 'tool-frame';
      ifr.src = t.url;
      panel.appendChild(toolbar);
      panel.appendChild(ifr);
      iframes[id] = ifr;
    }
  }

  selectSubtab(SUBTABS[0].id);
})();
