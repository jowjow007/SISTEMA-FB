<script>
(function(){
  try{
    var t = localStorage.getItem('fb-portal-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key === 'fb-portal-theme'){
      if(e.newValue === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }
  });
})();
</script>
<style>
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:url('../../assets/bg-texture.jpg') repeat;background-size:280px auto;opacity:.05;}
  :root{
    --ink:#161010;--panel:#211918;--panel-2:#2a1f1e;--panel-3:#332624;--paper:#ece6e1;--muted:#9c908b;
    --red:#b8362e;--red-bright:#c9463c;--red-deep:#5c1a16;--gold:#d8b25a;--green:#5fae7b;--blue:#6ea8dc;--amber:#d9a441;
    --line:rgba(236,230,225,0.10);--line-strong:rgba(236,230,225,0.18);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --ink:#f3efe9;--panel:#ffffff;--panel-2:#f1ece6;--panel-3:#e8e1da;--paper:#241c1b;--muted:#7d716b;
    --line:rgba(36,28,27,0.10);--line-strong:rgba(36,28,27,0.16);--green:#2f8a52;--blue:#2f6fa8;--amber:#a87412;
  }
  *{box-sizing:border-box;}
  *{scrollbar-width:thin;scrollbar-color:var(--red-deep) var(--panel-2);}
  html,body{margin:0;min-height:100%;background:var(--panel);color:var(--paper);font-family:var(--font-body);}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-strong);padding:16px 20px 12px;}
  header .topo{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header h1{font-family:var(--font-display);font-weight:600;font-size:1.45rem;margin:0;flex:1 1 auto;}
  header .sub{max-width:1080px;margin:4px auto 0;font-size:.8rem;color:var(--muted);}
  main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 20px 70px;}
  #gate{padding:70px 20px;text-align:center;color:var(--muted);}
  h2{font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin:0 0 4px;}
  .muted{color:var(--muted);} .small{font-size:.78rem;}
  .btn{padding:8px 15px;border-radius:8px;border:none;background:var(--red);color:#fff;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--red-bright);} .btn:disabled{opacity:.5;cursor:default;}
  .btn.sec{background:var(--panel-3);color:var(--paper);border:1px solid var(--line-strong);}
  .btn.sec:hover{background:var(--panel-2);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line-strong);}
  .btn.verde{background:#2e6b50;} .btn.verde:hover{background:#357a5d;}
  .btn.peq{padding:5px 10px;font-size:.74rem;}
  .voltar{background:none;border:none;color:var(--gold);cursor:pointer;font-size:.82rem;padding:0;margin:0 0 14px;font-family:inherit;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--paper);font-size:.8rem;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff;}
  .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px;}
  .barra .espaco{flex:1 1 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--line-strong);border-radius:14px;padding:16px;}
  .card.click{cursor:pointer;transition:border-color .15s,transform .15s;} .card.click:hover{border-color:var(--gold);transform:translateY(-1px);}
  .card h3{margin:0 0 4px;font-size:1rem;}
  .tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:10px;border:1px solid currentColor;}
  .tag.rasc{color:var(--muted);} .tag.lib{color:var(--blue);} .tag.real{color:var(--gold);}
  .tag.agu{color:var(--amber);} .tag.lanc{color:var(--red-bright);} .tag.mant{color:var(--red-bright);} .tag.canc{color:var(--green);} .tag.mod{color:var(--blue);}
  .prog{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin-top:10px;}
  .prog > div{height:100%;background:var(--gold);}
  .linha{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-bottom:8px;cursor:pointer;}
  .linha:hover{border-color:var(--gold);}
  .linha .num{font-weight:700;color:var(--gold);min-width:74px;font-size:.85rem;}
  .linha .tit{flex:1 1 auto;min-width:0;}
  .linha .tit b{display:block;font-size:.88rem;} .linha .tit span{font-size:.74rem;color:var(--muted);}
  .vazio{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:14px;}
  /* passo a passo do recurso */
  .passos{display:flex;gap:4px;margin:6px 0 18px;overflow-x:auto;border-bottom:1px solid var(--line-strong);}
  .passos button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .passos button .n{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:var(--panel-3);font-size:.7rem;margin-right:6px;}
  .passos button.on{color:var(--paper);border-bottom-color:var(--red);} .passos button.on .n{background:var(--red);color:#fff;}
  .ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px;}
  .ficha > div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  .ficha .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .ficha .v{font-size:.9rem;font-weight:600;margin-top:2px;white-space:pre-wrap;}
  .texto{white-space:pre-wrap;line-height:1.6;font-size:.92rem;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .navpassos{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
  .provas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .prova{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .prova .cab{display:flex;gap:8px;align-items:center;font-size:.8rem;margin-bottom:8px;}
  .prova .cab b{flex:1 1 auto;word-break:break-word;}
  .prova video,.prova img{width:100%;border-radius:8px;background:#000;display:block;max-height:240px;object-fit:contain;}
  .prova .abrir{width:100%;padding:24px 8px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--panel);color:var(--paper);cursor:pointer;font-family:inherit;font-size:.82rem;}
  .grupo-provas{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:16px 0 8px;font-weight:700;}
  .decisao{border:2px solid var(--gold);border-radius:14px;padding:16px;background:var(--panel-2);}
  .decisao .res{font-family:var(--font-display);font-size:1.3rem;font-weight:600;margin-bottom:6px;}
  textarea,input,select{font-family:inherit;}
  .campo{margin-bottom:12px;}
  .campo label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
  .campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--paper);font-size:.88rem;outline:none;}
  .campo textarea{min-height:90px;resize:vertical;line-height:1.5;}
  .campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--red);}
  .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px;}
  .opcoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .opcoes label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel-2);cursor:pointer;font-size:.86rem;}
  .opcoes label.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .campo .opcoes input{width:auto;margin:0;}
  .campo .opcoes label{text-transform:none;letter-spacing:normal;color:var(--paper);font-size:.86rem;margin:0;display:flex;}
  table.t select{padding:5px 8px;border-radius:7px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--paper);font-size:.8rem;}
  .aviso{padding:10px 13px;border-radius:10px;border:1px solid rgba(217,164,65,.5);background:rgba(217,164,65,.08);font-size:.82rem;margin-bottom:14px;line-height:1.5;}
  .ok{color:var(--green);} .err{color:var(--red-bright);}
  .upl{border:2px dashed var(--line-strong);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:12px;}
  .upl.drag{border-color:var(--gold);color:var(--paper);}
  .barra-up{height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden;margin-top:6px;} .barra-up div{height:100%;background:var(--green);width:0;}
  table.t{width:100%;border-collapse:collapse;font-size:.84rem;}
  table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.t th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .resumo-ementario{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .resumo-ementario div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem;}
  .resumo-ementario b{font-size:1.1rem;display:block;}
  .notas textarea{min-height:110px;}
  .lido{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;}
  @media (max-width:640px){ main{padding:16px 14px 60px;} .linha{flex-wrap:wrap;} }
</style>
</head>
<body>
<header>
  <div class="topo">
    <a id="voltar-condo" class="btn ghost peq" href="../condominios/index.html" style="display:none;">← Condomínios</a>
    <h1>⚖️ Sessões de Julgamento</h1>
    <span id="quem" class="muted small"></span>
  </div>
  <p class="sub" id="sub-cab">Recursos contra multas e advertências condominiais, para análise do conselho.</p>
</header>
<main>
  <div id="gate">Carregando…</div>
  <div id="app" style="display:none;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" integrity="sha384-1hBNr0agKHNFwbheHcAJzeLri4PPLTLbaXUH5d9CauwS3A/PrkIt2tzxBJK3bHjY" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" integrity="sha384-QCZO5nLB2oUUv0yv01wZHylPt2CPzKdo0YnmSYCTIOo8XPPIlsIP3f1cikv2oiJ1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" integrity="sha384-qhzYx5B1KizZLjRTmJkBWYES6I+tL9Qz1J8BmFNo/18Ix+AtopUC1cuY3VW43Pe0" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js" integrity="sha384-I6aFwEp+2h4APt6+0RW32Ej4KnvuY3aO+maGRYNKNZtt2W2Hz/pEiyd+VJSm9QvQ" crossorigin="anonymous"></script>
<script src="../../firebase-config.js"></script>
<script>
(function(){
  "use strict";
  // Sessões de Julgamento (04/11/2026). O escritório monta cada recurso (resumo + provas) e libera ao conselho;
  // síndico e conselheiros (contas "cliente" vinculadas em conselhoMembros) leem só o próprio condomínio.
  // As provas ficam no Storage (julgamentos/{condominio}/{recurso}/...) e saem do portal 90 dias depois do
  // julgamento; o original continua no Google Drive do escritório (guarda de 10 anos).
  if (typeof firebaseConfig === 'undefined' || firebaseConfig.apiKey === "COLE_AQUI_SUA_API_KEY") {   // const em firebase-config.js: não fica em window
    document.getElementById('gate').textContent = 'Configuração pendente: firebase-config.js não foi preenchido.';
    return;
  }
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth(), db = firebase.firestore(), storage = firebase.storage();
  var FV = firebase.firestore.FieldValue, TS = firebase.firestore.Timestamp;
  var DIAS_PROVAS = 90;
  // aberta pelo cartão do hub de Condomínios (equipe, síndico e conselheiros): botão de volta ao hub
  try { if (/\/tools\/condominios\//.test(document.referrer || '')) document.getElementById('voltar-condo').style.display = ''; } catch (e) {}
  // tipos de usuário de fora do escritório (mesmo acesso restrito; regras: isContaCliente)
  var TIPOS = { membro:'Membro', cliente:'Cliente', gestor:'Gestor', admin:'Administrador', conselheiro:'Conselheiro', sindico:'Síndico' };
  function contaCliente(role){ return role === 'cliente' || role === 'conselheiro' || role === 'sindico'; }
  // leitura das provas pela API do Storage com o login da pessoa (passa pelas regras; nenhum link público é entregue)
  var STORAGE_HOST = firebase.__emuladores ? 'http://127.0.0.1:9199' : 'https://firebasestorage.googleapis.com';

  var CATEGORIAS = [
    { id:'ocorrencia', rot:'Ocorrência (BRCondos)' },
    { id:'prova', rot:'Provas (vídeos, fotos, prints)' },
    { id:'recurso', rot:'Recurso do morador' },
    { id:'resumo', rot:'Resumo do escritório' },
    { id:'outro', rot:'Outros documentos' }
  ];
  var RESULTADOS = {
    mantida:   { rot:'Penalidade mantida', tag:'mant' },
    cancelada: { rot:'Penalidade cancelada', tag:'canc' },
    modulada:  { rot:'Penalidade modulada', tag:'mod' }
  };
  var MODULACOES = {
    advertencia: 'Convertida em advertência',
    reducao: 'Multa reduzida',
    parcelamento: 'Multa parcelada',
    outra: 'Outra modulação'
  };

  var me = null;                 // { uid, nome, email, role }
  var equipe = false, admin = false;
  var condos = [];               // [{ slug, nome, papel? }]
  var sessoes = {}, recursos = {}, leituras = {};
  var state = { view:'lista', condo:null, sessaoId:null, recursoId:null, passo:0, editarPasso:0 };
  var urlsProvas = {};           // caminho -> object URL (só nesta aba)
  var app = document.getElementById('app');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function slugify(s){
    var acentos = new RegExp('[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g');
    return (s || '').toString().toLowerCase().normalize('NFD').replace(acentos, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  }
  function dataBR(iso){ if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function dataHoraBR(iso){ if (!iso) return 'data a definir'; var h = String(iso).slice(11, 16); return dataBR(iso) + (h ? ' às ' + h.replace(':', 'h') : ''); }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function tsData(t){ return t && t.toDate ? t.toDate() : null; }
  function tamanho(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function nomeCondo(slug){ var c = condos.find(function(x){ return x.slug === slug; }); return c ? c.nome : slug; }
  function recursosDaSessao(id){
    return Object.values(recursos).filter(function(r){ return r.sessaoId === id; })
      .sort(function(a, b){ return String(a.ocorrencia).localeCompare(String(b.ocorrencia), 'pt-BR', { numeric:true }); });
  }
  function sessoesDoCondo(slug){
    return Object.values(sessoes).filter(function(s){ return s.condominioSlug === slug; })
      .sort(function(a, b){ return String(b.data || '9999').localeCompare(String(a.data || '9999')); });
  }
  function statusRecurso(r){
    if (r.decisao && r.decisao.resultado) return { rot: RESULTADOS[r.decisao.resultado].rot, tag: RESULTADOS[r.decisao.resultado].tag };
    var s = sessoes[r.sessaoId];
    if (s && s.realizada) return { rot:'Julgado — decisão a lançar', tag:'lanc' };
    return { rot:'Aguardando a sessão', tag:'agu' };
  }
  function statusSessao(s){
    if (s.realizada) return { rot:'Realizada', tag:'real' };
    if (s.liberada) return { rot:'Liberada ao conselho', tag:'lib' };
    return { rot:'Rascunho (só o escritório vê)', tag:'rasc' };
  }
  function avisoErro(msg){ alert(msg); }

  // ---------------------------------------------------------------- carregamento
  auth.onAuthStateChanged(function(user){
    if (!user) { document.getElementById('gate').textContent = 'Faça login no Portal Fonseca e Braga para ver as sessões de julgamento.'; return; }
    db.collection('users').doc(user.uid).get().then(function(doc){
      var u = doc.exists ? doc.data() : {};
      me = { uid:user.uid, nome:u.displayName || user.email, email:user.email, role:u.role || '' };
      equipe = ['admin', 'gestor', 'membro'].indexOf(me.role) >= 0;
      admin = me.role === 'admin';
      document.getElementById('quem').textContent = me.nome + (equipe ? ' · escritório' : '');
      return equipe ? carregarEquipe() : carregarConselho();
    }).catch(function(e){
      document.getElementById('gate').textContent = 'Não foi possível carregar: ' + e.message;
    });
  });

  function carregarEquipe(){
    return db.collection('dadosPrivados').doc('condominios').get().then(function(snap){
      var lista = [];
      if (snap.exists) { try { lista = (JSON.parse(snap.data().json).condominios || []); } catch (e) {} }
      condos = lista.map(function(c){ return { slug:slugify(c.nome), nome:c.nome }; });
    }).catch(function(){ condos = []; }).then(function(){
      db.collection('sessoesJulgamento').onSnapshot(function(snap){
        sessoes = {}; snap.forEach(function(d){ sessoes[d.id] = Object.assign({ id:d.id }, d.data()); });
        juntarCondosDosDados(); mostrar();
      }, function(e){ falhou(e); });
      db.collection('recursosJulgamento').onSnapshot(function(snap){
        recursos = {}; snap.forEach(function(d){ recursos[d.id] = Object.assign({ id:d.id }, d.data()); });
        juntarCondosDosDados(); limparProvasVencidas(); mostrar();
      }, function(e){ falhou(e); });
      db.collection('leiturasJulgamento').onSnapshot(function(snap){
        leituras = {}; snap.forEach(function(d){ leituras[d.id] = d.data(); }); if (state.view === 'sessao') mostrar();
      }, function(){});
    });
  }
  // condomínio que já tem sessão aparece mesmo que não esteja na lista de clientes
  function juntarCondosDosDados(){
    Object.values(sessoes).forEach(function(s){
      if (!condos.some(function(c){ return c.slug === s.condominioSlug; })) condos.push({ slug:s.condominioSlug, nome:s.condominioNome || s.condominioSlug });
    });
    condos.sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
    if (!state.condo) {
      var comSessao = condos.find(function(c){ return Object.values(sessoes).some(function(s){ return s.condominioSlug === c.slug; }); });
      state.condo = (comSessao || condos[0] || {}).slug || null;
    }
  }

  function carregarConselho(){
    return db.collection('conselhoMembros').doc(me.uid).get().then(function(doc){
      var vinc = doc.exists ? (doc.data().condominios || {}) : {};
      var nomes = doc.exists ? (doc.data().nomesCondominios || {}) : {};
      condos = Object.keys(vinc).filter(function(k){ return vinc[k] === 'sindico' || vinc[k] === 'conselheiro'; })
        .map(function(k){ return { slug:k, nome:nomes[k] || k, papel:vinc[k] }; });
      if (!condos.length) {
        document.getElementById('gate').innerHTML = 'Seu acesso ainda não foi vinculado a um condomínio.<br>Peça ao escritório Fonseca e Braga para liberar o seu conselho.';
        return;
      }
      state.condo = condos[0].slug;
      condos.forEach(function(c){
        db.collection('sessoesJulgamento').where('condominioSlug', '==', c.slug).where('liberada', '==', true).onSnapshot(function(snap){
          Object.keys(sessoes).forEach(function(id){ if (sessoes[id].condominioSlug === c.slug) delete sessoes[id]; });
          snap.forEach(function(d){ sessoes[d.id] = Object.assign({ id:d.id }, d.data()); });
          mostrar();
        }, function(e){ falhou(e); });
        db.collection('recursosJulgamento').where('condominioSlug', '==', c.slug).where('liberado', '==', true).onSnapshot(function(snap){
          Object.keys(recursos).forEach(function(id){ if (recursos[id].condominioSlug === c.slug) delete recursos[id]; });
          snap.forEach(function(d){ recursos[d.id] = Object.assign({ id:d.id }, d.data()); });
          mostrar();

    if (!forcar) {
      var foco = document.activeElement && document.activeElement.id;
      if (foco && /^(ed-|dec-|nota-)/.test(foco)) return;   // não redesenha enquanto alguém digita
      if (state.view === 'editar' && state.editarPasso !== 2) return;
    }
    // sessão/recurso recém-criado (ou ainda chegando do servidor): espera em vez de voltar para a lista
    if ((state.view === 'sessao' && !sessoes[state.sessaoId]) || (state.view === 'recurso' && !recursos[state.recursoId]))
      app.innerHTML = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button><div class="vazio">Carregando…</div>';
    else if (state.view === 'sessao') app.innerHTML = telaSessao();

    else if (state.view === 'ementario') app.innerHTML = telaEmentario();
    else { state.view = 'lista'; app.innerHTML = telaLista(); }

        + '<div class="campo"><label>Abstenções</label><input type="number" min="0" id="dec-abst" value="' + esc(d.abstencoes == null ? '' : d.abstencoes) + '"></div></div>'

  var CAMPOS_TEXTO = ['ocorrencia', 'unidade', 'morador', 'titulo', 'classificacao', 'penalidade', 'dataFato', 'horaFato', 'dataNotificacao', 'dataRecurso', 'quemAbriu',

    rascunho = JSON.parse(JSON.stringify(base, function(k, v){ return v && v.toDate ? undefined : v; }));

  function salvarRecurso(){
    lerFormulario();

    var dados = {};
    CAMPOS_TEXTO.forEach(function(k){ dados[k] = rascunho[k] || ''; });

    Object.assign(dados, { sessaoId:rascunho.sessaoId, condominioSlug:s.condominioSlug, condominioNome:s.condominioNome || nomeCondo(s.condominioSlug),
      liberado:!!s.liberada, atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid });

    if (!rascunho.id) { dados.provas = []; dados.criadoEm = FV.serverTimestamp(); dados.criadoPor = me.uid; }

  // envio dos arquivos para o Storage, um por vez, com barra de progresso
  function enviarArquivos(files, categoria, recursoId, statusEl){
    var r = recursos[recursoId];
    var fila = Array.prototype.slice.call(files);
    var enviados = 0;
    function proximo(){
      if (!fila.length) { statusEl.innerHTML = '<span class="ok">' + enviados + ' arquivo(s) enviado(s).</span>'; return Promise.resolve(enviados); }
      var f = fila.shift();
      var tipo = tipoDoArquivo(f);
      if (!tipo) { statusEl.innerHTML += '<div class="err">' + esc(f.name) + ': tipo de arquivo não aceito (só vídeo, áudio, imagem e PDF).</div>'; return proximo(); }
      var caminho = 'julgamentos/' + r.condominioSlug + '/' + recursoId + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
      statusEl.innerHTML = 'Enviando ' + esc(f.name) + '… <div class="barra-up"><div id="barra-up"></div></div>';
      return new Promise(function(ok, falha){
        var task = storage.ref(caminho).put(f, { contentType:tipo });
        task.on('state_changed', function(sn){
          var b = document.getElementById('barra-up'); if (b) b.style.width = Math.round(100 * sn.bytesTransferred / sn.totalBytes) + '%';
        }, falha, ok);
      }).then(function(){
        enviados++;
        return db.collection('recursosJulgamento').doc(recursoId).update({
          provas:FV.arrayUnion({ nome:f.name, caminho:caminho, tipo:tipo, tamanho:f.size, categoria:categoria, enviadoEm:Date.now() }),
          atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid
        });
      }).then(proximo, function(e){ statusEl.innerHTML = '<span class="err">Falhou em ' + esc(f.name) + ': ' + esc(e.code || e.message) + '</span>'; });
    }
    return proximo();
  }
  function tipoDoArquivo(f){
    var t = f.type || '';
    if (/^(video|audio)\//.test(t) || /^image\/(jpeg|png|gif|webp|heic|heif)$/.test(t) || t === 'application/pdf') return t;
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    return { mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm', m4v:'video/mp4', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
             webp:'image/webp', heic:'image/heic', pdf:'application/pdf', mp3:'audio/mpeg', m4a:'audio/mp4', ogg:'audio/ogg', opus:'audio/ogg' }[ext] || '';
  }
  function removerProva(recursoId, i){
    var r = recursos[recursoId], pv = (r.provas || [])[i];
    if (!pv || !confirm('Remover "' + pv.nome + '" do portal?\n(O original continua no Google Drive.)')) return;
    storage.ref(pv.caminho).delete().catch(function(e){ if (e.code !== 'storage/object-not-found') throw e; }).then(function(){
      return db.collection('recursosJulgamento').doc(recursoId).update({ provas:FV.arrayRemove(pv), atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid });
    }).catch(function(e){ avisoErro('Não foi possível remover: ' + e.message); });
  }

  function salvarDecisao(){
    var r = recursos[rascunho.id];
    var res = (document.querySelector('input[name="dec-res"]:checked') || {}).value;
    if (!res) { alert('Escolha o resultado: mantida, cancelada ou modulada.'); return; }
    var mod = (document.querySelector('input[name="dec-mod"]:checked') || {}).value || '';
    if (res === 'modulada' && !mod) { alert('Escolha como a penalidade foi modulada.'); return; }
    var num = function(id){ var v = document.getElementById(id).value; return v === '' ? null : parseInt(v, 10); };
    var dec = { resultado:res, modulacao:res === 'modulada' ? mod : '', detalhe:document.getElementById('dec-detalhe').value.trim(),
      dataSessao:document.getElementById('dec-data').value, votosFavor:num('dec-favor'), votosContra:num('dec-contra'), abstencoes:num('dec-abst'),
      unanime:document.getElementById('dec-unanime').checked, ementa:document.getElementById('dec-ementa').value.trim(),
      registradoPor:me.uid, registradoPorNome:me.nome, registradoEm:FV.serverTimestamp() };
    if (!dec.ementa && !confirm('Salvar sem ementa? Você pode escrever depois.')) return;
    var expira = (r.decisao && r.provasExpiramEm) ? r.provasExpiramEm : TS.fromMillis(Date.now() + DIAS_PROVAS * 86400000);
    db.collection('recursosJulgamento').doc(r.id).update({ decisao:dec, provasExpiramEm:expira, atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid })
      .then(function(){ rascunho.decisao = dec; alert('Decisão salva. O conselho já vê o resultado e a ementa.'); ir('sessao', { sessaoId:r.sessaoId }); })
      .catch(function(e){ avisoErro('Não foi possível salvar: ' + e.message); });
  }
  function sugerirEmenta(){
    var r = recursos[rascunho.id];
    var res = (document.querySelector('input[name="dec-res"]:checked') || {}).value;
    var mod = (document.querySelector('input[name="dec-mod"]:checked') || {}).value;
    var det = document.getElementById('dec-detalhe').value.trim();

                  modulada:'RECURSO PARCIALMENTE PROVIDO. ' + String(MODULACOES[mod] || 'PENALIDADE MODULADA').toUpperCase() }[res] || 'RESULTADO A DEFINIR';
    var votos = un ? 'Decisão unânime' + (fav ? ' (' + fav + ' votos)' : '') : (fav || con ? 'Decisão por maioria (' + (fav || 0) + ' a ' + (con || 0) + ')' : 'Decisão do Conselho');
    var condoTxt = String(r.condominioNome || nomeCondo(r.condominioSlug)).toUpperCase().replace(/^COND(OMÍNIO|\.)\s*/, '');
    det = det.replace(/[.\s]+$/, '');
    var txt = 'RECURSO ADMINISTRATIVO. CONDOMÍNIO ' + condoTxt + '. OCORRÊNCIA Nº ' + r.ocorrencia + '. '
      + String(r.titulo || r.classificacao || '').toUpperCase() + '. ' + frase + '.\n\n'
      + '1. ' + (r.fatos ? r.fatos.split('\n')[0] : 'Descrever o fato apurado.') + '\n\n'
      + '2. ' + (r.alegacoes ? 'Em recurso, o(a) condômino(a) alegou: ' + r.alegacoes.split('\n')[0] : 'Resumir as alegações do recurso.') + '\n\n'
      + '3. ' + (res === 'mantida' ? 'As provas confirmam a infração e a penalidade observou o Regimento Interno; mantém-se a sanção aplicada.'
               : res === 'cancelada' ? 'As razões do recurso foram acolhidas pelo Conselho; cancela-se a penalidade aplicada.'
               : 'Reconhecida a infração, o Conselho entendeu adequada a modulação da penalidade' + (det ? ': ' + det : '') + '.') + '\n\n'
      + votos + '.';
    var el = document.getElementById('dec-ementa');
    if (el.value.trim() && !confirm('Substituir o texto atual da ementa pela sugestão?')) return;
    el.value = txt;

  // ---------------------------------------------------------------- provas: leitura autenticada + trilha de auditoria
  function abrirProva(caminho){
    var r = recursos[state.recursoId];
    var pv = (r.provas || []).find(function(p){ return p.caminho === caminho; });
    var bucket = firebase.app().options.storageBucket;
    var botao = document.querySelector('[data-abrir="' + CSS.escape(caminho) + '"]');
    if (botao) { botao.disabled = true; botao.textContent = 'Carregando…'; }
    auth.currentUser.getIdToken().then(function(tok){
      return fetch(STORAGE_HOST + '/v0/b/' + bucket + '/o/' + encodeURIComponent(caminho) + '?alt=media', { headers:{ Authorization:'Firebase ' + tok } });
    }).then(function(resp){
      if (!resp.ok) throw new Error(resp.status === 403 ? 'sem permissão (o prazo das provas pode ter vencido)' : 'erro ' + resp.status);
      return resp.blob();
    }).then(function(blob){
      urlsProvas[caminho] = URL.createObjectURL(pv && pv.tipo ? new Blob([blob], { type:pv.tipo }) : blob);
      setTimeout(function(){ mostrar(true); }, 0);
      db.collection('acessosProvasJulgamento').add({ uid:me.uid, nome:me.nome, recursoId:r.id, condominioSlug:r.condominioSlug, arquivo:caminho, em:FV.serverTimestamp() }).catch(function(){});
    }).catch(function(e){
      if (botao) { botao.disabled = false; botao.textContent = 'Não foi possível abrir: ' + e.message; }
    });
  }

  // provas com o prazo vencido saem do Storage (o original fica no Drive); roda quando alguém da equipe abre a tela
  var limpando = false;
  function limparProvasVencidas(){
    if (!equipe || limpando) return;
    var agora = Date.now();
    var vencidos = Object.values(recursos).filter(function(r){
      return r.provasExpiramEm && r.provasExpiramEm.toMillis() < agora && !r.provasRemovidas && (r.provas || []).length;
    });
    if (!vencidos.length) return;
    limpando = true;
    vencidos.reduce(function(p, r){
      return p.then(function(){
        return Promise.all((r.provas || []).map(function(pv){
          return storage.ref(pv.caminho).delete().catch(function(e){ if (e.code !== 'storage/object-not-found') throw e; });
        })).then(function(){
          return db.collection('recursosJulgamento').doc(r.id).update({ provasRemovidas:true, provasRemovidasEm:FV.serverTimestamp() });
        });
      });
    }, Promise.resolve()).catch(function(e){ console.warn('limpeza das provas vencidas:', e.message); }).then(function(){ limpando = false; });
  }

  // ---------------------------------------------------------------- sessões (escritório)
  function novaSessao(){
    var data = prompt('Data e hora da sessão (dd/mm/aaaa hh:mm). Deixe em branco se ainda não foi marcada:', '');
    if (data === null) return;
    var iso = '';
    var m = data.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[:h](\d{2}))?$/);
    if (data.trim() && !m) { alert('Use o formato dd/mm/aaaa hh:mm (ex.: 15/11/2026 19:30).'); return; }
    if (m) iso = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + (m[4] ? 'T' + m[4].padStart(2, '0') + ':' + m[5] : '');
    var titulo = prompt('Título da sessão:', 'Sessão de julgamento' + (m ? ' — ' + ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][parseInt(m[2], 10) - 1] + ' de ' + m[3] : ''));
    if (titulo === null) return;
    db.collection('sessoesJulgamento').add({ condominioSlug:state.condo, condominioNome:nomeCondo(state.condo), data:iso, titulo:titulo.trim() || 'Sessão de julgamento',
      local:'', liberada:false, realizada:false, criadoEm:FV.serverTimestamp(), criadoPor:me.uid })
      .then(function(ref){ ir('sessao', { sessaoId:ref.id }); }).catch(function(e){ avisoErro('Não foi possível criar: ' + e.message); });
  }
  function editarSessao(){
    var s = sessoes[state.sessaoId];
    var atual = s.data ? dataBR(s.data) + (s.data.length > 10 ? ' ' + s.data.slice(11, 16) : '') : '';
    var data = prompt('Data e hora da sessão (dd/mm/aaaa hh:mm):', atual); if (data === null) return;
    var m = data.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[:h](\d{2}))?$/);
    if (data.trim() && !m) { alert('Use o formato dd/mm/aaaa hh:mm.'); return; }
    var titulo = prompt('Título:', s.titulo || ''); if (titulo === null) return;
    var local = prompt('Local (opcional):', s.local || ''); if (local === null) return;
    db.collection('sessoesJulgamento').doc(s.id).update({ data:m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + (m[4] ? 'T' + m[4].padStart(2, '0') + ':' + m[5] : '') : '',
      titulo:titulo.trim(), local:local.trim() }).catch(function(e){ avisoErro(e.message); });
  }
  // liberar/recolher marca a sessão e todos os recursos dela (as regras checam o campo em cada recurso)
  function liberarSessao(liberar){
    var s = sessoes[state.sessaoId], rs = recursosDaSessao(s.id);
    if (liberar && !confirm('Liberar esta sessão ao conselho do ' + nomeCondo(s.condominioSlug) + '?\nSíndico e conselheiros passam a ver os ' + rs.length + ' recurso(s) e as provas.')) return;
    var b = db.batch();
    b.update(db.collection('sessoesJulgamento').doc(s.id), { liberada:liberar, liberadaEm:liberar ? FV.serverTimestamp() : null });
    rs.forEach(function(r){ b.update(db.collection('recursosJulgamento').doc(r.id), { liberado:liberar }); });
    b.commit().catch(function(e){ avisoErro('Não foi possível: ' + e.message); });
  }

  // ---------------------------------------------------------------- ementário
  function telaEmentario(){
    var julgados = Object.values(recursos).filter(function(r){ return r.condominioSlug === state.condo && r.decisao && r.decisao.resultado; })
      .sort(function(a, b){ return String(b.decisao.dataSessao || '').localeCompare(String(a.decisao.dataSessao || '')); });
    var filtro = (state.filtroEmentario || '').toLowerCase();
    var lista = julgados.filter(function(r){ return !filtro || (r.titulo + ' ' + r.classificacao + ' ' + (r.decisao.ementa || '')).toLowerCase().indexOf(filtro) >= 0; });
    var cont = { mantida:0, cancelada:0, modulada:0 };
    julgados.forEach(function(r){ cont[r.decisao.resultado]++; });
    var h = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button>' + chipsCondos()
      + '<div class="barra"><h2>📚 Ementário — ' + esc(nomeCondo(state.condo)) + '</h2></div>'
      + '<p class="muted small" style="margin-top:-8px;">Decisões já tomadas pelo conselho, para julgar casos parecidos do mesmo jeito.</p>'
      + '<div class="resumo-ementario"><div><b>' + julgados.length + '</b>julgados</div><div><b class="err">' + cont.mantida + '</b>mantidas</div>'
      + '<div><b class="ok">' + cont.cancelada + '</b>canceladas</div><div><b style="color:var(--blue)">' + cont.modulada + '</b>moduladas</div></div>'
      + '<div class="campo" style="max-width:420px;"><input id="ed-filtro-ementario" placeholder="Buscar: contramão, animal, estacionamento…" value="' + esc(state.filtroEmentario || '') + '"></div>';
    if (!lista.length) return h + '<div class="vazio">' + (julgados.length ? 'Nada encontrado com esse termo.' : 'Ainda não há decisões lançadas para este condomínio.') + '</div>';
    return h + lista.map(function(r){
      var d = r.decisao;
      return '<div class="card" style="margin-bottom:12px;"><div class="barra" style="margin:0 0 6px;"><b>#' + esc(r.ocorrencia) + ' — ' + esc(r.titulo || r.classificacao || '') + '</b><span class="espaco"></span>'
        + '<span class="tag ' + RESULTADOS[d.resultado].tag + '">' + esc(RESULTADOS[d.resultado].rot) + '</span></div>'
        + '<div class="muted small" style="margin-bottom:8px;">' + esc(r.unidade || '') + ' · sessão de ' + esc(dataBR(d.dataSessao)) + (votacaoTexto(d) ? ' · ' + esc(votacaoTexto(d)) : '') + '</div>'
        + (d.ementa ? '<div class="texto" style="margin:0;">' + esc(d.ementa) + '</div>' : '<div class="muted small">Ementa ainda não escrita.</div>')
        + '<div style="margin-top:8px;"><button type="button" class="btn sec peq" data-recurso="' + esc(r.id) + '">Abrir recurso</button></div></div>';
    }).join('');
  }

  // ---------------------------------------------------------------- conselheiros (admin)
  var pessoas = null, membros = {}, tabCondo = null;   // síndico e conselheiros entram pela aba Condomínios
  function telaConselheiros(){
    var h = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button>'
      + '<h2>👥 Síndicos e conselheiros</h2>'
      + '<div class="aviso">Passo a passo: 1) o síndico ou conselheiro faz o <b>cadastro</b> na tela de login do portal; '
      + '2) aqui, escolha o <b>condomínio</b> e o <b>papel</b> dele e clique em <b>Aprovar</b>. '
      + 'Ele recebe a aba <b>Condomínios</b>, onde vê só o cartão das Sessões de Julgamento (e só as sessões liberadas do condomínio dele).</div>';
    if (!pessoas) return h + '<div class="muted">Carregando cadastros…</div>';
    var opcoesCondo = condos.map(function(c){ return '<option value="' + esc(c.slug) + '">' + esc(c.nome) + '</option>'; }).join('');
    var lista = pessoas.filter(function(u){ return contaCliente(u.role) || u.acesso !== 'ativo'; })
      .sort(function(a, b){ return (a.acesso === 'ativo') - (b.acesso === 'ativo') || String(a.displayName || '').localeCompare(String(b.displayName || ''), 'pt-BR'); });
    if (!tabCondo) h += '<div class="aviso">⚠ Não encontrei a aba "Condomínios" em Administração › Abas (endereço <b>tools/condominios/</b>). Ela é a porta de entrada do síndico e dos conselheiros.</div>';
    h += '<table class="t"><tr><th>Pessoa</th><th>Situação</th><th>Vínculo</th><th>Condomínio</th><th>Papel</th><th></th></tr>' + lista.map(function(u){
      var v = (membros[u.uid] || {}).condominios || {};
      var vinc = Object.keys(v).map(function(k){ return esc(nomeCondo(k)) + ' (' + (v[k] === 'sindico' ? 'síndico' : 'conselheiro') + ')'; }).join('<br>') || '<span class="muted">—</span>';
      return '<tr><td><b>' + esc(u.displayName || '') + '</b><br><span class="muted small">' + esc(u.email || '') + '</span></td>'
        + '<td class="small">' + (u.acesso === 'ativo' ? '<span class="ok">ativo</span>' : '<span class="err">' + esc(u.acesso || 'pendente') + '</span>') + (u.role ? '<br><span class="muted">' + esc(TIPOS[u.role] || u.role) + '</span>' : '') + '</td>'
        + '<td class="small">' + vinc + '</td>'
        + '<td><select class="cs-condo" data-uid="' + esc(u.uid) + '">' + opcoesCondo + '</select></td>'
        + '<td><select class="cs-papel" data-uid="' + esc(u.uid) + '"><option value="conselheiro">Conselheiro</option><option value="sindico">Síndico</option></select></td>'
        + '<td style="white-space:nowrap;"><button type="button" class="btn verde peq" data-aprovar-conselho="' + esc(u.uid) + '">' + (u.acesso === 'ativo' ? 'Vincular' : 'Aprovar') + '</button>'
        + (Object.keys(v).length ? ' <button type="button" class="btn ghost peq" data-desvincular="' + esc(u.uid) + '">Tirar vínculos</button>' : '') + '</td></tr>';
    }).join('') + '</table>';
    if (!lista.length) h += '<div class="vazio" style="margin-top:12px;">Nenhum cadastro aguardando nem conta de cliente.</div>';
    return h;
  }
  function carregarPessoasConselho(){
    if (pessoas) return;
    Promise.all([db.collection('users').get(), db.collection('conselhoMembros').get(), db.collection('tabs').get()]).then(function(r){
      pessoas = r[0].docs.map(function(d){ return Object.assign({ uid:d.id }, d.data()); });
      membros = {}; r[1].forEach(function(d){ membros[d.id] = d.data(); });
      var t = r[2].docs.find(function(d){ return /(^|\/)tools\/condominios(\/|$)/.test(String(d.data().url || '')); });
      tabCondo = t ? t.id : null;
      mostrar(true);
    }).catch(function(e){ avisoErro('Não foi possível carregar os cadastros: ' + e.message); });
  }
  // aprova a conta como cliente (só com a aba das sessões) e grava o vínculo com o condomínio
  function aprovarConselho(uid){
    var u = pessoas.find(function(x){ return x.uid === uid; });
    var slug = document.querySelector('.cs-condo[data-uid="' + CSS.escape(uid) + '"]').value;
    var papel = document.querySelector('.cs-papel[data-uid="' + CSS.escape(uid) + '"]').value;
    if (!tabCondo) { alert('Não encontrei a aba "Condomínios" em Administração › Abas (endereço tools/condominios/).'); return; }
    if (u.role && !contaCliente(u.role) && u.acesso === 'ativo') { alert(u.displayName + ' é da equipe (' + (TIPOS[u.role] || u.role) + '). Conselheiros e síndicos precisam ser contas de fora do escritório (tipo Conselheiro, Síndico ou Cliente).'); return; }
    if (!confirm((u.acesso === 'ativo' ? 'Vincular ' : 'Aprovar ') + (u.displayName || u.email) + ' como ' + (papel === 'sindico' ? 'SÍNDICO' : 'CONSELHEIRO') + ' do ' + nomeCondo(slug) + '?\n\nEla(e) recebe a aba Condomínios, com acesso só às Sessões de Julgamento liberadas desse condomínio.')) return;
    var atual = membros[uid] || {};
    var vinc = Object.assign({}, atual.condominios || {}); vinc[slug] = papel;
    var nomes = Object.assign({}, atual.nomesCondominios || {}); nomes[slug] = nomeCondo(slug);
    var b = db.batch();
    b.set(db.collection('conselhoMembros').doc(uid), { nome:u.displayName || '', email:u.email || '', condominios:vinc, nomesCondominios:nomes, atualizadoPor:me.uid, atualizadoEm:FV.serverTimestamp() });
    var upd = { role:papel === 'sindico' ? 'sindico' : 'conselheiro', tabs:FV.arrayUnion(tabCondo) };   // tipo de usuário = papel no conselho
    if (u.acesso !== 'ativo') Object.assign(upd, { acesso:'ativo', acessoAprovadoPor:me.uid, acessoAprovadoEm:FV.serverTimestamp() });
    b.update(db.collection('users').doc(uid), upd);
    b.delete(db.collection('organograma').doc(uid));   // o autocadastro cria o bloco no organograma; conselheiro não é da equipe
    b.commit().then(function(){ pessoas = null; mostrar(true); }).catch(function(e){ avisoErro('Não foi possível aprovar: ' + e.message); });
  }
  function desvincular(uid){
    var u = pessoas.find(function(x){ return x.uid === uid; });
    if (!confirm('Tirar todos os vínculos de ' + (u.displayName || u.email) + ' com condomínios? Ela(e) deixa de ver as sessões na hora.')) return;
    db.collection('conselhoMembros').doc(uid).delete().then(function(){ pessoas = null; mostrar(true); }).catch(function(e){ avisoErro(e.message); });
  }

  // ---------------------------------------------------------------- importar pacote (pasta com pacote.json + arquivos)
  function importarPacote(files){
    var lista = Array.prototype.slice.call(files);
    var json = lista.find(function(f){ return /(^|\/)pacote\.json$/.test(f.webkitRelativePath || f.name); });
    if (!json) { alert('A pasta escolhida não tem o arquivo pacote.json.'); return; }
    var raiz = (json.webkitRelativePath || '').replace(/pacote\.json$/, '');
    json.text().then(function(txt){
      var p = JSON.parse(txt);
      var slug = slugify(p.condominio);
      if (!confirm('Importar ' + (p.sessoes || []).length + ' sessão(ões) e ' + (p.recursos || []).length + ' recurso(s) do ' + p.condominio + '?\n\nAs sessões entram como RASCUNHO (o conselho não vê até você liberar). Recursos que já existem são atualizados, e arquivos já enviados não são enviados de novo.')) return;
      var porArquivo = {}; lista.forEach(function(f){ porArquivo[(f.webkitRelativePath || f.name).slice(raiz.length)] = f; });
      app.innerHTML = '<h2>Importando…</h2><div id="imp-log" class="small" style="white-space:pre-wrap;line-height:1.6;"></div><div class="barra-up" style="height:8px;"><div id="imp-barra"></div></div>';
      var log = function(t){ var el = document.getElementById('imp-log'); if (el) el.textContent += t + '\n'; };
      var idsSessao = {};
      var total = (p.recursos || []).reduce(function(n, r){ return n + (r.arquivos || []).length; }, 0), feitos = 0;
      return (p.sessoes || []).reduce(function(pr, s){
        return pr.then(function(){
          var id = slug + '-' + slugify(s.chave || s.titulo || s.data);
          idsSessao[s.chave] = id;
          var ref = db.collection('sessoesJulgamento').doc(id);
          log('… sessão: ' + (s.titulo || s.data));
          return ref.get().then(function(ex){
            var dados = { condominioSlug:slug, condominioNome:p.condominio, data:s.data || '', titulo:s.titulo || 'Sessão de julgamento', local:s.local || '', realizada:!!s.realizada };
            if (!ex.exists) Object.assign(dados, { liberada:false, criadoEm:FV.serverTimestamp(), criadoPor:me.uid });
            return ref.set(dados, { merge:true });
          }).then(function(){ log('✔ sessão: ' + (s.titulo || s.data)); });
        });
      }, Promise.resolve()).then(function(){
        return (p.recursos || []).reduce(function(pr, r){
          return pr.then(function(){
            var id = slug + '-' + slugify(r.ocorrencia);
            var ref = db.collection('recursosJulgamento').doc(id);
            log('… recurso #' + r.ocorrencia);
            return ref.get().then(function(ex){
              var atual = ex.exists ? ex.data() : null;
              var sess = sessoes[idsSessao[r.sessao]] || {};
              var dados = {};
              CAMPOS_TEXTO.forEach(function(k){ if (r[k] != null) dados[k] = String(r[k]); });
              Object.assign(dados, { sessaoId:idsSessao[r.sessao], condominioSlug:slug, condominioNome:p.condominio, liberado:!!(atual ? atual.liberado : sess.liberada),
                atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid });
              if (!atual) Object.assign(dados, { provas:[], criadoEm:FV.serverTimestamp(), criadoPor:me.uid });
              return ref.set(dados, { merge:true }).then(function(){
                var ja = (atual && atual.provas || []).map(function(x){ return x.nome + '|' + x.tamanho; });
                return (r.arquivos || []).reduce(function(pa, a){
                  return pa.then(function(){
                    var f = porArquivo[a.arquivo];
                    feitos++;
                    var barra = document.getElementById('imp-barra'); if (barra) barra.style.width = Math.round(100 * feitos / Math.max(total, 1)) + '%';
                    if (!f) { log('  ⚠ não encontrado na pasta: ' + a.arquivo); return; }
                    if (ja.indexOf(f.name + '|' + f.size) >= 0) return;
                    var tipo = tipoDoArquivo(f); if (!tipo) { log('  ⚠ tipo não aceito: ' + a.arquivo); return; }
                    var caminho = 'julgamentos/' + slug + '/' + id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
                    return new Promise(function(ok, falha){ storage.ref(caminho).put(f, { contentType:tipo }).on('state_changed', null, falha, ok); }).then(function(){
                      return ref.update({ provas:FV.arrayUnion({ nome:f.name, caminho:caminho, tipo:tipo, tamanho:f.size, categoria:a.categoria || 'prova', enviadoEm:Date.now() }) });
                    });
                  });
                }, Promise.resolve());
              });
            }).then(function(){ log('✔ recurso #' + r.ocorrencia + ' (' + (r.arquivos || []).length + ' arquivos)'); });
          });
        }, Promise.resolve());
      }).then(function(){ log('\nConcluído. As sessões estão como rascunho: confira e libere ao conselho.'); state.condo = slug;
        setTimeout(function(){ if (document.getElementById('imp-log')) { var b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Ver as sessões'; b.onclick = function(){ ir('lista'); }; app.appendChild(b); } }, 50); });
    }).catch(function(e){ alert('Não foi possível importar: ' + e.message); ir('lista'); });
  }

  // ---------------------------------------------------------------- eventos
  function depoisDeDesenhar(){
    if (state.view === 'recurso' && !equipe) carregarNota();
    var upl = document.getElementById('upl');
    if (upl) {
      ['dragenter', 'dragover'].forEach(function(ev){ upl.addEventListener(ev, function(e){ e.preventDefault(); upl.classList.add('drag'); }); });
      ['dragleave', 'drop'].forEach(function(ev){ upl.addEventListener(ev, function(e){ e.preventDefault(); upl.classList.remove('drag'); }); });
      upl.addEventListener('drop', function(e){ enviarArquivos(e.dataTransfer.files, document.getElementById('ed-categoria').value, rascunho.id, document.getElementById('upl-status')); });
    }
    var resBox = document.getElementById('dec-resultado');
    if (resBox) resBox.addEventListener('change', function(){
      var v = (document.querySelector('input[name="dec-res"]:checked') || {}).value;
      document.getElementById('dec-mod-box').style.display = v === 'modulada' ? '' : 'none';
      Array.prototype.forEach.call(document.querySelectorAll('.opcoes label'), function(l){ l.classList.toggle('on', !!l.querySelector('input:checked')); });
    });
    var modBox = document.getElementById('dec-mod-box');
    if (modBox) modBox.addEventListener('change', function(){ Array.prototype.forEach.call(modBox.querySelectorAll('label'), function(l){ l.classList.toggle('on', !!l.querySelector('input:checked')); }); });
    var filtro = document.getElementById('ed-filtro-ementario');
    if (filtro) filtro.addEventListener('input', function(){ state.filtroEmentario = filtro.value; var pos = filtro.selectionStart; filtro.blur(); mostrar(true); var f2 = document.getElementById('ed-filtro-ementario'); f2.focus(); f2.setSelectionRange(pos, pos); });
  }
  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'ed-arquivos') { enviarArquivos(t.files, document.getElementById('ed-categoria').value, rascunho.id, document.getElementById('upl-status')); t.value = ''; }
    if (t.id === 'ed-categoria') state.categoriaUp = t.value;
    if (t.id === 'importar') { importarPacote(t.files); t.value = ''; }
  });
  app.addEventListener('click', function(e){
    var el = e.target.closest('button, .card, .linha, [data-ir]');
    if (!el) return;
    var d = el.dataset;
    if (d.condo) { state.condo = d.condo; mostrar(true); return; }
    if (d.ir) { ir(d.ir); return; }
    if (d.editar) { e.stopPropagation(); abrirEdicao(d.editar); return; }
    if (d.recurso) { ir('recurso', { recursoId:d.recurso, passo:0 }); return; }
    if (d.sessao) { ir('sessao', { sessaoId:d.sessao }); return; }
    if (d.voltarSessao) { ir('sessao', { sessaoId:d.voltarSessao }); return; }
    if (d.passo != null) { state.passo = parseInt(d.passo, 10); mostrar(true); window.scrollTo(0, 0); return; }
    if (d.edpasso != null) { if (state.view === 'editar' && state.editarPasso < 2) lerFormulario(); state.editarPasso = parseInt(d.edpasso, 10); mostrar(true); return; }
    if (d.abrir) { abrirProva(d.abrir); return; }
    if (d.removerProva != null) { removerProva(rascunho.id, parseInt(d.removerProva, 10)); return; }
    if (d.ementaPdf) { ementaPdf(d.ementaPdf); return; }
    if (d.aprovarConselho) { aprovarConselho(d.aprovarConselho); return; }
    if (d.desvincular) { desvincular(d.desvincular); return; }
    switch (el.id) {
      case 'nova-sessao': novaSessao(); break;
      case 'novo-recurso': abrirEdicao(null, state.sessaoId); break;
      case 'editar-sessao': editarSessao(); break;
      case 'liberar': liberarSessao(true); break;
      case 'recolher': if (confirm('Recolher esta sessão? O conselho deixa de ver os recursos.')) liberarSessao(false); break;
      case 'marcar-realizada': db.collection('sessoesJulgamento').doc(state.sessaoId).update({ realizada:true }).catch(function(e){ avisoErro(e.message); }); break;
      case 'desfazer-realizada': db.collection('sessoesJulgamento').doc(state.sessaoId).update({ realizada:false }).catch(function(e){ avisoErro(e.message); }); break;
      case 'excluir-sessao': if (confirm('Excluir esta sessão vazia?')) db.collection('sessoesJulgamento').doc(state.sessaoId).delete().then(function(){ ir('lista'); }); break;
      case 'ed-salvar': salvarRecurso(); break;
      case 'dec-salvar': salvarDecisao(); break;
      case 'dec-sugerir': sugerirEmenta(); break;
      case 'dec-apagar':
        if (confirm('Apagar a decisão lançada? O recurso volta a "decisão a lançar".'))
          db.collection('recursosJulgamento').doc(rascunho.id).update({ decisao:FV.delete(), provasExpiramEm:FV.delete() }).then(function(){ delete rascunho.decisao; mostrar(true); });
        break;
      case 'excluir-recurso':
        var r = recursos[rascunho.id];
        if (!confirm('Excluir o recurso #' + r.ocorrencia + ' e os arquivos dele do portal?\n(Os originais continuam no Google Drive.)')) return;
        Promise.all((r.provas || []).map(function(pv){ return storage.ref(pv.caminho).delete().catch(function(){}); }))
          .then(function(){ return db.collection('recursosJulgamento').doc(r.id).delete(); })
          .then(function(){ ir('sessao', { sessaoId:r.sessaoId }); }).catch(function(e){ avisoErro(e.message); });
        break;
      case 'marcar-lido': marcarLido(); break;
    }
  });

  // atalhos para o teste automatizado (não mudam nada na tela)
  window.__julgamentos = { estado:function(){ return { equipe:equipe, admin:admin, condos:condos, sessoes:Object.keys(sessoes).length, recursos:Object.keys(recursos).length, view:state.view }; } };
})();
</script>
