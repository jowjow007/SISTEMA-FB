<style>

  @media (max-width:640px){ main{padding:16px 14px 60px;} .linha{flex-wrap:wrap;} }

  var urlsProvas = {};           // caminho -> object URL (só nesta aba)
  var app = document.getElementById('app');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function slugify(s){
    var acentos = new RegExp('[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g');
    return (s || '').toString().toLowerCase().normalize('NFD').replace(acentos, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  }
  function dataBR(iso){ if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function dataHoraBR(iso){ if (!iso) return 'data a definir'; var h = String(iso).slice(11, 16); return dataBR(iso) + (h ? ' às ' + h.replace(':', 'h') : ''); }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function tsData(t){ return t && t.toDate ? t.toDate() : null; }
  function tamanho(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function nomeCondo(slug){ var c = condos.find(function(x){ return x.slug === slug; }); return c ? c.nome : slug; }
  function recursosDaSessao(id){
    return Object.values(recursos).filter(function(r){ return r.sessaoId === id; })
      .sort(function(a, b){ return String(a.ocorrencia).localeCompare(String(b.ocorrencia), 'pt-BR', { numeric:true }); });
  }
  function sessoesDoCondo(slug){
    return Object.values(sessoes).filter(function(s){ return s.condominioSlug === slug; })
      .sort(function(a, b){ return String(b.data || '9999').localeCompare(String(a.data || '9999')); });
  }
  // cada ocorrência tem a própria data de julgamento e o próprio "realizada" (16/11/2026); sem esses campos, vale o da
  // sessão em que ela foi importada
  function dataDaOcorrencia(r){ return ('dataJulgamento' in r) ? (r.dataJulgamento || '') : ((sessoes[r.sessaoId] || {}).data || ''); }
  function realizadaOc(r){
    if (r.decisao && r.decisao.resultado) return true;
    if (r.realizada === true || r.realizada === false) return r.realizada;
    return !!(sessoes[r.sessaoId] || {}).realizada;
  }
  function statusRecurso(r){
    if (r.decisao && r.decisao.resultado) return { rot: RESULTADOS[r.decisao.resultado].rot, tag: RESULTADOS[r.decisao.resultado].tag };
    if (realizadaOc(r)) return { rot:'Julgado — decisão a lançar', tag:'lanc' };
    return { rot:'Aguardando o julgamento', tag:'agu' };
  }
  function statusSessao(s){
    if (s.realizada) return { rot:'Realizada', tag:'real' };
    if (s.liberada) return { rot:'Liberada ao conselho', tag:'lib' };
    return { rot:'Rascunho (só o escritório vê)', tag:'rasc' };
  }
  function avisoErro(msg){ alert(msg); }

  // ---------------------------------------------------------------- carregamento
  auth.onAuthStateChanged(function(user){
    if (!user) { document.getElementById('gate').textContent = 'Faça login no Portal Fonseca e Braga para ver as sessões de julgamento.'; return; }
    db.collection('users').doc(user.uid).get().then(function(doc){
      var u = doc.exists ? doc.data() : {};
      me = { uid:user.uid, nome:u.displayName || user.email, email:user.email, role:u.role || '' };
      equipe = ['admin', 'gestor', 'membro'].indexOf(me.role) >= 0;
      admin = me.role === 'admin';
      document.getElementById('quem').textContent = me.nome + (equipe ? ' · escritório' : '');
      if (!equipe) return carregarConselho();
      if (admin) return carregarEquipe();
      // na equipe, as Sessões são área restrita: sub-aba "sessoes-julgamento" da aba Condomínios (Editar abas)
      return db.collection('configPortal').doc('abas').get().then(function(c){
        var tid = c.exists ? c.data().condominios : '';
        var ok = !!tid && (u.tabs || []).indexOf(tid) >= 0 && ((u.subtabs || {})[tid] || []).indexOf('sessoes-julgamento') >= 0;
        if (ok) return carregarEquipe();
        document.getElementById('gate').innerHTML = 'O acesso às <b>Sessões de Julgamento</b> ainda não foi liberado para você.<br>'
          + '<span class="muted small">Peça ao administrador: Administração › Usuários › Editar abas › Condomínios › marcar "Sessões de Julgamento".</span>';
      });
    }).catch(function(e){
      document.getElementById('gate').textContent = 'Não foi possível carregar: ' + e.message;
    });
  });

  function carregarEquipe(){
    return db.collection('dadosPrivados').doc('condominios').get().then(function(snap){
      var lista = [];
      if (snap.exists) { try { lista = (JSON.parse(snap.data().json).condominios || []); } catch (e) {} }
      condos = lista.map(function(c){ return { slug:slugify(c.nome), nome:c.nome }; });
    }).catch(function(){ condos = []; }).then(function(){
      db.collection('sessoesJulgamento').onSnapshot(function(snap){
        sessoes = {}; snap.forEach(function(d){ sessoes[d.id] = Object.assign({ id:d.id }, d.data()); });
        juntarCondosDosDados(); mostrar();
      }, function(e){ falhou(e); });
      db.collection('recursosJulgamento').onSnapshot(function(snap){
        recursos = {}; snap.forEach(function(d){ recursos[d.id] = Object.assign({ id:d.id }, d.data()); });
        juntarCondosDosDados(); limparProvasVencidas(); mostrar();
      }, function(e){ falhou(e); });
      db.collection('leiturasJulgamento').onSnapshot(function(snap){
        leituras = {}; snap.forEach(function(d){ leituras[d.id] = d.data(); }); if (state.view === 'sessao' || state.view === 'recurso' || state.view === 'lista') mostrar();
      }, function(){});
    });
  }
  // condomínio que já tem sessão aparece mesmo que não esteja na lista de clientes
  function juntarCondosDosDados(){
    Object.values(sessoes).forEach(function(s){
      if (!condos.some(function(c){ return c.slug === s.condominioSlug; })) condos.push({ slug:s.condominioSlug, nome:s.condominioNome || s.condominioSlug });
    });
    condos.sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
    if (!state.condo) {
      var comSessao = condos.find(function(c){ return Object.values(sessoes).some(function(s){ return s.condominioSlug === c.slug; }); });
      state.condo = (comSessao || condos[0] || {}).slug || null;
    }
  }

  function carregarConselho(){
    return db.collection('conselhoMembros').doc(me.uid).get().then(function(doc){
      var vinc = doc.exists ? (doc.data().condominios || {}) : {};
      var nomes = doc.exists ? (doc.data().nomesCondominios || {}) : {};
      condos = Object.keys(vinc).filter(function(k){ return vinc[k] === 'sindico' || vinc[k] === 'conselheiro'; })
        .map(function(k){ return { slug:k, nome:nomes[k] || k, papel:vinc[k] }; });
      if (!condos.length) {
        document.getElementById('gate').innerHTML = 'Seu acesso ainda não foi vinculado a um condomínio.<br>Peça ao escritório Fonseca e Braga para liberar o seu conselho.';
        return;
      }
      state.condo = condos[0].slug;
      condos.forEach(function(c){
        db.collection('sessoesJulgamento').where('condominioSlug', '==', c.slug).where('liberada', '==', true).onSnapshot(function(snap){
          Object.keys(sessoes).forEach(function(id){ if (sessoes[id].condominioSlug === c.slug) delete sessoes[id]; });
          snap.forEach(function(d){ sessoes[d.id] = Object.assign({ id:d.id }, d.data()); });
          mostrar();
        }, function(e){ falhou(e); });
        db.collection('recursosJulgamento').where('condominioSlug', '==', c.slug).where('liberado', '==', true).onSnapshot(function(snap){
          Object.keys(recursos).forEach(function(id){ if (recursos[id].condominioSlug === c.slug) delete recursos[id]; });
          snap.forEach(function(d){ recursos[d.id] = Object.assign({ id:d.id }, d.data()); });
          mostrar();
        }, function(e){ falhou(e); });
      });
      db.collection('leiturasJulgamento').where('uid', '==', me.uid).onSnapshot(function(snap){
        leituras = {}; snap.forEach(function(d){ leituras[d.id] = d.data(); }); mostrar();
      }, function(){});
      mostrar();
    });
  }
  function falhou(e){
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Sem permissão para ler as sessões (' + (e.code || e.message) + '). Se você é do conselho, peça ao escritório para liberar o seu acesso.';
    app.style.display = 'none';
  }

  // ---------------------------------------------------------------- telas
  // forcar: navegação da própria pessoa. Sem ele (atualização vinda do servidor), o formulário em edição
  // não é redesenhado — só a lista de arquivos, que muda com o envio.
  function mostrar(forcar){
    if (!me) return;
    document.getElementById('gate').style.display = 'none';
    app.style.display = 'block';
    if (state.view === 'importando' && !forcar) return;   // não apaga o registro da importação enquanto os dados chegam
    if (!forcar) {
      var foco = document.activeElement && document.activeElement.id;
      if (foco && /^(ed-|dec-|nota-)/.test(foco)) return;   // não redesenha enquanto alguém digita
      if (state.view === 'editar' && state.editarPasso !== 2) return;
    }
    // sessão/recurso recém-criado (ou ainda chegando do servidor): espera em vez de voltar para a lista
    if ((state.view === 'sessao' && !sessoes[state.sessaoId]) || (state.view === 'recurso' && !recursos[state.recursoId]))
      app.innerHTML = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button><div class="vazio">Carregando…</div>';
    else if (state.view === 'sessao') app.innerHTML = telaSessao();
    else if (state.view === 'recurso') app.innerHTML = telaRecurso();
    else if (state.view === 'editar' && equipe) app.innerHTML = telaEditar();
    else if (state.view === 'conselheiros' && admin) { app.innerHTML = telaConselheiros(); carregarPessoasConselho(); }
    else if (state.view === 'ementario') app.innerHTML = telaEmentario();
    else { state.view = 'lista'; app.innerHTML = telaLista(); }
    depoisDeDesenhar();
  }
  function ir(view, extra){ Object.assign(state, { view:view }, extra || {}); mostrar(true); window.scrollTo(0, 0); }

  function chipsCondos(){
    if (condos.length <= 1 && !equipe) return '';
    // muitos condomínios: uma lista de escolha em vez de uma fileira de botões
    if (condos.length > 4) {
      return '<div class="seletor-condo"><label for="sel-condo">Condomínio</label><select id="sel-condo">' + condos.map(function(c){
        var porOc = (state.verPor || 'ocorrencias') === 'ocorrencias';
        var n = porOc ? Object.values(recursos).filter(function(r){ return r.condominioSlug === c.slug; }).length : sessoesDoCondo(c.slug).length;
        var rot = porOc ? (n === 1 ? ' ocorrência)' : ' ocorrências)') : (n === 1 ? ' sessão)' : ' sessões)');
        return '<option value="' + esc(c.slug) + '"' + (c.slug === state.condo ? ' selected' : '') + '>' + esc(c.nome) + (n ? ' (' + n + rot : '') + '</option>';
      }).join('') + '</select></div>';
    }
    return '<div class="chips">' + condos.map(function(c){
      return '<button type="button" class="chip' + (c.slug === state.condo ? ' on' : '') + '" data-condo="' + esc(c.slug) + '">' + esc(c.nome) + '</button>';
    }).join('') + '</div>';
  }

  function telaLista(){
    var h = '';
    if (!equipe) {
      var c = condos.find(function(x){ return x.slug === state.condo; }) || condos[0];
      h += '<div class="aviso">Olá, ' + esc(me.nome.split(' ')[0]) + '! Aqui estão os recursos que o conselho do <b>' + esc(c.nome) + '</b> vai julgar. '
        + 'Abra cada um e siga os passos: <b>resumo → provas → alegações do morador</b>. Ao terminar, marque "Analisei este recurso". '
        + 'O material é de uso restrito à sessão de julgamento.</div>';
    }
    h += chipsCondos();
    h += '<div class="barra"><h2>Ocorrências' + (state.condo ? ' — ' + esc(nomeCondo(state.condo)) : '') + '</h2><span class="espaco"></span>'
      + '<button type="button" class="btn sec peq" data-ir="ementario">📚 Ementário</button>'
      + (admin ? '<button type="button" class="btn sec peq" data-ir="conselheiros">👥 Conselheiros</button>' : '')
      + (equipe && state.condo ? '<button type="button" class="btn peq" id="nova-ocorrencia">+ Nova ocorrência</button>' : '')
      + (admin ? '<label class="btn sec peq" style="cursor:pointer;">⬆ Importar pacote<input type="file" id="importar" webkitdirectory multiple style="display:none;"></label>' : '')
      + '</div>';
    if (equipe && !condos.length) return h + '<div class="vazio">A lista de condomínios ainda não foi carregada (Administração › dados privados).</div>';
    if ((state.verPor || 'ocorrencias') === 'ocorrencias') return h + listaOcorrencias();
    var lista = state.condo ? sessoesDoCondo(state.condo) : [];
    if (!lista.length) return h + '<div class="vazio">' + (equipe ? 'Nenhuma sessão cadastrada para este condomínio. Clique em "+ Nova sessão".' : 'Nenhuma sessão de julgamento liberada para o conselho no momento.') + '</div>';
    var GRUPOS = [{ id:'agendadas', rot:'Agendadas' }, { id:'aguardando', rot:'Aguardando agendamento' }, { id:'realizadas', rot:'Realizadas' }];
    var porGrupo = { agendadas:[], aguardando:[], realizadas:[] };
    lista.forEach(function(s){ porGrupo[situacaoSessao(s)].push(s); });
    porGrupo.agendadas.sort(function(a, b){ return String(a.data).localeCompare(String(b.data)); });   // a mais próxima primeiro
    porGrupo.realizadas.sort(function(a, b){ return String(b.data || '').localeCompare(String(a.data || '')) || String(b.titulo || '').localeCompare(String(a.titulo || ''), 'pt-BR'); });
    var filtro = state.filtroSessao || 'todas';
    h += '<div class="filtros-sessao">' + [{ id:'todas', rot:'Todas', n:lista.length }].concat(GRUPOS.map(function(g){ return { id:g.id, rot:g.rot, n:porGrupo[g.id].length }; })).map(function(f){
      return '<button type="button" data-filtro-sessao="' + f.id + '" class="' + (filtro === f.id ? 'on' : '') + '">' + esc(f.rot) + ' <span class="n">' + f.n + '</span></button>';
    }).join('') + '</div>';
    var algum = false;
    GRUPOS.forEach(function(g){
      if (filtro !== 'todas' && filtro !== g.id) return;
      var gs = porGrupo[g.id];
      if (!gs.length) return;
      algum = true;
      if (filtro === 'todas') h += '<div class="grupo-sessao">' + esc(g.rot) + ' · ' + gs.length + '</div>';
      h += '<div class="grid-sessoes">' + gs.map(cardSessao).join('') + '</div>';
    });
    if (!algum) h += '<div class="vazio">' + ({ agendadas:'Nenhuma sessão agendada.', aguardando:'Nenhuma sessão aguardando agendamento.', realizadas:'Nenhuma sessão realizada ainda.' }[filtro] || 'Nenhuma sessão.') + '</div>';
    return h;
  }
  // um card por ocorrência (recurso), com o número dela; a situação vem da sessão em que ela está
  function situacaoRecurso(r){ return realizadaOc(r) ? 'realizadas' : (dataDaOcorrencia(r) ? 'agendadas' : 'aguardando'); }
  function listaOcorrencias(){
    var h = '';
    var todos = Object.values(recursos).filter(function(r){ return r.condominioSlug === state.condo; });
    if (!todos.length) return '<div class="vazio">' + (equipe ? 'Nenhuma ocorrência cadastrada para este condomínio. Use "+ Nova ocorrência" ou "⬆ Importar pacote".' : 'Nenhuma sessão de julgamento liberada para o conselho no momento.') + '</div>';
    var GRUPOS = [{ id:'agendadas', rot:'Agendadas' }, { id:'aguardando', rot:'Aguardando agendamento' }, { id:'realizadas', rot:'Realizadas' }];
    var busca = String(state.buscaOc || '').trim().toLowerCase();
    var bate = function(r){ return !busca || [r.ocorrencia, r.titulo, r.classificacao, r.unidade, r.morador].join(' ').toLowerCase().indexOf(busca) >= 0; };
    var porGrupo = { agendadas:[], aguardando:[], realizadas:[] };
    todos.forEach(function(r){ porGrupo[situacaoRecurso(r)].push(r); });
    var num = function(a, b){ return String(a.ocorrencia).localeCompare(String(b.ocorrencia), 'pt-BR', { numeric:true }); };
    var dataSess = function(r){ return String(dataDaOcorrencia(r)); };
    porGrupo.agendadas.sort(function(a, b){ return dataSess(a).localeCompare(dataSess(b)) || num(a, b); });
    porGrupo.aguardando.sort(num);
    porGrupo.realizadas.sort(num);
    var filtro = state.filtroSessao || 'todas';
    h += '<div class="filtros-sessao">' + [{ id:'todas', rot:'Todas', n:todos.length }].concat(GRUPOS.map(function(g){ return { id:g.id, rot:g.rot, n:porGrupo[g.id].length }; })).map(function(f){
      return '<button type="button" data-filtro-sessao="' + f.id + '" class="' + (filtro === f.id ? 'on' : '') + '">' + esc(f.rot) + ' <span class="n">' + f.n + '</span></button>';
    }).join('') + '</div>';
    h += '<div class="busca-oc"><input id="ed-busca-oc" placeholder="Procurar: número da ocorrência, assunto, unidade…" value="' + esc(state.buscaOc || '') + '" autocomplete="off"></div>';
    var algum = false;
    GRUPOS.forEach(function(g){
      if (filtro !== 'todas' && filtro !== g.id) return;
      var gs = porGrupo[g.id].filter(bate);
      if (!gs.length) return;
      algum = true;
      if (filtro === 'todas') h += '<div class="grupo-sessao">' + esc(g.rot) + ' · ' + gs.length + '</div>';
      h += '<div class="grid-oc">' + gs.map(cardOcorrencia).join('') + '</div>';
    });
    if (!algum) h += '<div class="vazio">' + (busca ? 'Nenhuma ocorrência com "' + esc(state.buscaOc) + '".' : ({ agendadas:'Nenhuma ocorrência em sessão agendada.', aguardando:'Nenhuma ocorrência aguardando agendamento.', realizadas:'Nenhuma ocorrência julgada ainda.' }[filtro] || 'Nenhuma ocorrência.')) + '</div>';
    return h;
  }
  function cardOcorrencia(r){
    var s = sessoes[r.sessaoId] || {}, st = statusRecurso(r), n = (r.provas || []).length;
    var tags = '<span class="tag ' + st.tag + '">' + esc(st.rot) + '</span>';
    if (equipe && !realizadaOc(r)) tags += r.liberado ? '<span class="tag lib">Liberado ao conselho</span>' : '<span class="tag rasc">Rascunho</span>';
    if (!equipe) tags += leituras[me.uid + '_' + r.id] ? '<span class="tag canc">✔ analisado</span>' : '<span class="tag agu">a analisar</span>';
    else { var nl = Object.values(leituras).filter(function(l){ return l.recursoId === r.id; }).length; if (nl) tags += '<span class="tag canc">✔ ' + nl + (nl === 1 ? ' analisou' : ' analisaram') + '</span>'; }
    return '<div class="card click card-oc" data-recurso="' + esc(r.id) + '">'
      + '<div class="topo"><span class="num">#' + esc(r.ocorrencia) + '</span><span class="muted small">' + n + (n === 1 ? ' arquivo' : ' arquivos') + '</span></div>'
      + '<h3>' + esc(r.titulo || r.classificacao || 'Ocorrência') + '</h3>'
      + '<div class="muted small">' + esc(r.unidade || '') + (r.morador ? ' · ' + esc(r.morador) : '') + '</div>'
      + '<div class="tags">' + tags + '</div>'
      + '<div class="sess">' + (dataDaOcorrencia(r) ? '📅 Julgamento em ' + esc(dataHoraBR(dataDaOcorrencia(r))) : 'Julgamento: data a definir') + '</div></div>';
  }
  // realizada -> "realizadas"; com data e ainda não realizada -> "agendadas"; sem data -> "aguardando agendamento"
  function situacaoSessao(s){ return s.realizada ? 'realizadas' : (s.data ? 'agendadas' : 'aguardando'); }
  var MESES_CURTOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function cardSessao(s){
    var rs = recursosDaSessao(s.id), sit = situacaoSessao(s);
    var julgados = rs.filter(function(r){ return r.decisao && r.decisao.resultado; }).length;
    var lidos = rs.filter(function(r){ return leituras[me.uid + '_' + r.id]; }).length;
    var pct = rs.length ? Math.round(100 * (equipe ? julgados : lidos) / rs.length) : 0;
    var p = String(s.data || '').slice(0, 10).split('-'), hora = String(s.data || '').slice(11, 16);
    var dia = p.length === 3
      ? '<div class="dia ' + (sit === 'realizadas' ? 'feita' : 'agendada') + '"><b>' + esc(p[2]) + '</b><span>' + (MESES_CURTOS[parseInt(p[1], 10) - 1] || '') + '/' + esc(p[0].slice(2)) + '</span>' + (hora ? '<span>' + esc(hora.replace(':', 'h')) + '</span>' : '') + '</div>'
      : '<div class="dia ' + (sit === 'realizadas' ? 'feita' : 'sem') + '"><b>' + (sit === 'realizadas' ? '✓' : '?') + '</b><span>' + (sit === 'realizadas' ? 'sem data' : 'a agendar') + '</span></div>';
    var rotSit = { realizadas:'Realizada', agendadas:'Agendada', aguardando:'Aguardando agendamento' }[sit];
    var tagSit = { realizadas:'real', agendadas:'lib', aguardando:'agu' }[sit];
    var tags = '<span class="tag ' + tagSit + '">' + rotSit + '</span>';
    if (equipe && !s.realizada) tags += s.liberada ? '<span class="tag lib">Liberada ao conselho</span>' : '<span class="tag rasc">Rascunho</span>';
    if (equipe && s.realizada && rs.length && julgados < rs.length) tags += '<span class="tag lanc">' + (rs.length - julgados) + ' a lançar</span>';
    return '<div class="card click card-sessao" data-sessao="' + esc(s.id) + '">' + dia
      + '<div class="corpo"><div class="tags">' + tags + '</div>'
      + '<h3>' + esc(s.titulo || 'Sessão de julgamento') + '</h3>'
      + '<div class="muted small">' + (s.data ? '📅 ' + esc(dataHoraBR(s.data)) : 'Data a definir') + (s.local ? ' · ' + esc(s.local) : '') + '</div>'
      + '<div class="small">' + rs.length + (rs.length === 1 ? ' recurso' : ' recursos') + ' · '
      + (equipe ? julgados + ' com decisão lançada' : lidos + ' analisado' + (lidos === 1 ? '' : 's') + ' por você') + '</div>'
      + '<div class="prog"><div style="width:' + pct + '%"></div></div>'
      + '<span class="abrir">Abrir sessão →</span></div></div>';
  }

  function telaSessao(){

  var PASSOS = ['Resumo', 'Provas', 'Alegações do morador', 'Decisão'];   // sem "Fundamentos" (16/11/2026, a pedido do escritório)

      if (!r.liberado) h += '<div class="aviso">Esta ocorrência ainda é um <b>rascunho</b>: o conselho não vê. Quando o material estiver pronto, clique em <b>"Liberar ao conselho"</b>.</div>';

      return '<button type="button" class="' + (i === state.passo ? 'on' : '') + '" data-passo="' + i + '"><span class="n">' + (i + 1) + '</span>' + p + '</button>';
    }).join('') + '</div>';
    var p = state.passo;
    if (p === 0) {
      h += '<div class="ficha">'
        + campoFicha('Ocorrência', (r.sistema ? r.sistema + ' ' : '') + '#' + r.ocorrencia) + campoFicha('Unidade', r.unidade) + campoFicha('Morador(a)', r.morador)
        + campoFicha('Classificação', r.classificacao) + campoFicha('Penalidade aplicada', r.penalidade)
        + campoFicha('Data do fato', [dataBR(r.dataFato), r.horaFato].filter(Boolean).join(' · ')) + campoFicha('Notificação', dataBR(r.dataNotificacao))
        + campoFicha('Pedido de recurso', dataBR(r.dataRecurso)) + campoFicha('Quem pediu a abertura', r.quemAbriu) + '</div>';
      h += r.fatos ? '<h3>Dos fatos</h3><div class="texto">' + esc(r.fatos) + '</div>' : '';
      h += r.historicoUnidade ? '<h3>Histórico da unidade</h3><div class="texto">' + esc(r.historicoUnidade) + '</div>' : '';
      h += r.observacoes ? '<h3>Observações do escritório</h3><div class="texto">' + esc(r.observacoes) + '</div>' : '';
      if (r.parecer || r.conclusao) h += '<div class="parecer-box"><h3 style="margin:0 0 4px;">Parecer do escritório' + (PARECERES[r.parecer] ? ': <span style="color:' + PARECERES[r.parecer].cor + '">' + esc(PARECERES[r.parecer].rot) + '</span>' : '') + '</h3>'
        + (r.conclusao ? '<div class="texto" style="margin:0;">' + esc(r.conclusao) + '</div>' : '') + '</div>';
      h += '<div class="barra" style="margin-top:14px;"><button type="button" class="btn sec peq" data-analise-pdf="' + esc(r.id) + '">📄 Análise do escritório (PDF de uma folha)</button></div>';
    } else if (p === 1) {
      h += telaProvas(r);
    } else if (p === 2) {
      h += r.alegacoes ? '<div class="texto">' + esc(r.alegacoes) + '</div>' : '<div class="vazio">O escritório ainda não resumiu as alegações do morador. Veja o recurso dele nas provas (categoria "Recurso do morador").</div>';
    } else {
      h += telaDecisaoLeitura(r);
    }
    h += '<div class="navpassos">' + (p > 0 ? '<button type="button" class="btn sec" data-passo="' + (p - 1) + '">← ' + PASSOS[p - 1] + '</button>' : '<span></span>')
      + (p < PASSOS.length - 1 ? '<button type="button" class="btn" data-passo="' + (p + 1) + '">' + PASSOS[p + 1] + ' →</button>' : '<span></span>') + '</div>';
    if (!equipe) {
      var lido = leituras[me.uid + '_' + r.id];
      h += '<div class="card notas" style="margin-top:22px;"><div class="barra" style="margin:0 0 8px;"><h3 style="margin:0;">Minhas anotações</h3><span class="espaco"></span>'
        + (lido ? '<span class="ok small">✔ Você marcou como analisado</span>' : '<button type="button" class="btn verde peq" id="marcar-lido">✔ Analisei este recurso</button>') + '</div>'
        + '<div class="muted small" style="margin-bottom:6px;">Só você vê estas anotações (nem o escritório). Elas são salvas sozinhas.</div>'
        + '<div class="campo" style="margin:0;"><textarea id="nota-texto" placeholder="Pontos para levar à sessão…"></textarea></div><div class="small muted" id="nota-status"></div></div>';

  }
  function campoFicha(k, v){ return v ? '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>' : ''; }

  function telaProvas(r){
    var provas = r.provas || [];
    if (r.provasRemovidas) return '<div class="vazio">As provas deste recurso saíram do portal ' + DIAS_PROVAS + ' dias depois do julgamento. Os originais continuam guardados pelo escritório.</div>';
    if (!provas.length) return '<div class="vazio">Nenhum arquivo enviado ainda.</div>';
    var h = '';
    CATEGORIAS.forEach(function(cat){
      var doGrupo = provas.filter(function(p){ return (p.categoria || 'prova') === cat.id; });
      if (!doGrupo.length) return;
      h += '<div class="grupo-provas">' + esc(cat.rot) + ' (' + doGrupo.length + ')</div><div class="provas">' + doGrupo.map(function(p){
        var ic = /^video/.test(p.tipo) ? '🎬' : /^image/.test(p.tipo) ? '🖼️' : /^audio/.test(p.tipo) ? '🔊' : '📄';
        var url = urlsProvas[p.caminho];
        var corpo = !url ? '<button type="button" class="abrir" data-abrir="' + esc(p.caminho) + '">' + ic + ' Abrir ' + (/^video/.test(p.tipo) ? 'vídeo' : /^image/.test(p.tipo) ? 'imagem' : /^audio/.test(p.tipo) ? 'áudio' : 'documento') + ' (' + tamanho(p.tamanho || 0) + ')</button>'
          : /^video/.test(p.tipo) ? '<video controls preload="metadata" src="' + url + '"></video>'
          : /^image/.test(p.tipo) ? '<button type="button" class="miniatura" data-ver="' + esc(p.caminho) + '" title="Ver em tela cheia"><img src="' + url + '" alt="' + esc(p.nome) + '"><span class="lupa">⤢ Tela cheia</span></button>'
          : /^audio/.test(p.tipo) ? '<audio controls src="' + url + '" style="width:100%;"></audio>'
          : '<button type="button" class="btn sec" data-ver="' + esc(p.caminho) + '" style="display:block;width:100%;">📄 Abrir documento em tela cheia</button>';
        return '<div class="prova"><div class="cab">' + ic + ' <b>' + esc(p.nome) + '</b></div>' + corpo + '</div>';
      }).join('') + '</div>';
    });
    return h;
  }
  function telaDecisaoLeitura(r){
    var d = r.decisao;

      return '<div class="vazio">' + (realizadaOc(r) ? 'Ocorrência julgada. O escritório vai lançar aqui a decisão do conselho e a ementa.' : 'A decisão será registrada aqui pelo escritório depois da sessão de julgamento.') + '</div>';

  function votacaoTexto(d){
    var f = parseInt(d.votosFavor, 10), c = parseInt(d.votosContra, 10), a = parseInt(d.abstencoes, 10);
    if (isNaN(f) && isNaN(c)) return d.unanime ? 'unânime' : '';
    return (d.unanime ? 'unânime, ' : '') + (isNaN(f) ? 0 : f) + ' a ' + (isNaN(c) ? 0 : c) + (a > 0 ? ' (' + a + ' abstenç' + (a === 1 ? 'ão' : 'ões') + ')' : '');
  }

  // envio dos arquivos para o Storage, um por vez, com barra de progresso
  function enviarArquivos(files, categoria, recursoId, statusEl){
    // recurso recém-criado: a lista ainda pode não ter chegado do banco; o rascunho tem o condomínio
    var r = recursos[recursoId] || (rascunho && rascunho.id === recursoId ? rascunho : null);
    if (!r || !r.condominioSlug) { statusEl.innerHTML = '<span class="err">Salve os dados do recurso antes de enviar arquivos.</span>'; return Promise.resolve(0); }
    var fila = Array.prototype.slice.call(files);
    var enviados = 0;
    function proximo(){
      if (!fila.length) { statusEl.innerHTML = '<span class="ok">' + enviados + ' arquivo(s) enviado(s).</span>'; return Promise.resolve(enviados); }
      var f = fila.shift();
      var tipo = tipoDoArquivo(f);
      if (!tipo) { statusEl.innerHTML += '<div class="err">' + esc(f.name) + ': tipo de arquivo não aceito (só vídeo, áudio, imagem e PDF).</div>'; return proximo(); }
      var caminho = 'julgamentos/' + r.condominioSlug + '/' + recursoId + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
      statusEl.innerHTML = 'Enviando ' + esc(f.name) + '… <div class="barra-up"><div id="barra-up"></div></div>';
      return new Promise(function(ok, falha){
        var task = storage.ref(caminho).put(f, { contentType:tipo });
        task.on('state_changed', function(sn){
          var b = document.getElementById('barra-up'); if (b) b.style.width = Math.round(100 * sn.bytesTransferred / sn.totalBytes) + '%';
        }, falha, ok);
      }).then(function(){
        enviados++;
        return db.collection('recursosJulgamento').doc(recursoId).update({
          provas:FV.arrayUnion({ nome:f.name, caminho:caminho, tipo:tipo, tamanho:f.size, categoria:categoria, enviadoEm:Date.now() }),
          atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid
        });
      }).then(proximo, function(e){ statusEl.innerHTML = '<span class="err">Falhou em ' + esc(f.name) + ': ' + esc(e.code || e.message) + '</span>'; });
    }
    return proximo();
  }
  function tipoDoArquivo(f){

    if (/^(video|audio)\//.test(t) || /^image\/(jpeg|png|gif|webp|heic|heif)$/.test(t) || t === 'application/pdf') return t;
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    return { mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm', m4v:'video/mp4', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
             webp:'image/webp', heic:'image/heic', pdf:'application/pdf', mp3:'audio/mpeg', m4a:'audio/mp4', ogg:'audio/ogg', opus:'audio/ogg' }[ext] || '';
  }

  // ---------------------------------------------------------------- visor em tela cheia (imagens e PDFs)

  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var PDFJS_SRI = 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
  var PDFJS_WORKER_SRI = 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2';
  var pdfjsPronto = null;
  function carregarPdfjs(){
    if (pdfjsPronto) return pdfjsPronto;

      var s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js'; s.integrity = PDFJS_SRI; s.crossOrigin = 'anonymous';
      s.onload = ok; s.onerror = function(){ falha(new Error('não foi possível carregar o leitor de PDF')); };

      // o "worker" vem do mesmo CDN, conferido pelo hash, e roda a partir de um blob (worker de outro domínio não é permitido)
      return fetch(PDFJS + 'pdf.worker.min.js', { integrity:PDFJS_WORKER_SRI }).then(function(r){ return r.text(); }).then(function(t){

  var visorAberto = null;
  function fecharVisor(){
    if (!visorAberto) return;
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    visorAberto.remove(); visorAberto = null;
    document.removeEventListener('keydown', teclaVisor);
  }
  function teclaVisor(e){
    if (!visorAberto) return;
    if (e.key === 'Escape') { fecharVisor(); return; }
    if (e.key === 'ArrowRight' && visorAberto._prox) visorAberto._prox(1);
    if (e.key === 'ArrowLeft' && visorAberto._prox) visorAberto._prox(-1);
  }
  function montarVisor(titulo, url, nome){
    fecharVisor();
    var v = document.createElement('div');
    v.className = 'visor'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', titulo);
    v.innerHTML = '<div class="visor-topo"><span class="visor-tit"></span><span class="espaco"></span>'
      + '<a class="visor-bt" download>⬇ Baixar</a><button type="button" class="visor-bt" data-visor="cheia" title="Tela cheia">⤢</button>'
      + '<button type="button" class="visor-bt fechar" data-visor="fechar" aria-label="Fechar">✕</button></div><div class="visor-corpo"></div>';
    v.querySelector('.visor-tit').textContent = titulo;
    var a = v.querySelector('a.visor-bt'); a.href = url; a.setAttribute('download', nome || 'arquivo');
    v.addEventListener('click', function(e){
      var b = e.target.closest('[data-visor]');
      if (b && b.dataset.visor === 'fechar') { fecharVisor(); return; }
      if (b && b.dataset.visor === 'cheia') { telaCheia(v); return; }
      if (e.target.classList.contains('visor-corpo') && v._fundoFecha) fecharVisor();
    });
    document.body.appendChild(v);
    document.addEventListener('keydown', teclaVisor);
    visorAberto = v;
    telaCheia(v);
    return v;
  }
  function telaCheia(el){

    } catch (e) {}
  }
  function verImagem(caminho){
    var r = recursos[state.recursoId];
    var imgs = (r.provas || []).filter(function(p){ return /^image/.test(p.tipo) && urlsProvas[p.caminho]; });
    var i = Math.max(0, imgs.findIndex(function(p){ return p.caminho === caminho; }));
    var v = montarVisor('', '', '');
    v._fundoFecha = true;
    var corpo = v.querySelector('.visor-corpo');
    function pintar(){
      var p = imgs[i];
      v.querySelector('.visor-tit').textContent = p.nome + (imgs.length > 1 ? '  (' + (i + 1) + ' de ' + imgs.length + ')' : '');
      var a = v.querySelector('a.visor-bt'); a.href = urlsProvas[p.caminho]; a.setAttribute('download', p.nome);
      corpo.innerHTML = '<img class="visor-img" alt="">' + (imgs.length > 1 ? '<button type="button" class="visor-seta esq" aria-label="Anterior">‹</button><button type="button" class="visor-seta dir" aria-label="Próxima">›</button>' : '');
      corpo.querySelector('img').src = urlsProvas[p.caminho];
      corpo.querySelector('img').alt = p.nome;
      var e = corpo.querySelector('.esq'), d = corpo.querySelector('.dir');
      if (e) e.onclick = function(ev){ ev.stopPropagation(); v._prox(-1); };
      if (d) d.onclick = function(ev){ ev.stopPropagation(); v._prox(1); };
    }
    v._prox = function(n){ i = (i + n + imgs.length) % imgs.length; pintar(); };
    // deslizar o dedo no celular troca de foto
    var x0 = null;
    corpo.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive:true });
    corpo.addEventListener('touchend', function(e){ if (x0 == null || imgs.length < 2) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) v._prox(dx < 0 ? 1 : -1); x0 = null; });
    pintar();
  }
  function verPdf(url, nome){
    var v = montarVisor(nome, url, nome);
    var corpo = v.querySelector('.visor-corpo');
    corpo.classList.add('pdf');
    corpo.innerHTML = '<div class="visor-msg">Abrindo o documento…</div>';
    carregarPdfjs().then(function(lib){ return lib.getDocument(url).promise; }).then(function(doc){
      corpo.innerHTML = '';
      var largura = Math.min(corpo.clientWidth - 24, 1100);
      var cadeia = Promise.resolve();
      for (var n = 1; n <= doc.numPages; n++) (function(n){
        cadeia = cadeia.then(function(){ return doc.getPage(n); }).then(function(pg){
          if (!visorAberto) return;
          var base = pg.getViewport({ scale:1 }), escala = largura / base.width, dpr = window.devicePixelRatio || 1;
          var vp = pg.getViewport({ scale:escala * dpr });
          var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
          c.style.width = (vp.width / dpr) + 'px'; c.style.height = (vp.height / dpr) + 'px';
          corpo.appendChild(c);
          return pg.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
        });
      })(n);
      return cadeia;
    }).catch(function(e){
      corpo.innerHTML = '<div class="visor-msg">Não foi possível mostrar o PDF aqui (' + esc(e.message || String(e)) + '). Use o botão <b>⬇ Baixar</b>.</div>';

  function abrirProva(caminho, mostrarDepois){
    var r = recursos[state.recursoId];
    var pv = (r.provas || []).find(function(p){ return p.caminho === caminho; });
    var bucket = firebase.app().options.storageBucket;
    var botao = document.querySelector('[data-abrir="' + CSS.escape(caminho) + '"]');
    if (botao) { botao.disabled = true; botao.textContent = 'Carregando…'; }
    auth.currentUser.getIdToken().then(function(tok){
      return fetch(STORAGE_HOST + '/v0/b/' + bucket + '/o/' + encodeURIComponent(caminho) + '?alt=media', { headers:{ Authorization:'Firebase ' + tok } });
    }).then(function(resp){
      if (!resp.ok) throw new Error(resp.status === 403 ? 'sem permissão (o prazo das provas pode ter vencido)' : 'erro ' + resp.status);
      return resp.blob();
    }).then(function(blob){
      urlsProvas[caminho] = URL.createObjectURL(pv && pv.tipo ? new Blob([blob], { type:pv.tipo }) : blob);
      setTimeout(function(){ mostrar(true); if (mostrarDepois !== false && pv && (/^image/.test(pv.tipo) || pv.tipo === 'application/pdf')) verArquivo(caminho); }, 0);
      db.collection('acessosProvasJulgamento').add({ uid:me.uid, nome:me.nome, recursoId:r.id, condominioSlug:r.condominioSlug, arquivo:caminho, em:FV.serverTimestamp() }).catch(function(){});
    }).catch(function(e){
      var msg = /failed to fetch|networkerror|load failed/i.test(e.message || '') ? 'o Storage ainda não autoriza o portal a ler arquivos (CORS). Avise o administrador.' : e.message;
      if (botao) { botao.disabled = false; botao.textContent = 'Não foi possível abrir: ' + msg; }
    });
  }

  // provas com o prazo vencido saem do Storage (o original fica no Drive); roda quando alguém da equipe abre a tela
  var limpando = false;
  function limparProvasVencidas(){
    if (!equipe || limpando) return;
    var agora = Date.now();
    var vencidos = Object.values(recursos).filter(function(r){
      return r.provasExpiramEm && r.provasExpiramEm.toMillis() < agora && !r.provasRemovidas && (r.provas || []).length;
    });
    if (!vencidos.length) return;
    limpando = true;
    vencidos.reduce(function(p, r){
      return p.then(function(){
        return Promise.all((r.provas || []).map(function(pv){
          return storage.ref(pv.caminho).delete().catch(function(e){ if (e.code !== 'storage/object-not-found') throw e; });
        })).then(function(){
          return db.collection('recursosJulgamento').doc(r.id).update({ provasRemovidas:true, provasRemovidasEm:FV.serverTimestamp() });
        });
      });
    }, Promise.resolve()).catch(function(e){ console.warn('limpeza das provas vencidas:', e.message); }).then(function(){ limpando = false; });
  }

    db.collection('leiturasJulgamento').doc(me.uid + '_' + r.id).set({ uid:me.uid, nome:me.nome, recursoId:r.id, sessaoId:r.sessaoId,
      condominioSlug:r.condominioSlug, em:FV.serverTimestamp() }).catch(function(e){ avisoErro('Não foi possível marcar: ' + e.message); });
  }

  // ---------------------------------------------------------------- sessões (escritório)
  function novaSessao(){
    var data = prompt('Data e hora da sessão (dd/mm/aaaa hh:mm). Deixe em branco se ainda não foi marcada:', '');
    if (data === null) return;
    var iso = '';
    var m = data.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[:h](\d{2}))?$/);
    if (data.trim() && !m) { alert('Use o formato dd/mm/aaaa hh:mm (ex.: 15/11/2026 19:30).'); return; }
    if (m) iso = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + (m[4] ? 'T' + m[4].padStart(2, '0') + ':' + m[5] : '');
    var titulo = prompt('Título da sessão:', 'Sessão de julgamento' + (m ? ' — ' + ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][parseInt(m[2], 10) - 1] + ' de ' + m[3] : ''));
    if (titulo === null) return;
    db.collection('sessoesJulgamento').add({ condominioSlug:state.condo, condominioNome:nomeCondo(state.condo), data:iso, titulo:titulo.trim() || 'Sessão de julgamento',
      local:'', liberada:false, realizada:false, criadoEm:FV.serverTimestamp(), criadoPor:me.uid })
      .then(function(ref){ ir('sessao', { sessaoId:ref.id }); }).catch(function(e){ avisoErro('Não foi possível criar: ' + e.message); });
  }
  function editarSessao(){
    var s = sessoes[state.sessaoId];
    var atual = s.data ? dataBR(s.data) + (s.data.length > 10 ? ' ' + s.data.slice(11, 16) : '') : '';
    var data = prompt('Data e hora da sessão (dd/mm/aaaa hh:mm):', atual); if (data === null) return;
    var m = data.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[:h](\d{2}))?$/);
    if (data.trim() && !m) { alert('Use o formato dd/mm/aaaa hh:mm.'); return; }
    var titulo = prompt('Título:', s.titulo || ''); if (titulo === null) return;
    var local = prompt('Local (opcional):', s.local || ''); if (local === null) return;
    db.collection('sessoesJulgamento').doc(s.id).update({ data:m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + (m[4] ? 'T' + m[4].padStart(2, '0') + ':' + m[5] : '') : '',
      titulo:titulo.trim(), local:local.trim() }).catch(function(e){ avisoErro(e.message); });
  }
  // ---- ocorrência sem sessão (16/11/2026): as ocorrências novas ficam num "grupo" interno por condomínio, que não aparece
  function novaOcorrencia(){
    var id = state.condo + '-ocorrencias', base = { condominioSlug:state.condo, condominioNome:nomeCondo(state.condo) };
    var pronto = sessoes[id] ? Promise.resolve() : db.collection('sessoesJulgamento').doc(id).set(Object.assign({ titulo:'Ocorrências', data:'', local:'',
      liberada:false, realizada:false, criadoEm:FV.serverTimestamp(), criadoPor:me.uid }, base), { merge:true });
    pronto.then(function(){ if (!sessoes[id]) sessoes[id] = Object.assign({ id:id, liberada:false, realizada:false, data:'' }, base); abrirEdicao(null, id); })
      .catch(function(e){ avisoErro('Não foi possível: ' + e.message); });
  }
  function dataOcorrencia(){
    var r = recursos[state.recursoId], atual = dataDaOcorrencia(r);
    var txt = atual ? dataBR(atual) + (atual.length > 10 ? ' ' + atual.slice(11, 16) : '') : '';
    var data = prompt('Data e hora do julgamento (dd/mm/aaaa hh:mm). Deixe em branco para "a definir":', txt); if (data === null) return;
    var m = data.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[:h](\d{2}))?$/);
    if (data.trim() && !m) { alert('Use o formato dd/mm/aaaa hh:mm (ex.: 15/12/2026 19:30).'); return; }
    var iso = m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + (m[4] ? 'T' + m[4].padStart(2, '0') + ':' + m[5] : '') : '';
    db.collection('recursosJulgamento').doc(r.id).update({ dataJulgamento:iso, atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid }).catch(function(e){ avisoErro(e.message); });
  }
  function atualizarOcorrencia(campos, pergunta){
    var r = recursos[state.recursoId];
    if (pergunta && !confirm(pergunta)) return;
    db.collection('recursosJulgamento').doc(r.id).update(Object.assign({ atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid }, campos))
      .catch(function(e){ avisoErro('Não foi possível: ' + e.message); });
  }
  // liberar/recolher marca a sessão e todos os recursos dela (as regras checam o campo em cada recurso)
  function liberarSessao(liberar){
    var s = sessoes[state.sessaoId], rs = recursosDaSessao(s.id);
    if (liberar && !confirm('Liberar esta sessão ao conselho do ' + nomeCondo(s.condominioSlug) + '?\nSíndico e conselheiros passam a ver os ' + rs.length + ' recurso(s) e as provas.')) return;
    var b = db.batch();
    b.update(db.collection('sessoesJulgamento').doc(s.id), { liberada:liberar, liberadaEm:liberar ? FV.serverTimestamp() : null });
    rs.forEach(function(r){ b.update(db.collection('recursosJulgamento').doc(r.id), { liberado:liberar }); });
    b.commit().catch(function(e){ avisoErro('Não foi possível: ' + e.message); });
  }

  // ---------------------------------------------------------------- ementário
  function telaEmentario(){
    var julgados = Object.values(recursos).filter(function(r){ return r.condominioSlug === state.condo && r.decisao && r.decisao.resultado; })
      .sort(function(a, b){ return String(b.decisao.dataSessao || '').localeCompare(String(a.decisao.dataSessao || '')); });
    var filtro = (state.filtroEmentario || '').toLowerCase();
    var lista = julgados.filter(function(r){ return !filtro || (r.titulo + ' ' + r.classificacao + ' ' + (r.decisao.ementa || '')).toLowerCase().indexOf(filtro) >= 0; });
    var cont = { mantida:0, cancelada:0, modulada:0 };
    julgados.forEach(function(r){ cont[r.decisao.resultado]++; });
    var h = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button>' + chipsCondos()
      + '<div class="barra"><h2>📚 Ementário — ' + esc(nomeCondo(state.condo)) + '</h2></div>'
      + '<p class="muted small" style="margin-top:-8px;">Decisões já tomadas pelo conselho, para julgar casos parecidos do mesmo jeito.</p>'
      + '<div class="resumo-ementario"><div><b>' + julgados.length + '</b>julgados</div><div><b class="err">' + cont.mantida + '</b>mantidas</div>'
      + '<div><b class="ok">' + cont.cancelada + '</b>canceladas</div><div><b style="color:var(--blue)">' + cont.modulada + '</b>moduladas</div></div>'
      + '<div class="campo" style="max-width:420px;"><input id="ed-filtro-ementario" placeholder="Buscar: contramão, animal, estacionamento…" value="' + esc(state.filtroEmentario || '') + '"></div>';
    if (!lista.length) return h + '<div class="vazio">' + (julgados.length ? 'Nada encontrado com esse termo.' : 'Ainda não há decisões lançadas para este condomínio.') + '</div>';
    return h + lista.map(function(r){
      var d = r.decisao;
      return '<div class="card" style="margin-bottom:12px;"><div class="barra" style="margin:0 0 6px;"><b>#' + esc(r.ocorrencia) + ' — ' + esc(r.titulo || r.classificacao || '') + '</b><span class="espaco"></span>'
        + '<span class="tag ' + RESULTADOS[d.resultado].tag + '">' + esc(RESULTADOS[d.resultado].rot) + '</span></div>'
        + '<div class="muted small" style="margin-bottom:8px;">' + esc(r.unidade || '') + ' · sessão de ' + esc(dataBR(d.dataSessao)) + (votacaoTexto(d) ? ' · ' + esc(votacaoTexto(d)) : '') + '</div>'
        + (d.ementa ? '<div class="texto" style="margin:0;">' + esc(d.ementa) + '</div>' : '<div class="muted small">Ementa ainda não escrita.</div>')
        + '<div style="margin-top:8px;"><button type="button" class="btn sec peq" data-recurso="' + esc(r.id) + '">Abrir recurso</button></div></div>';
    }).join('');
  }

  // ---------------------------------------------------------------- conselheiros (admin)
  var pessoas = null, membros = {}, tabCondo = null;   // síndico e conselheiros entram pela aba Condomínios
  function telaConselheiros(){
    var h = '<button type="button" class="voltar" data-ir="lista">← Voltar para as sessões</button>'
      + '<h2>👥 Síndicos e conselheiros</h2>'
      + '<div class="aviso">Passo a passo: 1) o síndico ou conselheiro faz o <b>cadastro</b> na tela de login do portal; '
      + '2) aqui, escolha o <b>condomínio</b> e o <b>papel</b> dele e clique em <b>Aprovar</b>. '
      + 'Ele recebe a aba <b>Condomínios</b>, onde vê só o cartão das Sessões de Julgamento (e só as sessões liberadas do condomínio dele).</div>';
    if (!pessoas) return h + '<div class="muted">Carregando cadastros…</div>';
    var opcoesCondo = condos.map(function(c){ return '<option value="' + esc(c.slug) + '">' + esc(c.nome) + '</option>'; }).join('');
    var lista = pessoas.filter(function(u){ return contaCliente(u.role) || u.acesso !== 'ativo'; })
      .sort(function(a, b){ return (a.acesso === 'ativo') - (b.acesso === 'ativo') || String(a.displayName || '').localeCompare(String(b.displayName || ''), 'pt-BR'); });
    if (!tabCondo) h += '<div class="aviso">⚠ Não encontrei a aba "Condomínios" em Administração › Abas (endereço <b>tools/condominios/</b>). Ela é a porta de entrada do síndico e dos conselheiros.</div>';
    h += '<table class="t"><tr><th>Pessoa</th><th>Situação</th><th>Vínculo</th><th>Condomínio</th><th>Papel</th><th></th></tr>' + lista.map(function(u){
      var v = (membros[u.uid] || {}).condominios || {};
      var vinc = Object.keys(v).map(function(k){ return esc(nomeCondo(k)) + ' (' + (v[k] === 'sindico' ? 'síndico' : 'conselheiro') + ')'; }).join('<br>') || '<span class="muted">—</span>';
      return '<tr><td><b>' + esc(u.displayName || '') + '</b><br><span class="muted small">' + esc(u.email || '') + '</span></td>'
        + '<td class="small">' + (u.acesso === 'ativo' ? '<span class="ok">ativo</span>' : '<span class="err">' + esc(u.acesso || 'pendente') + '</span>') + (u.role ? '<br><span class="muted">' + esc(TIPOS[u.role] || u.role) + '</span>' : '') + '</td>'
        + '<td class="small">' + vinc + '</td>'
        + '<td><select class="cs-condo" data-uid="' + esc(u.uid) + '">' + opcoesCondo + '</select></td>'
        + '<td><select class="cs-papel" data-uid="' + esc(u.uid) + '"><option value="conselheiro">Conselheiro</option><option value="sindico">Síndico</option></select></td>'
        + '<td style="white-space:nowrap;"><button type="button" class="btn verde peq" data-aprovar-conselho="' + esc(u.uid) + '">' + (u.acesso === 'ativo' ? 'Vincular' : 'Aprovar') + '</button>'
        + (Object.keys(v).length ? ' <button type="button" class="btn ghost peq" data-desvincular="' + esc(u.uid) + '">Tirar vínculos</button>' : '') + '</td></tr>';
    }).join('') + '</table>';
    if (!lista.length) h += '<div class="vazio" style="margin-top:12px;">Nenhum cadastro aguardando nem conta de cliente.</div>';
    return h;
  }
  function carregarPessoasConselho(){
    if (pessoas) return;
    Promise.all([db.collection('users').get(), db.collection('conselhoMembros').get(), db.collection('tabs').get()]).then(function(r){
      pessoas = r[0].docs.map(function(d){ return Object.assign({ uid:d.id }, d.data()); });
      membros = {}; r[1].forEach(function(d){ membros[d.id] = d.data(); });
      var t = r[2].docs.find(function(d){ return /(^|\/)tools\/condominios(\/|$)/.test(String(d.data().url || '')); });
      tabCondo = t ? t.id : null;
      mostrar(true);
    }).catch(function(e){ avisoErro('Não foi possível carregar os cadastros: ' + e.message); });
  }
  // aprova a conta como cliente (só com a aba das sessões) e grava o vínculo com o condomínio
  function aprovarConselho(uid){
    var u = pessoas.find(function(x){ return x.uid === uid; });
    var slug = document.querySelector('.cs-condo[data-uid="' + CSS.escape(uid) + '"]').value;
    var papel = document.querySelector('.cs-papel[data-uid="' + CSS.escape(uid) + '"]').value;
    if (!tabCondo) { alert('Não encontrei a aba "Condomínios" em Administração › Abas (endereço tools/condominios/).'); return; }
    if (u.role && !contaCliente(u.role) && u.acesso === 'ativo') { alert(u.displayName + ' é da equipe (' + (TIPOS[u.role] || u.role) + '). Conselheiros e síndicos precisam ser contas de fora do escritório (tipo Conselheiro, Síndico ou Cliente).'); return; }
    if (!confirm((u.acesso === 'ativo' ? 'Vincular ' : 'Aprovar ') + (u.displayName || u.email) + ' como ' + (papel === 'sindico' ? 'SÍNDICO' : 'CONSELHEIRO') + ' do ' + nomeCondo(slug) + '?\n\nEla(e) recebe a aba Condomínios, com acesso só às Sessões de Julgamento liberadas desse condomínio.')) return;
    var atual = membros[uid] || {};
    var vinc = Object.assign({}, atual.condominios || {}); vinc[slug] = papel;
    var nomes = Object.assign({}, atual.nomesCondominios || {}); nomes[slug] = nomeCondo(slug);
    var b = db.batch();
    b.set(db.collection('conselhoMembros').doc(uid), { nome:u.displayName || '', email:u.email || '', condominios:vinc, nomesCondominios:nomes, atualizadoPor:me.uid, atualizadoEm:FV.serverTimestamp() });
    var upd = { role:papel === 'sindico' ? 'sindico' : 'conselheiro', tabs:FV.arrayUnion(tabCondo) };   // tipo de usuário = papel no conselho
    if (u.acesso !== 'ativo') Object.assign(upd, { acesso:'ativo', acessoAprovadoPor:me.uid, acessoAprovadoEm:FV.serverTimestamp() });
    b.update(db.collection('users').doc(uid), upd);
    b.delete(db.collection('organograma').doc(uid));   // o autocadastro cria o bloco no organograma; conselheiro não é da equipe
    b.commit().then(function(){ pessoas = null; mostrar(true); }).catch(function(e){ avisoErro('Não foi possível aprovar: ' + e.message); });
  }
  function desvincular(uid){
    var u = pessoas.find(function(x){ return x.uid === uid; });
    if (!confirm('Tirar todos os vínculos de ' + (u.displayName || u.email) + ' com condomínios? Ela(e) deixa de ver as sessões na hora.')) return;
    db.collection('conselhoMembros').doc(uid).delete().then(function(){ pessoas = null; mostrar(true); }).catch(function(e){ avisoErro(e.message); });
  }

  // ---------------------------------------------------------------- importar pacote (pasta com pacote.json + arquivos)
  function importarPacote(files){
    var lista = Array.prototype.slice.call(files);
    var json = lista.find(function(f){ return /(^|\/)pacote\.json$/.test(f.webkitRelativePath || f.name); });
    if (!json) { alert('A pasta escolhida não tem o arquivo pacote.json.'); return; }
    var raiz = (json.webkitRelativePath || '').replace(/pacote\.json$/, '');
    json.text().then(function(txt){
      var p = JSON.parse(txt);
      var slug = slugify(p.condominio);
      if (!confirm('Importar ' + (p.sessoes || []).length + ' sessão(ões) e ' + (p.recursos || []).length + ' recurso(s) do ' + p.condominio + '?\n\nAs sessões entram como RASCUNHO (o conselho não vê até você liberar). Pode importar a pasta inteira de novo: o que já está no portal NÃO é alterado (sessões e textos editados pela equipe ficam como estão). Entram só os recursos novos, os campos que estavam em branco e os arquivos que ainda não foram enviados.')) return;
      var porArquivo = {}; lista.forEach(function(f){ porArquivo[(f.webkitRelativePath || f.name).slice(raiz.length)] = f; });
      state.view = 'importando';
      app.innerHTML = '<h2>Importando…</h2><div id="imp-log" class="small" style="white-space:pre-wrap;line-height:1.6;"></div><div class="barra-up" style="height:8px;"><div id="imp-barra"></div></div>';
      var log = function(t){ var el = document.getElementById('imp-log'); if (el) el.textContent += t + '\n'; };
      var idsSessao = {}, novosRec = {}, falhas = [];
      var total = (p.recursos || []).reduce(function(n, r){ return n + (r.arquivos || []).length; }, 0), feitos = 0;
      return (p.sessoes || []).reduce(function(pr, s){
        return pr.then(function(){
          var id = slug + '-' + slugify(s.chave || s.titulo || s.data);
          idsSessao[s.chave] = id;
          var ref = db.collection('sessoesJulgamento').doc(id);
          log('… sessão: ' + (s.titulo || s.data));
          return ref.get().then(function(ex){
            // sessão que já existe fica como está (data, título, local e "realizada" podem ter sido acertados pela equipe)
            if (ex.exists) { log('= sessão já existe, mantida: ' + (ex.data().titulo || s.titulo || s.data)); return; }
            var dados = { condominioSlug:slug, condominioNome:p.condominio, data:s.data || '', titulo:s.titulo || 'Sessão de julgamento', local:s.local || '', realizada:!!s.realizada,
              liberada:false, criadoEm:FV.serverTimestamp(), criadoPor:me.uid };
            return ref.set(dados, { merge:true }).then(function(){ log('✔ sessão nova: ' + (s.titulo || s.data)); });
          });
        });
      }, Promise.resolve()).then(function(){
        return (p.recursos || []).reduce(function(pr, r){
          return pr.then(function(){
            var id = slug + '-' + slugify(r.ocorrencia);
            var ref = db.collection('recursosJulgamento').doc(id);
            log('… recurso #' + r.ocorrencia);
            return ref.get().then(function(ex){
              var atual = ex.exists ? ex.data() : null;
              if (!atual) novosRec[r.ocorrencia] = true;
              var sess = sessoes[idsSessao[r.sessao]] || {};
              var dados = {};
              // recurso que já existe: só preenche o que está em branco (o que a equipe escreveu ou corrigiu não muda)
              CAMPOS_TEXTO.forEach(function(k){ if (r[k] != null && String(r[k]).trim() && !(atual && String(atual[k] || '').trim())) dados[k] = String(r[k]); });
              if (!atual) Object.assign(dados, { sessaoId:idsSessao[r.sessao], condominioSlug:slug, condominioNome:p.condominio, liberado:!!sess.liberada,
                provas:[], criadoEm:FV.serverTimestamp(), criadoPor:me.uid });
              if (!atual || Object.keys(dados).length) Object.assign(dados, { atualizadoEm:FV.serverTimestamp(), atualizadoPor:me.uid });
              if (atual && !atual.sessaoId && idsSessao[r.sessao]) dados.sessaoId = idsSessao[r.sessao];
              return (atual && !Object.keys(dados).length ? Promise.resolve() : ref.set(dados, { merge:true })).then(function(){
                var ja = (atual && atual.provas || []).map(function(x){ return x.nome + '|' + x.tamanho; });
                return (r.arquivos || []).reduce(function(pa, a){
                  return pa.then(function(){
                    var f = porArquivo[a.arquivo];
                    feitos++;
                    var barra = document.getElementById('imp-barra'); if (barra) barra.style.width = Math.round(100 * feitos / Math.max(total, 1)) + '%';
                    if (!f) { log('  ⚠ não encontrado na pasta: ' + a.arquivo); return; }
                    if (ja.indexOf(f.name + '|' + f.size) >= 0) return;
                    var tipo = tipoDoArquivo(f); if (!tipo) { log('  ⚠ tipo não aceito: ' + a.arquivo); return; }
                    var caminho = 'julgamentos/' + slug + '/' + id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
                    var enviar = function(tent){
                      return new Promise(function(ok, falha){ storage.ref(caminho).put(f, { contentType:tipo }).on('state_changed', null, falha, ok); })
                        .catch(function(e){ if (tent < 3) { log('  … nova tentativa (' + (tent + 1) + 'ª): ' + a.arquivo); return new Promise(function(r){ setTimeout(r, 3000 * tent); }).then(function(){ return enviar(tent + 1); }); } throw e; });
                    };
                    return enviar(1).then(function(){
                      return ref.update({ provas:FV.arrayUnion({ nome:f.name, caminho:caminho, tipo:tipo, tamanho:f.size, categoria:a.categoria || 'prova', enviadoEm:Date.now() }) });
                    }).catch(function(e){ falhas.push('#' + r.ocorrencia + ' — ' + f.name + ' (' + (e.code || e.message) + ')'); log('  ✖ não enviado: ' + a.arquivo + ' (' + (e.code || e.message) + ')'); });
                  });
                }, Promise.resolve());
              });
            }).then(function(){ log('✔ recurso #' + r.ocorrencia + (novosRec[r.ocorrencia] ? ' (novo)' : ' (já existia: só o que faltava)') + ' — ' + (r.arquivos || []).length + ' arquivos'); })
              .catch(function(e){ falhas.push('#' + r.ocorrencia + ' — recurso não gravado (' + (e.code || e.message) + ')'); log('✖ recurso #' + r.ocorrencia + ' não gravado: ' + (e.code || e.message)); });
          });
        }, Promise.resolve());
      }).then(function(){
        log(falhas.length ? '\n⚠ Concluído com ' + falhas.length + ' falha(s):\n' + falhas.join('\n') + '\n\nImporte a mesma pasta de novo: entra só o que faltou.'
                          : '\nConcluído. Todas as ocorrências entraram como rascunho: confira e libere ao conselho.');
        state.condo = slug;
        setTimeout(function(){ if (document.getElementById('imp-log')) { var b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Ver as ocorrências'; b.onclick = function(){ ir('lista'); }; app.appendChild(b); } }, 50); });
    }).catch(function(e){ alert('Não foi possível importar: ' + e.message); ir('lista'); });
  }

  // ---------------------------------------------------------------- eventos
  function depoisDeDesenhar(){
    if (state.view === 'recurso' && !equipe) carregarNota();
    var upl = document.getElementById('upl');
    if (upl) {
      ['dragenter', 'dragover'].forEach(function(ev){ upl.addEventListener(ev, function(e){ e.preventDefault(); upl.classList.add('drag'); }); });
      ['dragleave', 'drop'].forEach(function(ev){ upl.addEventListener(ev, function(e){ e.preventDefault(); upl.classList.remove('drag'); }); });
      upl.addEventListener('drop', function(e){ enviarArquivos(e.dataTransfer.files, document.getElementById('ed-categoria').value, rascunho.id, document.getElementById('upl-status')); });
    }
    var resBox = document.getElementById('dec-resultado');
    if (resBox) resBox.addEventListener('change', function(){
      var v = (document.querySelector('input[name="dec-res"]:checked') || {}).value;
      document.getElementById('dec-mod-box').style.display = v === 'modulada' ? '' : 'none';
      Array.prototype.forEach.call(document.querySelectorAll('.opcoes label'), function(l){ l.classList.toggle('on', !!l.querySelector('input:checked')); });
    });
    var modBox = document.getElementById('dec-mod-box');
    if (modBox) modBox.addEventListener('change', function(){ Array.prototype.forEach.call(modBox.querySelectorAll('label'), function(l){ l.classList.toggle('on', !!l.querySelector('input:checked')); }); });
    var bOc = document.getElementById('ed-busca-oc');
    if (bOc) bOc.addEventListener('input', function(){ state.buscaOc = bOc.value; var pos = bOc.selectionStart; bOc.blur(); mostrar(true); var b2 = document.getElementById('ed-busca-oc'); b2.focus(); b2.setSelectionRange(pos, pos); });
    var filtro = document.getElementById('ed-filtro-ementario');
    if (filtro) filtro.addEventListener('input', function(){ state.filtroEmentario = filtro.value; var pos = filtro.selectionStart; filtro.blur(); mostrar(true); var f2 = document.getElementById('ed-filtro-ementario'); f2.focus(); f2.setSelectionRange(pos, pos); });
  }
  // valor da multa: só números, já formatado em reais enquanto digita
  app.addEventListener('input', function(e){
    var t = e.target;
    if (t.id !== 'ed-multaValor') return;
    var v = valorDeReais(t.value);
    t.value = v ? reais(v) : '';
  });
  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'ed-penalidadeTipo') { var mb = document.getElementById('multa-box'); if (mb) mb.style.display = t.value === 'multa' ? '' : 'none'; }
    if (t.id === 'ed-arquivos') { enviarArquivos(t.files, document.getElementById('ed-categoria').value, rascunho.id, document.getElementById('upl-status')); t.value = ''; }
    if (t.id === 'ed-categoria') state.categoriaUp = t.value;
    if (t.id === 'importar') { importarPacote(t.files); t.value = ''; }
    if (t.id === 'sel-condo') { state.condo = t.value; mostrar(true); }
  });
  app.addEventListener('click', function(e){
    var el = e.target.closest('button, .card, .linha, [data-ir]');
    if (!el) return;
    var d = el.dataset;
    if (d.condo) { state.condo = d.condo; mostrar(true); return; }
    if (d.filtroSessao) { state.filtroSessao = d.filtroSessao; mostrar(true); return; }
    if (d.verPor) { state.verPor = d.verPor; mostrar(true); return; }
    if (d.ir) { ir(d.ir); return; }
    if (d.editar) { e.stopPropagation(); abrirEdicao(d.editar); return; }
    if (d.recurso) { ir('recurso', { recursoId:d.recurso, passo:0 }); return; }
    if (d.sessao) { ir('sessao', { sessaoId:d.sessao }); return; }
    if (d.voltarSessao) { ir('sessao', { sessaoId:d.voltarSessao }); return; }
    if (d.passo != null) { state.passo = parseInt(d.passo, 10); mostrar(true); window.scrollTo(0, 0); return; }
    if (d.edpasso != null) {
      var alvo = parseInt(d.edpasso, 10);
      if (state.view === 'editar' && state.editarPasso < 2) lerFormulario();
      // recurso ainda não salvo: ir para "Arquivos" salva os dados primeiro (antes o botão ficava travado sem explicar)
      if (state.view === 'editar' && !rascunho.id && alvo >= 2) { salvarRecurso(alvo); return; }
      state.editarPasso = alvo; mostrar(true); return;
    }
    if (d.abrir) { abrirProva(d.abrir); return; }
    if (d.ver) { verArquivo(d.ver); return; }
    if (d.analisePdf) { analisePdf(d.analisePdf); return; }
    if (d.analiseRascunho != null) { analisePdf(null, true); return; }
    if (d.removerProva != null) { removerProva(rascunho.id, parseInt(d.removerProva, 10)); return; }
    if (d.ementaPdf) { ementaPdf(d.ementaPdf); return; }
    if (d.aprovarConselho) { aprovarConselho(d.aprovarConselho); return; }
    if (d.desvincular) { desvincular(d.desvincular); return; }
    switch (el.id) {
      case 'nova-sessao': novaSessao(); break;
      case 'novo-recurso': abrirEdicao(null, state.sessaoId); break;
      case 'editar-sessao': editarSessao(); break;
      case 'nova-ocorrencia': novaOcorrencia(); break;
      case 'oc-data': dataOcorrencia(); break;
      case 'oc-liberar': atualizarOcorrencia({ liberado:true }, 'Liberar a ocorrência #' + recursos[state.recursoId].ocorrencia + ' ao conselho?\nSíndico e conselheiros passam a ver o resumo e as provas.'); break;
      case 'oc-recolher': atualizarOcorrencia({ liberado:false }, 'Recolher esta ocorrência? O conselho deixa de ver.'); break;
      case 'oc-realizada': atualizarOcorrencia({ realizada:true }); break;
      case 'oc-desfazer': atualizarOcorrencia({ realizada:false }); break;
      case 'liberar': liberarSessao(true); break;
      case 'recolher': if (confirm('Recolher esta sessão? O conselho deixa de ver os recursos.')) liberarSessao(false); break;
      case 'marcar-realizada': db.collection('sessoesJulgamento').doc(state.sessaoId).update({ realizada:true }).catch(function(e){ avisoErro(e.message); }); break;
      case 'desfazer-realizada': db.collection('sessoesJulgamento').doc(state.sessaoId).update({ realizada:false }).catch(function(e){ avisoErro(e.message); }); break;
      case 'excluir-sessao': if (confirm('Excluir esta sessão vazia?')) db.collection('sessoesJulgamento').doc(state.sessaoId).delete().then(function(){ ir('lista'); }); break;
      case 'ed-salvar': salvarRecurso(); break;
      case 'dec-salvar': salvarDecisao(); break;
      case 'dec-sugerir': sugerirEmenta(); break;
      case 'dec-apagar':
        if (confirm('Apagar a decisão lançada? O recurso volta a "decisão a lançar".'))
          db.collection('recursosJulgamento').doc(rascunho.id).update({ decisao:FV.delete(), provasExpiramEm:FV.delete() }).then(function(){ delete rascunho.decisao; mostrar(true); });
        break;
      case 'excluir-recurso':
        var r = recursos[rascunho.id];
        if (!confirm('Excluir o recurso #' + r.ocorrencia + ' e os arquivos dele do portal?\n(Os originais continuam no Google Drive.)')) return;
        Promise.all((r.provas || []).map(function(pv){ return storage.ref(pv.caminho).delete().catch(function(){}); }))
          .then(function(){ return db.collection('recursosJulgamento').doc(r.id).delete(); })
          .then(function(){ ir('lista'); }).catch(function(e){ avisoErro(e.message); });
        break;
      case 'marcar-lido': marcarLido(); break;
    }
  });

  // atalhos para o teste automatizado (não mudam nada na tela)
  window.__julgamentos = { estado:function(){ return { equipe:equipe, admin:admin, condos:condos, sessoes:Object.keys(sessoes).length, recursos:Object.keys(recursos).length, view:state.view }; } };
})();
</script>
