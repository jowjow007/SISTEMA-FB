<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Condomínios — Fonseca e Braga</title>
<style>
  :root{
    --ink:#161010;
    --panel:#211918;
    --panel-2:#2a1f1e;
    --paper:#ece6e1;
    --muted:#9c908b;
    --red:#b8362e;
    --red-bright:#c9463c;
    --red-deep:#5c1a16;
    --silver:#a9adb2;
    --gold:#c9a15a;
    --line:rgba(236,230,225,0.10);
    --line-strong:rgba(236,230,225,0.20);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:var(--font-body);}
  a{color:inherit;}

  header{
    position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-strong);
    padding:16px 20px 14px;
  }
  header h1{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin:0 0 2px;color:var(--paper);}
  header .sub{font-size:.8rem;color:var(--muted);margin:0;}

  main{max-width:760px;margin:0 auto;padding:30px 20px 70px;}

  .hub{
    background:linear-gradient(160deg,var(--red-deep),var(--red-bright));
    border:1px solid var(--red-bright);border-radius:14px;
    padding:14px 26px;text-align:center;box-shadow:0 10px 30px rgba(184,54,46,.25);
    margin:0 0 28px;
  }
  .hub .kicker{font-size:.68rem;letter-spacing:.12em;color:#ffd9d5;text-transform:uppercase;font-weight:700;}
  .hub h2{font-family:var(--font-display);font-size:1.15rem;margin:4px 0 2px;color:#fff;}
  .hub .hint{font-size:.74rem;color:#ffe3e0;opacity:.9;}

  /* vertical sub-tabs, stacked at the top */
  .condo-tabs{
    display:flex;flex-direction:column;gap:6px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;
    padding:8px;margin:0 0 22px;
  }
  .condo-tab{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;
    padding:10px 14px;font-family:var(--font-body);font-size:.86rem;color:var(--paper);
    cursor:pointer;transition:background .15s,border-color .15s;
  }
  .condo-tab:hover{background:var(--panel-2);}
  .condo-tab .name{font-weight:600;}
  .condo-tab .flag{font-size:.68rem;color:var(--gold);opacity:.85;}
  .condo-tab.active{background:var(--panel-2);border-color:var(--red);}
  .condo-tab.active .name{color:#ffb4ae;}
  .condo-tab .chev{color:var(--muted);font-size:.75rem;transform:rotate(0deg);transition:transform .15s;}
  .condo-tab.active .chev{color:var(--red-bright);transform:rotate(90deg);}

  .condo-detail{
    background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
    padding:24px 26px 26px;
  }
  .condo-detail h3{
    font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0 0 14px;color:var(--paper);
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:18px;}
  .field{min-width:0;}
  .field .label{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .field .value{font-size:.9rem;color:var(--paper);word-break:break-word;}
  .field .value.empty{color:var(--muted);}

  .badge-plat{
    display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.03em;color:var(--gold);
    background:rgba(201,161,90,.12);border:1px solid rgba(201,161,90,.35);border-radius:20px;
    padding:2px 10px;
  }

  .note-box{
    display:flex;gap:10px;align-items:flex-start;
    background:rgba(184,54,46,.10);border:1px solid rgba(184,54,46,.35);border-radius:10px;
    padding:12px 14px;margin-top:4px;
  }
  .note-box .ico{font-size:1rem;line-height:1.3;}
  .note-box p{margin:0;font-size:.82rem;color:#ffd9d5;line-height:1.5;}
  .note-box p b{color:#fff;}

  .no-note{font-size:.8rem;color:var(--muted);font-style:italic;}

  footer.note{max-width:760px;margin:0 auto;padding:0 20px 40px;font-size:.72rem;color:var(--muted);text-align:center;}

  @media(max-width:560px){
    .field-grid{grid-template-columns:1fr;}
    main{padding:20px 14px 50px;}
  }
</style>
</head>
<body>

<header>
  <h1>Condomínios Atendidos</h1>
  <p class="sub">Síndicos, plataforma e particularidades de cada condomínio — clique em um nome para abrir.</p>
</header>

<main>
  <div class="hub">
    <div class="kicker">Fonseca e Braga · Sociedade de Advogados</div>
    <h2>Condomínios</h2>
    <div class="hint" id="hub-hint">10 condomínios ativos</div>
  </div>

  <div class="condo-tabs" id="condo-tabs"></div>

  <div class="condo-detail" id="condo-detail"></div>
</main>

<footer class="note">Fonseca e Braga — Sociedade de Advogados · Documentos internos, uso restrito da equipe.</footer>

<script>
  var CONDOMINIOS = [
    { nome:"Arven", sindico:"Alessandra", plataforma:"BRCondos", cnpj:"", endereco:"", nota:"" },
    { nome:"Chess", sindico:"Karen", plataforma:"BRCondos", cnpj:"", endereco:"",
      nota:"Conselho incompleto; recursos com tramitação pausada — aguardar eleição do conselho para sessão de julgamento de recursos." },
    { nome:"Duo", sindico:"Juliano", plataforma:"BRCondos", cnpj:"", endereco:"", nota:"" },
    { nome:"Bella Vida Residence", sindico:"Lucas", plataforma:"BRCondos", cnpj:"", endereco:"", nota:"" },
    { nome:"Bella Vita", sindico:"Monaline", plataforma:"BRCondos", cnpj:"", endereco:"",
      nota:"Reabrir todas as ocorrências em nome do jurídico (encerrar as existentes primeiro)." },
    { nome:"Smart Towers", sindico:"A verificar", plataforma:"BRCondos", cnpj:"", endereco:"",
      nota:"Verificar composição do conselho." },
    { nome:"Village Unique", sindico:"Alessandra", plataforma:"BRCondos", cnpj:"", endereco:"", nota:"" },
    { nome:"Sense Vertical Living", sindico:"Michelle", plataforma:"BRCondos", cnpj:"", endereco:"",
      nota:"Possui modelo próprio de notificação — não usar o padrão geral. Registro de ocorrência = notificação verbal (modelo próprio)." },
    { nome:"Mirante das Brisas", sindico:"Andreia Machado dos Santos", plataforma:"BRCondos",
      cnpj:"54.803.117/0001-32", endereco:"R. Ciano, 385 — Grand Ville, Uberlândia/MG, 38407-885",
      nota:"Maior volume de ocorrências. Infrações envolvendo animais geram multa automática independente de advertência prévia (Art. 52 § único do RI). Notificações devem sempre citar Art. 14 II e Art. 15 I como artigos fixos." },
    { nome:"Origon", sindico:"Monaline", plataforma:"BRCondos", cnpj:"", endereco:"",
      nota:"Reabrir todas as ocorrências em nome do jurídico (encerrar as existentes primeiro)." }
  ];

  var tabsEl = document.getElementById('condo-tabs');
  var detailEl = document.getElementById('condo-detail');
  var hint = document.getElementById('hub-hint');
  hint.textContent = CONDOMINIOS.length + ' condomínios ativos';

  function fieldHtml(label, value){
    var v = value && value.trim() ? value : '—';
    return '<div class="field"><div class="label">'+label+'</div><div class="value'+(v==='—'?' empty':'')+'">'+v+'</div></div>';
  }

  function render(idx){
    var c = CONDOMINIOS[idx];

    tabsEl.innerHTML = CONDOMINIOS.map(function(item, i){
      var active = i === idx ? ' active' : '';
      var flag = item.nota ? '<span class="flag">⚠ atenção</span>' : '';
      return '<button type="button" class="condo-tab'+active+'" data-i="'+i+'">'
        + '<span class="name">'+item.nome+'</span>'
        + '<span style="display:flex;align-items:center;gap:10px;">'+flag+'<span class="chev">▸</span></span>'
        + '</button>';
    }).join('');

    Array.prototype.forEach.call(tabsEl.querySelectorAll('.condo-tab'), function(btn){
      btn.addEventListener('click', function(){ render(parseInt(btn.getAttribute('data-i'), 10)); });
    });

    var noteHtml = c.nota
      ? '<div class="note-box"><span class="ico">⚠️</span><p><b>Particularidade:</b> '+c.nota+'</p></div>'
      : '<p class="no-note">Sem particularidades registradas — segue o procedimento padrão.</p>';

    detailEl.innerHTML =
      '<h3>'+c.nome+'</h3>'
      + '<div class="field-grid">'
        + fieldHtml('Síndico(a)', c.sindico)
        + '<div class="field"><div class="label">Plataforma</div><div class="value"><span class="badge-plat">'+c.plataforma+'</span></div></div>'
        + fieldHtml('CNPJ', c.cnpj)
        + fieldHtml('Endereço', c.endereco)
      + '</div>'
      + noteHtml;
  }

  render(0);
</script>

</body>
</html>
