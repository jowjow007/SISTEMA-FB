<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual Operacional — Fonseca e Braga</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('fb-portal-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key === 'fb-portal-theme'){
      if(e.newValue === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }
  });
})();
</script>
<style>
  :root{
    --ink:#161010;
    --paper:#211918;
    --card:#2a1f1e;
    --card-line:rgba(236,230,225,0.14);
    --text:#ece6e1;
    --muted:#9c908b;
    --red:#8a231f;
    --red-bright:#a8332c;
    --red-deep:#5c1a16;
    --red-pale:rgba(184,54,46,0.18);
    --gold:#b8862f;
    --green-bg:rgba(76,154,106,.18);
    --green-text:#6fcf8f;
    --warn-bg:rgba(233,201,138,0.16);
    --warn-line:#e9c98a;
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"Consolas","SFMono-Regular",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --paper:#faf7f2;
    --card:#ffffff;
    --card-line:#e7e1d8;
    --text:#211a17;
    --muted:#7c716a;
    --red-pale:#f7e6e4;
    --green-bg:#e3f3e6;
    --green-text:#256b38;
    --warn-bg:#fdf0e0;
    --warn-line:#e9c98a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font-family:var(--font-body);transition:background-color .2s,color .2s;}
  a{color:inherit;}
  h1,h2,h3{font-family:var(--font-display);}

  /* top bar */
  .topbar{
    position:sticky;top:0;z-index:6;background:var(--ink);color:#ece6e1;
    padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{flex:0 0 auto;display:flex;align-items:center;}
  .brand img{height:34px;width:auto;object-fit:contain;display:block;}
  .search{
    flex:1 1 260px;display:flex;align-items:center;gap:8px;background:#2a2220;border:1px solid #3a302c;border-radius:8px;
    padding:8px 12px;color:#c9c0ba;font-size:.82rem;min-width:200px;max-width:520px;
  }

  /* horizontal nav (replaces the reference site's vertical sidebar) */
  nav.tabs{
    position:sticky;top:63px;z-index:5;background:var(--card);border-bottom:1px solid var(--card-line);
    display:flex;gap:2px;overflow-x:auto;padding:0 14px;
  }
  nav.tabs button{
    flex:0 0 auto;background:transparent;border:none;border-bottom:3px solid transparent;
    padding:13px 14px;font-family:var(--font-body);font-size:.82rem;font-weight:600;color:var(--muted);
    cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--red);border-bottom-color:var(--red);}

  main{max-width:1180px;margin:0 auto;padding:34px 22px 80px;}
  .kicker{font-size:.68rem;letter-spacing:.12em;color:var(--red);text-transform:uppercase;font-weight:700;margin:0 0 8px;}
  main h1{font-size:2rem;margin:0 0 10px;color:var(--text);font-weight:600;}
  main .lead{font-size:.95rem;color:var(--muted);max-width:760px;line-height:1.55;margin:0 0 24px;}
  hr.rule{border:none;border-top:1px solid var(--card-line);margin:0 0 30px;}

  h2.section-h{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:600;color:var(--text);margin:0 0 14px;}
  h2.section-h .ic{font-size:1.1rem;}

  .grid{display:grid;gap:18px;}
  .grid.g2{grid-template-columns:1fr 1fr;}
  .grid.g3{grid-template-columns:repeat(3,1fr);}
  .grid.g5{grid-template-columns:repeat(3,1fr);}

  .card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:20px;}
  .card h3{font-size:1.02rem;margin:0 0 6px;color:var(--text);}
  .card p{font-size:.85rem;color:var(--muted);line-height:1.5;margin:0;}
  .card .acessar{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:.8rem;font-weight:700;color:var(--red);cursor:pointer;background:none;border:none;padding:0;font-family:var(--font-body);}

  .icon-sq{width:38px;height:38px;border-radius:9px;background:var(--red-pale);color:var(--red);display:flex;align-items:center;
    justify-content:center;font-size:1.05rem;margin-bottom:10px;}

  .box{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .box p{font-size:.87rem;line-height:1.6;margin:0 0 10px;color:var(--text);}
  .box p:last-child{margin-bottom:0;}
  .box ul{margin:6px 0;padding-left:20px;font-size:.87rem;line-height:1.65;}
  .box ol{margin:6px 0;padding-left:20px;font-size:.87rem;line-height:1.7;}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--card-line);border-radius:12px;overflow:hidden;margin-bottom:16px;}
  .split > div{padding:16px 18px;font-size:.85rem;line-height:1.55;}
  .split > div:first-child{border-right:1px solid var(--card-line);border-left:3px solid var(--red);}
  .split > div:last-child{border-left:3px solid var(--gold);}
  .split .t{font-weight:700;margin-bottom:4px;color:var(--text);font-size:.88rem;}
  .split .t + p, .split div > p{color:var(--muted);margin:0;}

  .warn{display:flex;gap:10px;background:var(--red-pale);border:1px solid #e6b9b3;border-radius:10px;padding:13px 16px;margin-bottom:16px;font-size:.84rem;line-height:1.55;color:#5c1a16;}
  .warn.gold{background:var(--warn-bg);border-color:var(--warn-line);color:#6b4d15;}
  .warn .ic{flex:0 0 auto;}

  .steps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .step{display:flex;gap:12px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:14px 16px;}
  .step .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:.78rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;}
  .step .b{font-weight:700;font-size:.85rem;margin-bottom:2px;}
  .step .d{font-size:.78rem;color:var(--muted);line-height:1.45;}

  table.sla{width:100%;border-collapse:collapse;font-size:.83rem;}
  table.sla th{text-align:left;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--card-line);}
  table.sla td{padding:9px 6px;border-bottom:1px solid var(--card-line);}
  table.sla .pill{display:inline-block;background:var(--red-pale);color:var(--red);font-size:.72rem;font-weight:700;border-radius:14px;padding:2px 10px;}

  .badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:2px 10px;text-transform:uppercase;}
  .badge.ativo{background:var(--green-bg);color:var(--green-text);}
  .badge.atencao{background:#fbe2df;color:#a3312a;}
  .badge.tag{background:#f1ece4;color:#6b6058;}

  /* condo grid + detail */
  .condo-card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:18px;display:flex;flex-direction:column;}
  .condo-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .condo-card h3{margin:0 0 4px;font-size:1.05rem;}
  .condo-card .sind{font-size:.8rem;color:var(--muted);margin:0 0 8px;}
  .condo-card .note{font-size:.76rem;color:#a3312a;margin:0 0 10px;line-height:1.4;}
  .condo-card button.ver{margin-top:auto;background:var(--card);border:1px solid var(--card-line);border-radius:8px;padding:9px 14px;
    font-size:.82rem;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:var(--font-body);}
  .condo-card button.ver:hover{border-color:var(--red);color:var(--red);}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:.83rem;color:var(--muted);background:none;border:none;
    cursor:pointer;padding:0;margin-bottom:14px;font-family:var(--font-body);}
  .back-link:hover{color:var(--red);}

  .condo-subnav{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--card-line);border-radius:9px;
    padding:3px;margin-bottom:22px;}
  .condo-subnav button{background:transparent;border:none;border-radius:6px;padding:8px 16px;font-family:var(--font-body);
    font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;}
  .condo-subnav button.active{background:var(--red);color:#fff;}

  .almah-card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;overflow:hidden;}
  .almah-head{padding:14px 18px;color:#fff;}
  .almah-head.open{background:#16305c;}
  .almah-head.closed{background:#c0392b;}
  .almah-head h3{margin:0;font-size:1rem;font-family:var(--font-body);font-weight:700;}
  .almah-head p{margin:2px 0 0;font-size:.75rem;opacity:.85;}
  .almah-rows{padding:6px 18px 14px;}
  .almah-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--card-line);}
  .almah-row:last-child{border-bottom:none;}
  .almah-sw{flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:1px solid var(--card-line);margin-top:2px;}
  .almah-row b{display:block;font-size:.82rem;letter-spacing:.02em;}
  .almah-row span{font-size:.8rem;color:var(--muted);line-height:1.4;}
  .almah-legend-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.8rem;}
  .almah-legend-row .almah-sw{width:16px;height:16px;border-radius:4px;margin-top:0;}

  .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--card-line);margin-bottom:20px;overflow-x:auto;}
  .subtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;margin-right:22px;
    font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
  .subtabs button.active{color:var(--red);border-bottom-color:var(--red);}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .field-box{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:14px 16px;}
  .field-box .label{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .field-box .value{font-size:.92rem;color:var(--text);}
  .obs-box{display:flex;gap:10px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:14px 16px;}
  .obs-box .label{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .empty-tab{font-size:.85rem;color:var(--muted);font-style:italic;padding:30px 0;text-align:center;}

  /* nomenclatura */
  .nom-types{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .nom-types button{flex:1 1 160px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:16px 10px;
    text-align:center;font-family:var(--font-body);font-size:.83rem;font-weight:600;color:var(--text);cursor:pointer;}
  .nom-types button .ic{display:block;font-size:1.2rem;margin-bottom:6px;}
  .nom-types button.active{background:var(--red);border-color:var(--red);color:#fff;}
  .nom-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .nom-form label{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .nom-form input,.nom-form select{width:100%;padding:9px 11px;border:1px solid var(--card-line);border-radius:8px;font-size:.85rem;
    font-family:var(--font-body);background:var(--card);color:var(--text);}
  .nom-result{background:var(--paper);border:1px solid var(--card-line);border-radius:10px;padding:16px;font-family:var(--font-mono);
    font-size:.85rem;color:var(--text);min-height:70px;word-break:break-word;line-height:1.5;}
  .copy-btn{margin-top:14px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-weight:700;
    font-size:.85rem;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);}
  .copy-btn:active{background:var(--red-deep);}

  .link-card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:18px;}
  .link-card .lt{display:flex;justify-content:space-between;align-items:center;}
  .link-card h3{margin:0;font-size:1.05rem;}
  .link-card p{font-size:.83rem;color:var(--muted);margin:6px 0 8px;}
  .link-card code{font-size:.78rem;color:var(--red);}

  .external-btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:none;border-radius:8px;
    padding:11px 18px;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:none;font-family:var(--font-body);}

  /* gerar notificacao / notificacoes prontas */
  .auth-gate{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:22px;font-size:.87rem;color:var(--muted);}
  .btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:.83rem;font-weight:700;
    cursor:pointer;font-family:var(--font-body);}
  .btn.secondary{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--card-line);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  textarea{width:100%;padding:9px 11px;border:1px solid var(--card-line);border-radius:8px;font-size:.85rem;
    font-family:var(--font-body);background:var(--card);color:var(--text);resize:vertical;}

  .status-badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:3px 11px;text-transform:uppercase;}
  .status-badge.pendente{background:var(--warn-bg);color:#8a6416;}
  .status-badge.aprovada{background:var(--green-bg);color:var(--green-text);}
  .status-badge.rejeitada{background:#fbe2df;color:#a3312a;}

  .notif-card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .notif-card .nc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .notif-card h4{margin:0;font-size:.95rem;font-family:var(--font-body);font-weight:700;}
  .notif-card .nc-meta{font-size:.76rem;color:var(--muted);margin:2px 0 8px;}
  .notif-card .nc-texto{font-size:.83rem;line-height:1.55;white-space:pre-wrap;background:var(--paper);border:1px solid var(--card-line);
    border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .notif-card .nc-reason{font-size:.82rem;color:#a3312a;background:#fbe2df;border-radius:8px;padding:8px 12px;margin-top:8px;}
  .nc-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .tentativa-tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--gold);font-weight:700;}

  .filter-chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-chips button{background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:7px 15px;
    font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font-body);}
  .filter-chips button.active{background:var(--red);border-color:var(--red);color:#fff;}

  .assign-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--card-line);flex-wrap:wrap;}
  .assign-row:last-child{border-bottom:none;}
  .assign-row .cn{flex:0 0 190px;font-size:.85rem;font-weight:600;}
  .assign-row select{flex:1 1 220px;padding:8px 10px;border:1px solid var(--card-line);border-radius:8px;font-size:.82rem;
    font-family:var(--font-body);background:var(--card);color:var(--text);}
  .assign-row .cur{flex:1 1 220px;font-size:.8rem;color:var(--muted);}

  footer.note{max-width:1180px;margin:10px auto 40px;padding:0 22px;font-size:.75rem;color:var(--muted);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

  @media(max-width:860px){
    .grid.g2,.grid.g3,.grid.g5,.steps,.field-grid,.split,.nom-form{grid-template-columns:1fr;}
    .split > div:first-child{border-right:none;}
    main{padding:24px 16px 60px;}
  }
</style>
</head>

/* ---------- firebase (aprovação de notificações) ---------- */
var fbReady = false, auth = null, db = null;
var currentUser = null, currentProfile = null, authChecked = false;
try{
  if (typeof firebaseConfig !== 'undefined' && firebaseConfig && firebaseConfig.apiKey !== 'COLE_AQUI_SUA_API_KEY'){
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    fbReady = true;
  }
}catch(e){ fbReady = false; }

function isAdminUser(){ return !!(currentProfile && currentProfile.role === 'admin'); }

function onAuthResolved(){
  if (state.section !== 'gerar-notificacao') return;
  if (state.gerarView === 'aprovacao') { refreshAprovacao(); render(); }
  else { gerarState.minhasLoaded = false; loadMinhasNotificacoes(); render(); }
}

if (fbReady){
  auth.onAuthStateChanged(function(user){
    currentUser = user || null;
    if (!user){ currentProfile = null; authChecked = true; onAuthResolved(); return; }
    db.collection('users').doc(user.uid).get().then(function(doc){
      currentProfile = doc.exists ? Object.assign({uid:user.uid, email:user.email}, doc.data())
                                   : {uid:user.uid, email:user.email, displayName:user.email};
      authChecked = true;
      onAuthResolved();
    }).catch(function(){
      currentProfile = {uid:user.uid, email:user.email, displayName:user.email};
      authChecked = true;
      onAuthResolved();
    });
  });
} else {
  authChecked = true;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function slugify(s){
  var accentRange = new RegExp('[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + ']', 'g');
  return (s || '').toString().toLowerCase()
    .normalize('NFD').replace(accentRange,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
}

function formatDateTime(ts){
  if (!ts || !ts.toDate) return '—';
  return ts.toDate().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* ---------- state / router ---------- */
var state = { section:'inicio', condoIdx:null, condoSubtab:'geral', gerarView:'compor' };

function go(section){
  state.section = section; state.condoIdx = null; state.gerarView = 'compor';
  render(); window.scrollTo(0,0);
  if (section === 'gerar-notificacao') loadMinhasNotificacoes();
}
function openCondo(i){ state.condoIdx = i; state.condoSubtab='geral'; render(); window.scrollTo(0,0); }
function closeCondo(){ state.condoIdx = null; render(); window.scrollTo(0,0); }
function setCondoSubtab(t){ state.condoSubtab = t; render(); }
function setGerarView(v){
  state.gerarView = v;
  render(); window.scrollTo(0,0);
  if (v === 'aprovacao') refreshAprovacao();
  else loadMinhasNotificacoes();
}

/* ---------- render ---------- */
function renderNav(){
  var nav = document.getElementById('tabs-nav');
  nav.innerHTML = SECTIONS.map(function(s){
    var active = s.id === state.section ? ' active' : '';
    return '<button type="button" class="'+active+'" data-s="'+s.id+'">'+s.label+'</button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-s')); });
  });
}

function render(){
  renderNav();
  var m = document.getElementById('main');
  if(state.section === 'inicio') m.innerHTML = viewInicio();
  else if(state.section === 'comece') m.innerHTML = viewComece();
  else if(state.section === 'pops') m.innerHTML = viewPops();
  else if(state.section === 'condominios') m.innerHTML = state.condoIdx!==null ? viewCondoDetail() : viewCondoGrid();
  else if(state.section === 'astrea') m.innerHTML = viewAstrea();
  else if(state.section === 'brcondos') m.innerHTML = viewBrcondos();
  else if(state.section === 'almahcondos') m.innerHTML = viewAlmahCondos();
  else if(state.section === 'notificacoes') m.innerHTML = viewNotificacoes();
  else if(state.section === 'gerar-notificacao') m.innerHTML = state.gerarView==='aprovacao' ? viewNotificacoesProntas() : viewGerarNotificacao();
  else if(state.section === 'nomenclatura') m.innerHTML = viewNomenclatura();
  else if(state.section === 'relatorios-condominiais') m.innerHTML = viewRelatoriosCondominiais();
  else if(state.section === 'links') m.innerHTML = viewLinks();
  bindDynamic();
}

function bindDynamic(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(el){
    el.addEventListener('click', function(){ go(el.getAttribute('data-go')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-open-condo]'), function(el){
    el.addEventListener('click', function(){ openCondo(parseInt(el.getAttribute('data-open-condo'),10)); });
  });
  var back = document.querySelector('[data-back-condo]');
  if(back) back.addEventListener('click', closeCondo);
  Array.prototype.forEach.call(document.querySelectorAll('[data-subtab]'), function(el){
    el.addEventListener('click', function(){ setCondoSubtab(el.getAttribute('data-subtab')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-gerarview]'), function(el){
    el.addEventListener('click', function(){ setGerarView(el.getAttribute('data-gerarview')); });
  });
  if(state.section === 'nomenclatura') bindNomenclatura();
  if(state.section === 'gerar-notificacao' && state.gerarView === 'compor'){
    var gnEnviar = document.getElementById('gn-enviar');
    if (gnEnviar) gnEnviar.addEventListener('click', enviarNotificacao);
    var gnCancelar = document.getElementById('gn-cancelar');
    if (gnCancelar) gnCancelar.addEventListener('click', cancelarEdicao);
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit-notif]'), function(el){
      el.addEventListener('click', function(){ editarNotificacao(el.getAttribute('data-edit-notif')); });
    });
    var gnCondominio = document.getElementById('gn-condominio');
    if (gnCondominio) gnCondominio.addEventListener('change', function(){ setGerarCondominio(this.value); });
    var gnTipo = document.getElementById('gn-tipo');
    if (gnTipo) gnTipo.addEventListener('change', function(){ setGerarTipo(this.value); });
    var gnCategoria = document.getElementById('gn-categoria');
    if (gnCategoria) gnCategoria.addEventListener('change', function(){ setGerarCategoria(this.value); });
    var gnGerarTexto = document.getElementById('gn-gerar-texto');
    if (gnGerarTexto) gnGerarTexto.addEventListener('click', gerarTextoDoModelo);
    var gnConsultarReincidencia = document.getElementById('gn-consultar-reincidencia');
    if (gnConsultarReincidencia) gnConsultarReincidencia.addEventListener('click', consultarReincidencia);
    [['torre','gn-torre'],['apto','gn-apto'],['ocorrencia','gn-ocorrencia'],['texto','gn-texto'],['multaValor','gn-multa-valor'],
     ['dataFato','gn-data-fato'],['oQueAconteceu','gn-o-que-aconteceu']].forEach(function(pair){
      var el = document.getElementById(pair[1]);
      if (el) el.addEventListener('input', function(){ updateDraft(pair[0], pair[1]); });
    });
    var gnHoraFato = document.getElementById('gn-hora-fato');
    if (gnHoraFato) gnHoraFato.addEventListener('input', function(){
      var digits = this.value.replace(/\D/g,'').slice(0,4);
      var formatted = digits.length > 2 ? digits.slice(0,2)+'h'+digits.slice(2) : digits;
      this.value = formatted;
      gerarState.draft.horaFato = formatted;
    });
  }
  if(state.section === 'gerar-notificacao' && state.gerarView === 'aprovacao') bindAprovacao();
}

/* Lista única de categorias de infração, válida para todos os condomínios
   (pedido explícito do usuário, 2026-08-17). O texto/fundamento jurídico de
   cada categoria depende da convenção e do regimento de cada condomínio —
   por enquanto só temos material real do Mirante das Brisas (ver
   MIRANTE_CATEGORIAS acima e o mapeamento CATEGORIA_PARA_MIRANTE logo
   abaixo). Para os demais condomínios e categorias, o texto continua manual
   até o usuário enviar as respectivas convenções/regimentos. */

  'USO INADEQUADO DA INFRAESTRUTURA DO CONDOMÍNIO', 'ADEQUAÇÃO', 'ALTA VELOCIDADE',

  'AUT - ARMÁRIO INTELIGENTE', 'AUT - FALHA DE COMUNICAÇÃO', 'AUT - ORDEM DE SERVIÇO',
  'BARULHO', 'CIGARRO/FUMÍGENO', 'CIRCULAÇÃO ANIMAIS', 'CONDUTA ANTISSOCIAL',
  'CONDUTA INADEQUADA', 'CONSERVAÇÃO DO LOTE', 'CRIANÇAS', 'DANOS',
  'DESACATO URBANIDADE', 'DESCARTE DE RESÍDUOS/LIXO', 'ELEVADORES',
  'ENTRADA E SAÍDA DE VEÍCULOS', 'ESPAÇOS DE FESTAS', 'ESTACIONAMENTO',
  'EVENTO CARONA', 'FACHADA', 'FUMO', 'HALLS SOCIAIS', 'INSTALAÇÃO AR CONDICIONADO',
  'MUDANÇAS', 'NÃO USO DE MÁSCARA', 'OBJETOS HALLS/ÁREAS COMUNS', 'OBJETOS PELA JANELA',
  'OBRAS', 'OUTROS', 'PISCINA', 'PONTO DE GÁS/BOTIJÃO DE GÁS', 'PORTARIA',
  'PRESTADORES DE SERVIÇOS', 'QUIOSQUES', 'SEGURANÇA E MONITORAMENTO',
  'VAGAS DE GARAGEM', 'VAZAMENTOS / INFILTRAÇÕES', 'VISITANTES NA PISCINA'
].map(function(label){ return { id: slugify(label), label: label }; });

/* Onde uma categoria da lista única corresponde claramente a um dos modelos
   reais já extraídos para o Mirante das Brisas, liga os dois (chave = id em
   CATEGORIAS_INFRACAO, valor = id em MIRANTE_CATEGORIAS). O que não está
   aqui ainda não tem modelo pronto — mostra aviso e segue manual. */
var CATEGORIA_PARA_MIRANTE = {
  'estacionamento': 'estacionamento',
  'vagas-de-garagem': 'garagem',
  'alta-velocidade': 'velocidade',
  'circulacao-animais': 'pet-guia',
  'piscina': 'piscina',
  'objetos-pela-janela': 'objeto-janela',
  'cigarro-fumigeno': 'cigarro',
  'criancas': 'criancas',
  'danos': 'dano',
  'entrada-e-saida-de-veiculos': 'pedestre-portao',
  'espacos-de-festas': 'happy-hour',
  'uso-inadequado-da-infraestrutura-do-condominio': 'carrinho',
  'conduta-inadequada': 'trajes'
};

function getMirCategoria(condominio, categoriaId){
  if (condominio !== 'Mirante das Brisas') return null;
  var mirId = CATEGORIA_PARA_MIRANTE[categoriaId];
  if (!mirId) return null;
  return MIRANTE_CATEGORIAS.filter(function(c){ return c.id === mirId; })[0] || null;
}

var gerarState = {
  editingId:null, minhas:[], minhasLoaded:false, submitting:false,
  condSel:null, tipoSel:'Advertência', categoriaSel:'',
  draft:{ torre:'', apto:'', ocorrencia:'', texto:'', multaValor:'', dataFato:'', horaFato:'', oQueAconteceu:'' },
  reincidencia:null
};

/* ---------- ocorrências por unidade (reincidência + zerar) ---------- */

function unidadeResetDocId(condominioSlug, torre, apto){
  return slugify(condominioSlug+'-T'+torre+'-'+apto);
}

function fetchUnidadeReset(condominioSlug, torre, apto){
  return db.collection('unidadeResets').doc(unidadeResetDocId(condominioSlug, torre, apto)).get().then(function(doc){
    return doc.exists ? doc.data() : null;
  });
}

function fetchOcorrenciasUnidade(condominioSlug, torre, apto, apenasAprovadas){
  var q = db.collection('notificacoesGeradas')
    .where('condominioSlug','==',condominioSlug)
    .where('torre','==',torre)
    .where('apto','==',apto);
  if (apenasAprovadas) q = q.where('status','==','aprovada');
  return q.get().then(function(snap){
    return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
}

function aplicarCorteReset(itens, reset){
  if (!reset || !reset.resetAPartirDe) return itens;
  var corte = new Date(reset.resetAPartirDe+'T00:00:00');
  return itens.filter(function(n){
    return !(n.criadoEm && n.criadoEm.toDate && n.criadoEm.toDate() < corte);
  });
}

function ordenarPorData(itens){
  itens.sort(function(a,b){
    var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
    var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
    return tb - ta;
  });
  return itens;
}

function consultarReincidencia(){
  var condominioSlug = slugify(gerarState.condSel || '');
  var torre = gerarState.draft.torre, apto = gerarState.draft.apto;
  if (!torre || !apto){ alert('Preencha torre e apartamento primeiro.'); return; }
  gerarState.reincidencia = { loading:true };
  render();
  Promise.all([
    fetchUnidadeReset(condominioSlug, torre, apto),
    fetchOcorrenciasUnidade(condominioSlug, torre, apto, true)
  ]).then(function(res){
    var reset = res[0], itens = ordenarPorData(aplicarCorteReset(res[1], reset));
    gerarState.reincidencia = { loading:false, total: itens.length, itens: itens, reset: reset };
    render();
  }).catch(function(e){
    gerarState.reincidencia = { loading:false, error: e.message };
    render();
  });
}

function loadMinhasNotificacoes(){
  if (!fbReady || !currentUser || !db) return;
  db.collection('notificacoesGeradas').where('criadoPorUid','==',currentUser.uid).get().then(function(snap){
    gerarState.minhas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    gerarState.minhas.sort(function(a,b){
      var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
      var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
      return tb - ta;
    });
    gerarState.minhasLoaded = true;
    render();
  }).catch(function(e){
    gerarState.minhasLoaded = true;
    console.error('Falha ao carregar minhas notificações', e);
    render();
  });
}

function gv(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

function resetGerarDraft(){
  gerarState.draft = { torre:'', apto:'', ocorrencia:'', texto:'', multaValor:'', dataFato:'', horaFato:'', oQueAconteceu:'' };
  gerarState.categoriaSel = '';
  gerarState.tipoSel = 'Advertência';
  gerarState.reincidencia = null;
}

function editarNotificacao(id){
  var doc = gerarState.minhas.filter(function(n){ return n.id === id; })[0];
  if (!doc) return;
  gerarState.editingId = id;
  gerarState.condSel = doc.condominio;
  gerarState.tipoSel = doc.tipoPenalidade || 'Advertência';
  gerarState.categoriaSel = '';
  gerarState.reincidencia = null;
  gerarState.draft = { torre:doc.torre||'', apto:doc.apto||'', ocorrencia:doc.ocorrencia||'', texto:doc.texto||'', multaValor:'', dataFato:'', horaFato:'', oQueAconteceu:'' };
  render();
  window.scrollTo(0,0);
}

function cancelarEdicao(){ gerarState.editingId = null; resetGerarDraft(); render(); }

function updateDraft(field, elId){
  var el = document.getElementById(elId || ('gn-'+field));
  if (el) gerarState.draft[field] = el.value;
  if (field === 'torre' || field === 'apto') gerarState.reincidencia = null;
}

function setGerarCondominio(v){ gerarState.condSel = v; gerarState.categoriaSel = ''; gerarState.reincidencia = null; render(); }
function setGerarTipo(v){ gerarState.tipoSel = v; render(); }
function setGerarCategoria(v){ gerarState.categoriaSel = v; render(); }

function gerarTextoDoModelo(){
  var cat = getMirCategoria(gerarState.condSel, gerarState.categoriaSel);
  if (!cat) return;
  var torre = gerarState.draft.torre || '[TORRE]', apto = gerarState.draft.apto || '[APTO]';
  var header = MIRANTE_HEADER_TPL.replace('{TORRE}', torre).replace('{APTO}', apto);
  var penalidade = gerarState.tipoSel === 'Multa'
    ? penalidadeMultaTpl(gerarState.draft.multaValor || cat.valorSugerido || '[VALOR]')
    : PENALIDADE_ADVERTENCIA_TPL;
  var hoje = new Date();
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var dataNotif = hoje.getDate()+' de '+meses[hoje.getMonth()]+' de '+hoje.getFullYear();
  var rodape = MIRANTE_RODAPE_TPL.replace('{DATA_NOTIF}', dataNotif);
  var corpo = cat.corpo;

  if (gerarState.draft.dataFato){
    var dataFatoBr = gerarState.draft.dataFato.split('-').reverse().join('/');
    corpo = corpo.split('[DATA]').join(dataFatoBr);
  }
  if (gerarState.draft.horaFato) corpo = corpo.split('[HORA]').join(gerarState.draft.horaFato);
  if (gerarState.draft.oQueAconteceu){
    corpo = corpo.replace(/\[DESCREVER:[^\]]*\]/, gerarState.draft.oQueAconteceu.trim());
  }

  gerarState.draft.texto = header + corpo + '\n\n' + penalidade + rodape;
  render();
}

function enviarNotificacao(){
  if (!fbReady || !currentUser || !currentProfile){ alert('Faça login no Portal para enviar uma notificação.'); return; }
  updateDraft('ocorrencia');
  var condominio = gerarState.condSel || gv('gn-condominio'), torre = gerarState.draft.torre, apto = gerarState.draft.apto,
      ocorrencia = gerarState.draft.ocorrencia, tipoPenalidade = gerarState.tipoSel, texto = gerarState.draft.texto;
  if (!condominio || !texto){ alert('Preencha ao menos o condomínio e o texto da notificação.'); return; }
  if (gerarState.submitting) return;
  gerarState.submitting = true;
  var nome = currentProfile.displayName || currentProfile.email;

  if (gerarState.editingId){
    var atual = gerarState.minhas.filter(function(n){ return n.id === gerarState.editingId; })[0];
    db.collection('notificacoesGeradas').doc(gerarState.editingId).update({
      condominio: condominio, condominioSlug: slugify(condominio),
      torre: torre, apto: apto, ocorrencia: ocorrencia, tipoPenalidade: tipoPenalidade, texto: texto,
      status: 'pendente',
      tentativa: (atual ? (atual.tentativa || 1) : 1) + 1,
      motivoRejeicao: null,
      decididoPorUid: null, decididoPorNome: null, decididoEm: null
    }).then(function(){
      gerarState.editingId = null;
      gerarState.submitting = false;
      resetGerarDraft();
      loadMinhasNotificacoes();
    }).catch(function(e){ gerarState.submitting = false; alert('Não foi possível reenviar: ' + e.message); });
  } else {
    db.collection('notificacoesGeradas').add({
      condominio: condominio, condominioSlug: slugify(condominio),
      torre: torre, apto: apto, ocorrencia: ocorrencia, tipoPenalidade: tipoPenalidade, texto: texto,
      status: 'pendente', tentativa: 1, historico: [], motivoRejeicao: null,
      criadoPorUid: currentUser.uid, criadoPorNome: nome,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      decididoPorUid: null, decididoPorNome: null, decididoEm: null
    }).then(function(){
      gerarState.submitting = false;
      resetGerarDraft();
      loadMinhasNotificacoes();
    }).catch(function(e){ gerarState.submitting = false; alert('Não foi possível enviar: ' + e.message); });
  }
}

function statusLabel(s){ return s === 'pendente' ? 'Aguardando aprovação' : s === 'aprovada' ? 'Aprovada' : 'Rejeitada'; }

function notifCardMinha(n){
  var editing = gerarState.editingId === n.id;
  var tentativaTag = n.tentativa > 1 ? '<span class="tentativa-tag">🔁 tentativa nº '+n.tentativa+'</span>' : '';
  var reason = (n.status === 'rejeitada' && n.motivoRejeicao)
    ? '<div class="nc-reason"><b>Motivo da rejeição'+(n.decididoPorNome ? ' ('+escapeHtml(n.decididoPorNome)+')' : '')+':</b> '+escapeHtml(n.motivoRejeicao)+'</div>'
    : '';
  var actions = (n.status === 'rejeitada' && !editing)
    ? '<div class="nc-actions"><button type="button" class="btn secondary" data-edit-notif="'+n.id+'">Corrigir e reenviar</button></div>'
    : '';
  return '<div class="notif-card">'
    + '<div class="nc-top"><h4>'+escapeHtml(n.condominio)+' — Torre '+escapeHtml(n.torre)+', Apto '+escapeHtml(n.apto)+'</h4>'

    + '<div class="nc-texto">'+escapeHtml(n.texto)+'</div>'

function renderReincidenciaResultado(){
  var r = gerarState.reincidencia;
  if (!r) return '';
  if (r.loading) return '<p style="color:var(--muted);font-size:.82rem;margin-top:8px;">Consultando…</p>';
  if (r.error) return '<p style="color:#a3312a;font-size:.82rem;margin-top:8px;">Erro ao consultar: '+escapeHtml(r.error)+'</p>';
  var resetNota = r.reset
    ? ' <span style="color:var(--muted);">(contagem reiniciada em '+escapeHtml(r.reset.resetAPartirDe.split('-').reverse().join('/'))+' por '+escapeHtml(r.reset.resetPorNome)+')</span>'
    : '';
  if (r.total === 0){
    return '<div class="warn gold" style="margin-top:8px;margin-bottom:0;"><span class="ic">✅</span><span>Nenhuma ocorrência aprovada anterior para esta unidade.'+resetNota+'</span></div>';
  }
  var lista = r.itens.map(function(n){
    return '<li>'+formatDateTime(n.criadoEm)+' — '+escapeHtml(n.tipoPenalidade||'')+(n.ocorrencia ? ' (ocorrência #'+escapeHtml(n.ocorrencia)+')' : '')+'</li>';
  }).join('');
  return '<div class="warn" style="margin-top:8px;margin-bottom:0;"><span class="ic">⚠️</span><span><b>Unidade reincidente — '+r.total+' ocorrência(s) aprovada(s) anteriormente.</b>'+resetNota
    + '<ul style="margin:6px 0 0;padding-left:18px;">'+lista+'</ul></span></div>';
}

  condoAprov:[], condoAprovLoaded:false,
  allUsers:[], allUsersLoaded:false,
  assignMode:false, rejectingId:null,
  consultaAberta:false, consulta:{ condominio:'', torre:'', apto:'', resultado:null, zerarAberto:false, zerarData:'' }
};

function refreshAprovacao(){
  if (!fbReady || !currentUser || !db) return;
  db.collection('condoAprovadores').get().then(function(snap){
    aprovState.condoAprov = snap.docs.map(function(d){ return Object.assign({slug:d.id}, d.data()); });
    aprovState.condoAprovLoaded = true;
    return carregarFilaAprovacao();
  }).then(function(){
    if (isAdminUser() && !aprovState.allUsersLoaded) return carregarUsuarios();
  }).then(function(){ render(); }).catch(function(e){
    aprovState.condoAprovLoaded = true; aprovState.loaded = true;
    console.error('Falha ao carregar aprovação', e); render();
  });
}

function carregarUsuarios(){
  return db.collection('users').get().then(function(snap){
    aprovState.allUsers = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
    aprovState.allUsersLoaded = true;
  });
}

function meusCondosAprovador(){
  if (!currentUser) return [];
  return aprovState.condoAprov.filter(function(c){ return c.aprovadorUid === currentUser.uid; });
}

function carregarFilaAprovacao(){
  var meus = meusCondosAprovador();
  var slugs = meus.map(function(c){ return c.slug; });
  if (!slugs.length){ aprovState.itens = []; aprovState.loaded = true; return Promise.resolve(); }
  return db.collection('notificacoesGeradas').where('condominioSlug','in', slugs.slice(0,10)).get().then(function(snap){
    aprovState.itens = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    aprovState.itens.sort(function(a,b){
      var ta = a.criadoEm && a.criadoEm.toMillis ? a.criadoEm.toMillis() : 0;
      var tb = b.criadoEm && b.criadoEm.toMillis ? b.criadoEm.toMillis() : 0;
      return tb - ta;
    });
    aprovState.loaded = true;
  });
}

function setAprovFiltro(f){ aprovState.filter = f; render(); }

function aprovarNotificacao(id){
  if (!confirm('Aprovar esta notificação?')) return;
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('notificacoesGeradas').doc(id).update({
    status:'aprovada', decididoPorUid: currentUser.uid, decididoPorNome: nome,
    decididoEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ refreshAprovacao(); }).catch(function(e){ alert('Erro ao aprovar: ' + e.message); });
}

function abrirRejeicao(id){ aprovState.rejectingId = id; render(); }
function cancelarRejeicao(){ aprovState.rejectingId = null; render(); }

function confirmarRejeicao(id){
  var el = document.getElementById('rej-motivo-'+id);
  var motivo = el ? el.value.trim() : '';
  if (!motivo){ alert('Escreva o motivo da rejeição.'); return; }
  var item = aprovState.itens.filter(function(n){ return n.id === id; })[0];
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('notificacoesGeradas').doc(id).update({
    status:'rejeitada', motivoRejeicao: motivo,
    decididoPorUid: currentUser.uid, decididoPorNome: nome,
    decididoEm: firebase.firestore.FieldValue.serverTimestamp(),
    historico: firebase.firestore.FieldValue.arrayUnion({
      tentativa: (item ? item.tentativa : 1) || 1, motivo: motivo, por: nome, em: new Date()
    })
  }).then(function(){ aprovState.rejectingId = null; refreshAprovacao(); })
    .catch(function(e){ alert('Erro ao rejeitar: ' + e.message); });
}

function salvarAprovador(slug, condominio){
  var sel = document.getElementById('assign-'+slug);
  if (!sel || !sel.value){ return; }
  var opt = sel.options[sel.selectedIndex];
  db.collection('condoAprovadores').doc(slug).set({
    condominio: condominio, aprovadorUid: sel.value,
    aprovadorNome: opt.getAttribute('data-nome'), aprovadorEmail: opt.getAttribute('data-email')
  }).then(function(){ refreshAprovacao(); }).catch(function(e){ alert('Erro ao salvar: ' + e.message); });
}

function toggleAssignMode(){ aprovState.assignMode = !aprovState.assignMode; render(); }

function toggleConsultaUnidade(){ aprovState.consultaAberta = !aprovState.consultaAberta; render(); }

function condominiosConsultaveis(){
  if (isAdminUser()) return CONDOMINIOS.map(function(c){ return c.nome; });
  return meusCondosAprovador().map(function(c){ return c.condominio; });
}

function consultarUnidadeAprovador(){
  var condominio = gv('consulta-condominio'), torre = gv('consulta-torre'), apto = gv('consulta-apto');
  if (!condominio || !torre || !apto){ alert('Preencha condomínio, torre e apartamento.'); return; }
  aprovState.consulta.condominio = condominio; aprovState.consulta.torre = torre; aprovState.consulta.apto = apto;
  aprovState.consulta.resultado = { loading:true };
  render();
  var slug = slugify(condominio);
  Promise.all([
    fetchUnidadeReset(slug, torre, apto),
    fetchOcorrenciasUnidade(slug, torre, apto, false)
  ]).then(function(res){
    var reset = res[0], todos = ordenarPorData(res[1]);
    var validos = aplicarCorteReset(todos, reset);
    var aprovadas = validos.filter(function(n){ return n.status === 'aprovada'; });
    aprovState.consulta.resultado = { loading:false, total: todos.length, validos: validos, aprovadas: aprovadas.length, reset: reset };
    render();
  }).catch(function(e){
    aprovState.consulta.resultado = { loading:false, error: e.message };
    render();
  });
}

function abrirZerar(){ aprovState.consulta.zerarAberto = true; aprovState.consulta.zerarData = new Date().toISOString().slice(0,10); render(); }
function cancelarZerar(){ aprovState.consulta.zerarAberto = false; render(); }

function confirmarZerar(){
  var data = gv('consulta-zerar-data');
  if (!data){ alert('Escolha a data.'); return; }
  var c = aprovState.consulta;
  var slug = slugify(c.condominio);
  var nome = currentProfile.displayName || currentProfile.email;
  db.collection('unidadeResets').doc(unidadeResetDocId(slug, c.torre, c.apto)).set({
    condominioSlug: slug, condominio: c.condominio, torre: c.torre, apto: c.apto,
    resetAPartirDe: data, resetPorUid: currentUser.uid, resetPorNome: nome,
    resetEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    aprovState.consulta.zerarAberto = false;
    consultarUnidadeAprovador();
  }).catch(function(e){ alert('Erro ao zerar: ' + e.message); });
}

function bindAprovacao(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-aprovar]'), function(el){
    el.addEventListener('click', function(){ aprovarNotificacao(el.getAttribute('data-aprovar')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-abrir]'), function(el){
    el.addEventListener('click', function(){ abrirRejeicao(el.getAttribute('data-rejeitar-abrir')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-confirmar]'), function(el){
    el.addEventListener('click', function(){ confirmarRejeicao(el.getAttribute('data-rejeitar-confirmar')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rejeitar-cancelar]'), function(el){
    el.addEventListener('click', cancelarRejeicao);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-filtro]'), function(el){
    el.addEventListener('click', function(){ setAprovFiltro(el.getAttribute('data-filtro')); });
  });
  var toggleBtn = document.getElementById('assign-toggle');
  if (toggleBtn) toggleBtn.addEventListener('click', toggleAssignMode);
  Array.prototype.forEach.call(document.querySelectorAll('[data-assign-save]'), function(el){
    el.addEventListener('click', function(){
      salvarAprovador(el.getAttribute('data-assign-save'), el.getAttribute('data-condominio'));
    });
  });
  var consultaToggle = document.getElementById('consulta-toggle');
  if (consultaToggle) consultaToggle.addEventListener('click', toggleConsultaUnidade);
  var consultaBuscar = document.getElementById('consulta-buscar');
  if (consultaBuscar) consultaBuscar.addEventListener('click', consultarUnidadeAprovador);
  var zerarAbrir = document.getElementById('consulta-zerar-abrir');
  if (zerarAbrir) zerarAbrir.addEventListener('click', abrirZerar);
  var zerarCancelar = document.getElementById('consulta-zerar-cancelar');
  if (zerarCancelar) zerarCancelar.addEventListener('click', cancelarZerar);
  var zerarConfirmar = document.getElementById('consulta-zerar-confirmar');
  if (zerarConfirmar) zerarConfirmar.addEventListener('click', confirmarZerar);
}

function notifCardAprovador(n){
  var rejecting = aprovState.rejectingId === n.id;
  var tentativaTag = n.tentativa > 1 ? '<span class="tentativa-tag">🔁 já rejeitada '+(n.tentativa-1)+'x antes</span>' : '';
  var reason = (n.status === 'rejeitada' && n.motivoRejeicao)
    ? '<div class="nc-reason"><b>Motivo:</b> '+escapeHtml(n.motivoRejeicao)+'</div>' : '';
  var decidido = (n.status !== 'pendente' && n.decididoPorNome)
    ? '<div class="nc-meta">Decidido por '+escapeHtml(n.decididoPorNome)+' em '+formatDateTime(n.decididoEm)+'</div>' : '';
  var actions = '';
  if (n.status === 'pendente'){
    actions = rejecting
      ? ('<div style="margin-top:10px;"><textarea id="rej-motivo-'+n.id+'" rows="3" placeholder="Explique o que precisa ser corrigido…"></textarea>'
        + '<div class="nc-actions"><button type="button" class="btn" data-rejeitar-confirmar="'+n.id+'">Confirmar rejeição</button>'
        + '<button type="button" class="btn ghost" data-rejeitar-cancelar>Cancelar</button></div></div>')
      : ('<div class="nc-actions"><button type="button" class="btn" data-aprovar="'+n.id+'">✓ Aprovar</button>'
        + '<button type="button" class="btn secondary" data-rejeitar-abrir="'+n.id+'">✕ Rejeitar</button></div>');
  }
  return '<div class="notif-card">'
    + '<div class="nc-top"><h4>'+escapeHtml(n.condominio)+' — Torre '+escapeHtml(n.torre)+', Apto '+escapeHtml(n.apto)+'</h4>'
    + '<span class="status-badge '+n.status+'">'+statusLabel(n.status)+'</span></div>'
    + '<div class="nc-meta">Ocorrência #'+escapeHtml(n.ocorrencia)+' · '+escapeHtml(n.tipoPenalidade)+' · enviada por '+escapeHtml(n.criadoPorNome)+' em '+formatDateTime(n.criadoEm)+' '+tentativaTag+'</div>'
    + '<div class="nc-texto">'+escapeHtml(n.texto)+'</div>'
    + decidido + reason + actions + '</div>';
}

function renderConsultaResultado(){
  var r = aprovState.consulta.resultado;
  if (!r) return '';
  if (r.loading) return '<p style="color:var(--muted);font-size:.82rem;margin-top:10px;">Consultando…</p>';
  if (r.error) return '<p style="color:#a3312a;font-size:.82rem;margin-top:10px;">Erro: '+escapeHtml(r.error)+'</p>';
  var resetNota = r.reset
    ? '<p style="font-size:.78rem;color:var(--muted);margin:6px 0 0;">Contagem reiniciada em '+escapeHtml(r.reset.resetAPartirDe.split('-').reverse().join('/'))+' por '+escapeHtml(r.reset.resetPorNome)+'.</p>'
    : '';
  var lista = r.validos.map(function(n){
    return '<li>'+formatDateTime(n.criadoEm)+' — <span class="status-badge '+n.status+'" style="margin-left:4px;">'+statusLabel(n.status)+'</span> '+escapeHtml(n.tipoPenalidade||'')+'</li>';
  }).join('');
  var zerarBtn = isAdminUser()
    ? (aprovState.consulta.zerarAberto
        ? '<div style="margin-top:10px;"><label style="display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;">Zerar a partir de</label>'
          + '<input id="consulta-zerar-data" type="date" value="'+escapeHtml(aprovState.consulta.zerarData)+'">'
          + '<div class="nc-actions"><button type="button" class="btn" id="consulta-zerar-confirmar">Confirmar zeramento</button>'
          + '<button type="button" class="btn ghost" id="consulta-zerar-cancelar">Cancelar</button></div></div>'
        : '<button type="button" class="btn ghost" id="consulta-zerar-abrir" style="margin-top:10px;">Zerar ocorrências desta unidade (troca de inquilino)</button>')
    : '';
  return '<div class="box" style="margin-top:12px;margin-bottom:0;">'
    + '<p style="margin:0 0 6px;font-size:.85rem;"><b>'+r.aprovadas+'</b> ocorrência(s) aprovada(s) — '+r.total+' registro(s) no total (todos os status)'+(r.reset ? ' desde o último zeramento' : '')+'.</p>'
    + resetNota
    + (r.validos.length ? '<ul style="margin:8px 0 0;padding-left:18px;font-size:.82rem;">'+lista+'</ul>' : '')
    + zerarBtn
  + '</div>';
}

function viewAssignPanel(){
  if (!isAdminUser()) return '';
  var toggleLabel = aprovState.assignMode ? 'Fechar' : '⚙ Atribuir aprovadores por condomínio';
  var body = '';
  if (aprovState.assignMode){
    if (!aprovState.allUsersLoaded){
      body = '<p style="color:var(--muted);font-size:.85rem;">Carregando usuários…</p>';
    } else {
      body = CONDOMINIOS.map(function(c){

        return '<div class="assign-row"><div class="cn">'+escapeHtml(c.nome)+'</div>'
          + '<select id="assign-'+slug+'"><option value="">— selecionar —</option>' + aprovState.allUsers.map(function(u){
              var sel = atual && atual.aprovadorUid === u.uid ? ' selected' : '';
              var nome = u.displayName || u.email;

            }).join('') + '</select>'
          + '<button type="button" class="btn secondary" data-assign-save="'+slug+'" data-condominio="'+escapeHtml(c.nome)+'">Salvar</button>'
          + '<span class="cur">'+(atual ? 'atual: '+escapeHtml(atual.aprovadorNome) : 'sem aprovador definido')+'</span>'
          + '</div>';
      }).join('');

    + (aprovState.assignMode ? '<div style="margin-top:14px;">'+body+'</div>' : '') + '</div>';

  ],
  notificacao: [
    {k:'condominio', label:'Nome do Condomínio'}, {k:'torre', label:'Torre'},
    {k:'apto', label:'Apto'}, {k:'ocorrencia', label:'Ocorrência #'},
    {k:'titulo', label:'Título da Ocorrência'}, {k:'criador', label:'Criador'},
    {k:'data', label:'Data', type:'date'}
  ]
};
var nomValues = {};

function bindNomenclatura(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-nom-type]'), function(b){
    b.addEventListener('click', function(){ nomState.tipo = b.getAttribute('data-nom-type'); render(); });
  });
  renderNomFields();
  document.getElementById('nom-copy').addEventListener('click', copyNomResult);
}

function renderNomFields(){
  var defs = NOM_FIELD_DEFS[nomState.tipo];
  var el = document.getElementById('nom-fields');
  el.innerHTML = defs.map(function(f){
    if(f.type === 'select'){
      return '<div><label>'+f.label+'</label><select data-nk="'+f.k+'">'
        + f.options.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('')
        + '</select></div>';
    }
    return '<div><label>'+f.label+'</label><input data-nk="'+f.k+'" type="'+(f.type||'text')+'" placeholder="'+f.label.toUpperCase()+'"></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-nk]'), function(inp){
    inp.addEventListener('input', updateNomResult);
    inp.addEventListener('change', updateNomResult);
  });
  updateNomResult();
}

function abrevData(v){
  if(!v) return '';
  var p = v.split('-');
  if(p.length !== 3) return v;
  return p[2] + '.' + p[1] + '.' + p[0].slice(2);
}

function nomVal(k){
  var el = document.querySelector('[data-nk="'+k+'"]');
  if(!el) return '';
  return el.value.trim();
}

function updateNomResult(){
  var tipo = nomState.tipo;
  var out = '';
  if(tipo === 'judicial'){
    var autor=nomVal('autor').toUpperCase(), reu=nomVal('reu').toUpperCase(), peca=nomVal('peca').toUpperCase(),
        valor=nomVal('valor').toUpperCase(), criador=nomVal('criador').toUpperCase(), data=abrevData(nomVal('data'));
    var parts = ['('+(autor||'AUTOR')+' X '+(reu||'RÉU')+')', peca||'NOME DA PEÇA'];
    if(valor) parts.push(valor);
    parts.push(criador||'CRIADOR', data||'DD.MM.AA');
    out = parts.join(' – ');
  } else if(tipo === 'administrativo'){
    var p1=nomVal('parte1').toUpperCase(), p2=nomVal('parte2').toUpperCase(), arq=nomVal('arquivo').toUpperCase(),
        val=nomVal('valor').toUpperCase(), cr=nomVal('criador').toUpperCase(), dt=abrevData(nomVal('data'));
    var partyStr = p2 ? '('+(p1||'PARTE 1')+' X '+p2+')' : '('+(p1||'PARTE')+')';
    var parts2 = [partyStr, arq||'NOME DO ARQUIVO'];
    if(val) parts2.push(val);
    parts2.push(cr||'CRIADOR', dt||'DD.MM.AA');
    out = parts2.join(' – ');
  } else if(tipo === 'honorarios'){
    var pt=nomVal('parte').toUpperCase(), tp=nomVal('tipo')||'AVULSO JUDICIAL',
        cr2=nomVal('criador').toUpperCase(), dt2=abrevData(nomVal('data'));
    out = '('+(pt||'PARTE')+') – CPSHA - '+tp+' – '+(cr2||'CRIADOR')+' – '+(dt2||'DD.MM.AA');
  } else if(tipo === 'notificacao'){
    var cond=nomVal('condominio').toUpperCase(), torre=nomVal('torre'), apto=nomVal('apto'),
        oc=nomVal('ocorrencia'), tit=nomVal('titulo').toUpperCase(), cr3=nomVal('criador').toUpperCase(),
        dataRaw3=nomVal('data'), dt3 = dataRaw3 ? dataRaw3.split('-').reverse().join('.') : '';
    out = '(COND. '+(cond||'X')+' X T'+(torre||'X')+', APTO '+(apto||'XXX')+') #'+(oc||'000')
      + ' – '+(tit||'TÍTULO DA OCORRÊNCIA')+' - '+(cr3||'CRIADOR')+' - '+(dt3||'DD.MM.AAAA');
  }
  var resEl = document.getElementById('nom-result');
  if(resEl) resEl.textContent = out;
}

function copyNomResult(){
  var txt = document.getElementById('nom-result').textContent;
  var btn = document.getElementById('nom-copy');
  var done = function(){ var old = btn.innerHTML; btn.innerHTML = '✓ Copiado'; setTimeout(function(){ btn.innerHTML = old; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, cb){
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

render();
</script>

</body>
